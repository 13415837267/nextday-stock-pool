# =====================================================================
# 策略自进化治理策略 (evolution policy) —— tools/evolve.py 的唯一裁决依据
#
# 第一百二十二轮入库。改这个文件 = 改"什么样的改动可以自动上线"，
# 属于**治理变更**：必须人工走 PR，禁止由引擎自己修改自己。
# 引擎只读它，不写它。
# =====================================================================
version: 1
updated: "2026-11-02"

windows:
  # 封存区起点：此日及之后的行情在 fast / extended 两段中**不可见**。
  # 只有通过前三道门的候选，才允许用预算解锁封存区做最后确认。
  holdout_start: "2025-07-01"
  history_days: 3378      # 建一次上下文取全部历史，各窗口从里面切片（省内存/省时间）
  # 注意：fast 的基线与 README 首页的"最近 1500 日"不是同一段行情（后者含封存区），不可互引。
  fast_days: 1500         # 第一道：封存区之前最近 1500 日（只做筛选，不下结论）
  extended_days: 0        # 第二道：封存区之前全部历史（0 = 全部），主口径

gates:
  # 噪声带（与 ab_test.py 护栏同源）：落在带内一律判 REJECT_NOISE，不算"改进"
  noise_band_rel_pct: 3.0
  noise_band_delta_kama: 0.15

  # ── 第一道（快筛）：只要求"没有明确变坏"，把坏候选挡在昂贵的全史回测之外
  fast_min_rel_pct: -3.0        # 相对收益不低于 -3%
  fast_min_delta_kama: -0.15    # 卡玛下滑不超过 0.15

  # ── 第二道（主口径）
  ext_min_rel_pct: 3.0          # 相对收益至少 +3%（与 ab_test 噪声带同源）
  ext_min_delta_kama: 0.05      # 卡玛至少 +0.05
  ext_max_dd_worse_pp: 1.0      # 最大回撤恶化不超过 1.0pp

  # ── 第三道（分年一致性）
  # 由 extended 那一次回测的净值曲线按自然年分解，不额外跑回测（成本可控的关键）
  year_win_ratio: 0.5           # 改善年份占比 >= 50%
  year_worst_delta_pp: -5.0     # 最差单年相对收益不低于 -5pp

  # ── 第四道（邻域平台，只对数值型候选）
  neighbor_delta_kama: -0.05    # 相邻两档的卡玛下滑不超过 0.05，否则判为孤立尖峰

  # ── 第五道（封存区确认）
  holdout_min_rel_pct: 3.0
  holdout_min_delta_kama: 0.0

# 封存区滚动规则（人工治理，引擎不执行）：
#   holdout 超过 500 个交易日时，由人工 PR 把 holdout_start 前推一年、旧段并入 extended，
#   并把 version +1。理由：一段数据被 4 次预算看过之后，"独立"价值已衰减；
#   但不允许引擎自己挪这条线 —— 那等于让它把封存区挪到自己看过的行情上。
budget:
  # 封存区是稀缺资源：每解锁一次就记一次账，用尽后新候选排队到明年。
  # 这是本引擎对"数据窥探"唯一的硬约束 —— 不设上限，循环本身就会把封存区磨成训练集。
  holdout_limit_per_year: 4

limits:
  max_candidates_per_run: 2     # 单次工作流最多裁决 2 个候选（控制分钟数与多重比较）
  cooldown_days: 365            # 被拒指纹的冷却期，期内同指纹直接 SKIP_KNOWN
  max_runtime_min: 150

autonomy:
  # auto   = 通过全部门后，工作流直接提交 main
  # review = 通过后只开 PR，人工合并才生效
  # never  = 通过也只写账本，不产生任何变更（定时任务直接跳过，不浪费机时）
  #
  # 为什么 parameter 是 never：第一百二十一轮的 Kendall W 检验给出
  # bias20_max W=0.058(chi2=3.03, df=4, 临界 9.49)、dip_vol_ratio_max W=0.008，
  # 即参数排名在年份之间与抛硬币无异。参数层已经不可辨识，
  # 任何"自动搜参数"的机制都只是在批量生产过拟合，必须从治理层禁掉。
  structure: review
  risk: auto
  parameter: never
