# =====================================================================
# 预注册候选池 (evolution candidates)
#
# 规则（硬约束，写在最前面）：
#   1. 引擎**不会自己发明候选**。想让它评估一个新假设，必须在这里登记。
#      这一条是对"多重比较"唯一的物理防线：没有登记就没有试验，没有试验就没有 p-hacking。
#   2. id 一旦被拒，同 patch 指纹在 cooldown_days 内不可能再被评估（见 policy.limits）。
#   3. 只登记**结构性**问题（某个机制该不该存在），不登记数值搜索。
#      kind=parameter 的条目会被 policy.autonomy.parameter=never 直接跳过，
#      保留该字段只为让"参数类假设"也有地方留痕。
#   4. expires 到期自动作废：市场结构会变，两年前的问题未必还值得问。
#   5. 被否掉的候选**不删除**，在条目下补 verdict 段落写清数字与结论。
#      删除等于让下一个人重问同一个问题，而重问的成本是 20 分钟 + 一次预算。
#
# 已证伪并撤下的候选（留痕，勿重复登记）：
#   · gap_rerank（2026-11-03 第131轮，未登记即证伪）："T+1 开盘按竞价缺口重排，买缺口最深的那只"。
#     1500 日 / 1433 出票日 / 7621 条记录：前 6 名缺口相关性仅 0.317，换票率 25~30%（不是空转），
#     但结果全负 —— deep_in_2 -0.174pp、deep_in_3 -0.192pp、deep_in_5 -0.250pp(p=0.063)、
#     score×gap -0.158pp，且换票率越高越差（剂量-反应）。决定性证据：前两名都合格的 227 天，
#     rank1 +0.802% vs rank2 +0.037%（差 +0.884pp, t=2.42）；**rank2 缺口更深 >=1% 的 29 天,
#     rank1 仍胜 +0.358pp**。补位（rank1 不可买时买 rank2+）162 天 -0.294%/胜率 46.3%。
#     机制：评分刻画"为什么被错杀"（原因），缺口只是"今天怎么定价"（结果），用结果覆盖原因必丢信息。
#     缺口正确的用途是**定仓位**（gap_floor_tiers / gap_above_tiers），不是选票。
#     结论见 CHANGELOG 第一百三十一轮 / output/exp_rerank.json。
#   · cash_efficiency（2026-11-03 第131轮，未登记即证伪）："降仓位/分仓/缩短持有期以提高资金周转"。
#     满仓单吊 + T+2 收盘卖 => 回笼款 T+3 才可用 => 天然隔天交易，而这个约束在过滤坏日子：
#     "前一日也可买"的 213 天均值 -0.388% vs "间隔日" 356 天 +0.527%；按池深分层后满仓档
#     **-0.155%(119) vs +1.377%(187)，差 1.53pp**，浅池档两条都是负的（pool_n_tiers 已处理对）。
#     严格隔天模拟 419 笔 +0.442%（把全样本 +0.184% 抬了一倍多）。
#     **资金约束本身是 alpha 的一部分**，这是第114轮 2x50% 分仓 1229% vs 单吊 6392% 的真正机制；
#     也是第129轮"容量 1250 万"为何不能靠分仓突破的原因。用实际成交旁证（最近 200 笔）：
#     控制满仓后"间隔近 vs 远"只剩 -0.205pp 不显著 —— 现有机制已吃干净，不必再显式加开关。
#     结论见 CHANGELOG 第一百三十一轮 / output/exp_rerank.json 的 q5_cash_filter。
#   · capacity_expand（2026-11-02 第129轮，未登记即证伪）："把容量做上去"。
#     379 笔 T+1 全天成交额中位 2.49 亿 / P10 0.90 亿 → 满仓单吊容量线 = 5%×2.49亿 ≈ **1250 万**。
#     固定单笔 100万/1000万/5000万/1亿 → 年化 94.3/63.9/33.6/21.9%、留存 58.7/20.5/5.3/2.6%；
#     1 亿时平均实仓只剩 19.6%、91.6% 的笔被迫减仓。硬买满则 2000 万(k30) 就 -22.6%。
#     三条扩容路全部有历史裁决：多票分散(114轮 2×50%=1229% vs 6392%)、降换手(64轮 hold 1/2/3
#     日卡玛 6.5/5.9/2.4 vs 33.1)、扩池(92轮 加科创 906%/加北交 712%，均低于同口径基准)。
#     **这是结构边界不是参数问题：不要登记"多买几只""拉长持有""放宽票池"类候选。**
#     结论见 CHANGELOG 第一百二十九轮 / output/exp_capacity.json。
#   · dow_filter（2026-11-02 第128轮，未登记即证伪）："剔除某个星期几的信号"（周内日历效应）。
#     全史 3378 日 / 891 笔按 signal_date 星期分组：周一 +0.833%、周二 +1.312%、周三 +0.377%、
#     周四 +1.620%、周五 +1.492% —— **五个全为正**，最差的周三对数贡献 +0.467，剔除任一天都变差。
#     且排序跨时代翻转（2012-2019 最好周四、2020+ 最好周五；周二从第 4 跳到第 2），
#     1500 日窗口里"周一最差"在全史排第三。结论见 CHANGELOG 第一百二十八轮 / output/exp_dow.json。
#   · ma5slope_off（2026-11-02 首跑）：`selection.ma5_slope_up` 只被 momentum 备用池读取，
#     主 dip 路径根本不看这个键 —— 700 日冒烟回测 0/140 个交易日出票不同，趋势池 4010 vs 4010
#     完全一致，引擎判 REJECT_NOISE。教训：登记候选前必须先确认这个开关在当前 mode 的代码路径上。
# =====================================================================

- id: gapfloor_off
  kind: structure
  since: "2026-11-02"
  expires: "2027-06-30"
  patch:
    execution.gap_floor_tiers: []
  question: "深低开撤销池深折价，是纪律还是过度自信？"
  rationale: >
    现行规则：竞价缺口 <= -1.0% 且当日池深 >= 5 时，把仓位从池深分档的折扣拉回 floor=1.0。
    依据是第一百零一轮观察到的"缺口<=-1% 的 92 笔均值 +1.85%/胜率 75%"。
    但那 92 笔是**全样本**统计，且当时没有控制"池深"这个条件 —— 深低开 + 深池深
    可能恰恰是恐慌日，而恐慌日的次日修复并不稳定。这是一个可被证伪的机制：
    若撤销后（即保留池深折扣）全史收益/卡玛不降，说明这条规则在替市场交学费。
  verdict: >
    REJECT_FAST（2026-11-02 首跑，快筛窗口）。撤销后 +2199.98% vs 基线 +5855.11%，
    相对 −62.43%，卡玛 5.60→3.52，笔数 387→366。方向与假设相反且幅度极大：
    这条规则不是"替市场交学费"，是收益的主要来源之一。365 日内不再重测。

- id: knife_allow
  kind: structure
  since: "2026-11-02"
  expires: "2027-06-30"
  patch:
    execution.knife_tiers: []
  question: "'大盘平稳而个股独跌'一票否决，是必要保护还是砍掉了可修复的错杀？"
  rationale: >
    现行规则：信号日全市场中位数 > -0.5%（大盘没跌）而个股超额 <= -4pp 时，仓位乘 0.00
    —— 即直接排除。第一百零三轮引入时的依据是"独跌=有真利空"。
    但这条规则同时排除了另一种情形：**板块利空/个股情绪错杀**，次日随大盘修复。
    这是一个强假设，且从未被单独证伪过：若放开后全史卡玛不降、回撤不恶化，
    说明"独跌"里混着大量可修复样本；若回撤明显恶化，则这条规则应当保留并写进纪律。
    注：该候选会增加尾部风险，即使通过也只会以 PR 形式提交评审。
  verdict: >
    REJECT_FAST（2026-11-02 首跑，快筛窗口）。放开后 +3896.06% vs 基线 +5855.11%，
    相对 −33.46%，卡玛 5.60→4.40；笔数 387→512（多 125 笔），胜率 56.33%→53.12%，
    单笔 1.369%→0.915%。多出来的 125 笔平均质量显著低于原有样本 —— "独跌"里可修复的部分
    远不足以补偿混进来的真利空。这条规则保留，并已写进纪律。

# 参数类：保留样例，说明"能登记但不能自动生效"。
# 该 patch 已被第一百二十一轮实测为噪声（+128.13pp / +1.5%，卡玛 +0.03），
# 引擎会在 SKIP_POLICY 之前先命中 SKIP_KNOWN，作为账本记忆的活体检验。
- id: bias_115
  kind: parameter
  since: "2026-11-02"
  expires: "2026-12-31"
  patch:
    selection.bias20_max: 11.5
  question: "乖离上限 11.4 → 11.5 是否有意义？"
  rationale: >
    第一百二十一轮的对照实验：+128.13pp(+1.5%)、卡玛 6.32→6.35、笔数不变，
    已被 ab_test 护栏标为 ≈噪声。登记在此仅用于验证账本去重是否生效。

- id: abl_gap_above_tiers
  kind: structure
  since: "2026-11-08"
  expires: "2027-05-07"
  patch:
    execution.gap_above_tiers: []
  question: "`execution.gap_above_tiers` 这套减仓折扣，是纪律还是自我设限？"
  rationale: >
    当前 1 档：[{"above": 0.5, "score_below": 1.6, "mult": 0.3}]，最低系数 0.3 < 1，方向是**减仓**。清空后若全史收益/卡玛不降，说明它在替市场交学费（第一百一十九轮对另外几组减仓档给过同样的否）；若明显变差，说明它在过滤真风险，应当保留。 这是存在性审计，不产生任何新数值。
  mined: true
  source: ablation

- id: abl_mkt_floor_tiers
  kind: structure
  since: "2026-11-08"
  expires: "2027-05-07"
  patch:
    execution.mkt_floor_tiers: []
  question: "`execution.mkt_floor_tiers` 的系数全是 1.0 —— 这段配置是死代码吗？"
  rationale: >
    当前 1 档：[{"mkt_below": -1.5, "floor": 1.0}]，全部动作系数都等于 1.0，即在任何分支上都不改变仓位。若清空后回测**逐位不变**，它就是纯死配置，应当删除以缩小可误解空间；若有差异，说明它通过分支顺序间接影响了别的规则，需要查明是哪一条。 这是存在性审计，不产生任何新数值。
  mined: true
  source: ablation

