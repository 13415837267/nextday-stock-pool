- id: abl_mkt_boost_tiers
  kind: structure
  since: "2026-11-08"
  expires: "2027-05-07"
  patch:
    execution.mkt_boost_tiers: []
  question: "`execution.mkt_boost_tiers` 这套加仓档，是真 alpha 还是拟合？"
  rationale: >
    **在位者审计（incumbent audit）**：这条机制是第一百七十三轮刚上线的
    （`mkt_pct ∈ [-2.5%, -1.0%]` 时仓位 ×1.5），双窗口表现是 1500 日 140.78→180.71%、
    全史 109.88→134.08%，两次最大回撤都逐位不变。但那一轮是我手工合并的，
    没有走这套闸门 —— 本轮把它作为反方向的消融实验补登记，用同一把尺子复核一次。
    三种结论要分开：① 清空后明显变差 => 主线 alpha 被独立确认，机制保留；
    ② 清空后无差异 => 上一轮的双窗口同向是巧合，必须回滚；
    ③ 收益降但回撤也降 => 它只是杠杆的变形，应把 mult 从 1.5 降回纯杠杆档。
    注意它必须是**带下限的区间档**（第一百七十三轮已记录：只判上限的版本
    全史回撤从 -26.98% 恶化到 -33.36%，还不如直接上 1.5x 杠杆）。
  mined: true
  source: ablation
  audit_of_round: 173
