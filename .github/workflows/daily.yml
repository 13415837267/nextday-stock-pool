# 每个交易日收盘后自动选股并更新 GitHub Pages
name: 每日选股更新

on:
  schedule:
    - cron: "0 10 * * 1-5"   # 北京时间周一至周五 18:00 每交易日自动更新一次(免费数据源当日数据此时已完整)
  push:
    branches: [main]          # main 一有更新(策略优化/数据提交)即重新部署网页, 保证站点与 main 始终一致
    paths-ignore:             # 竞价确认只改 auction.json, 由 auction.yml 自行部署, 不触发每日全量
      - "output/auction.json"
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行每日选股
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}   # 可选, 提升访问频率
        run: python -m src.daily_run

      - name: 每日回测刷新网页绩效(复用当日增量数据)
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python -m src.backtest

      - name: 提交更新记录(中文留痕)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output CHANGELOG.md data
          if git diff --cached --quiet; then
            echo "无数据变更, 跳过提交"
          else
            git commit -m "数据更新: $(TZ=Asia/Shanghai date +%F) 收盘选股与次日候选池 [skip ci]"
            git push
          fi

      - name: 组装 Pages 站点
        run: |
          mkdir -p deploy/data
          cp site/index.html deploy/
          cp output/*.json deploy/data/ 2>/dev/null || true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: 部署 GitHub Pages
        uses: actions/deploy-pages@v4

      - name: 失败告警(自动建Issue, 防静默漏更)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠ 每日更新失败: $(TZ=Asia/Shanghai date +%F)" \
            --body "每日选股工作流运行失败, 请查看日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Issue创建失败(可能已有同名), 跳过"
