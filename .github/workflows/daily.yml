# 每个交易日收盘后自动选股并更新 GitHub Pages
name: 每日选股更新

on:
  schedule:
    # GitHub schedule 是"排队触发"而非"准点执行": 高峰期排队延迟可达数小时(2026-10-26 实测 6.3h,
    # 2026-10-30 的三个槽被合并且推迟到次日 00:2x)。因此不靠"把时间调早"解决——提前只会让
    # 预期完成时间前移, 延迟量本身不变, 且 18:00 已是数据源当日数据完整的下限, 再早会拿到残缺数据。
    # 正确做法: 用密集槽位覆盖同一时间窗, 任一槽跑成即生效, 由幂等守卫收敛为只算一遍。
    # 末班槽止于北京 22:00, 即使再延迟 2h 也在当日完成, 避免跨日导致"执行日≠数据日"。
    - cron: "0 10 * * 1-5"   # 北京 18:00 主槽(免费数据源当日数据此时已完整, 不宜再提前)
    - cron: "0 11 * * 1-5"   # 北京 19:00 重试1
    - cron: "0 12 * * 1-5"   # 北京 20:00 重试2
    - cron: "0 13 * * 1-5"   # 北京 21:00 重试3
    - cron: "0 14 * * 1-5"   # 北京 22:00 重试4(末班, 留 2h 跨日缓冲)
    - cron: "0 22 * * 1-5"   # 北京次日 06:00 补漏槽: 前一交易日全部延迟/失败时的最后兜底
  push:
    branches: [main]          # main 一有更新(策略优化/数据提交)即重新部署网页, 保证站点与 main 始终一致
    paths-ignore:             # 竞价确认只改 auction.json, 由 auction.yml 自行部署, 不触发每日全量
      - "output/auction.json"
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 幂等检查(该数据日已处理则本槽跳过, 密集重试槽靠它收敛)
        id: guard
        run: |
          # 判定口径由"执行日"改为"数据日": latest.json 的 signal_date 即最近一次已处理的交易日。
          # 它等于今天(北京) => 今日收盘数据已落库, 后续重试槽全部跳过。
          # 它小于今天 => 上一交易日未处理(含 schedule 延迟跨日), 不跳过, 交给 daily_run 补算。
          today=$(TZ=Asia/Shanghai date +%F)
          prev_sig=$(python3 -c "import json;print(json.load(open('output/latest.json',encoding='utf-8')).get('signal_date',''))" 2>/dev/null || echo "")
          echo "今日=$today 已处理数据日=$prev_sig"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$prev_sig" = "$today" ]; then
            echo "信号日 $prev_sig 已处理, 本槽跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行每日选股
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}   # 可选, 提升访问频率
        run: python -m src.daily_run

      - name: 每日回测刷新网页绩效(复用当日增量数据)
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python -m src.backtest

      - name: 刷新策略体检数据(探针/季度剖面随每日回测日更, 第48轮)
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
        run: python tools/make_health.py

      - name: 提交更新记录(中文留痕, 日期取数据日而非执行日)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 提交日期取 signal_date: 延迟跨日时执行日 != 数据日, 写执行日会让提交历史与账本对不上
          # (2026-10-31 00:22 曾出现"数据更新: 2026-10-31"但实际一行数据都没采的误导性提交)
          sig=$(python3 -c "import json;print(json.load(open('output/latest.json',encoding='utf-8')).get('signal_date',''))" 2>/dev/null || echo "")
          [ -z "$sig" ] && sig=$(TZ=Asia/Shanghai date +%F)
          git add -A output CHANGELOG.md data
          if git diff --cached --quiet; then
            echo "无数据变更, 跳过提交"
          else
            git commit -m "数据更新: $sig 收盘选股与次日候选池 [skip ci]"
            git push
          fi

      - name: 组装 Pages 站点
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p deploy/data
          cp site/index.html deploy/
          cp output/*.json deploy/data/ 2>/dev/null || true

      - name: 上传 Pages 产物
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: 部署 GitHub Pages
        if: steps.guard.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: 失败告警(自动建Issue, 防静默漏更)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠ 每日更新失败: $(TZ=Asia/Shanghai date +%F)" \
            --body "每日选股工作流运行失败, 请查看日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Issue创建失败(可能已有同名), 跳过"
