# 每日自动选股并更新 GitHub Pages(主槽北京 16:07, 含补数据槽)
name: 每日选股更新

on:
  schedule:
    # 主槽定在北京 16:07(收盘后 1 小时, 尽早出结果), 其后为补数据槽。
    # 注意: 16:07 时数据源当日全市场行情未必已出全, daily_run 会解析到"上一交易日"并因
    # latest.json 一致而幂等跳过(不产错数据也不空转失败), 由 16:37/17:17/18:47/20:07 槽在数据
    # 出全后自动补上 —— 因此主槽提前到 16:07 是安全的, 但真正落地时间取决于数据源发布时刻。
    # 每日(含周末)触发: 周末若无新数据会幂等跳过; 保留周末槽是为了兜住上周五延迟/失败未跑的情况。
    # GitHub schedule 是排队触发, 高峰期延迟可达数小时, 故用多槽覆盖同一时间窗, 由幂等守卫收敛。
    #
    # 全部槽位错开整点(2026-11-03 实测): 原先五槽都在 :00, GitHub 调度器在整点最拥堵,
    # 11-02 的五次定时全部晚点 1.3~5.3 小时执行; 11-03 的 16:00/17:00/18:00/20:00 四槽
    # 直接一槽未触发(11:18 之后 9 小时无任何运行, 20:34 靠手工 dispatch 才补上当日数据)。
    # 错峰 + 主槽后补一个 16:37 的十分钟级补位槽, 只降低被丢概率; 要"必有"仍需仓库外触发器。
    - cron: "7 8 * * *"    # 北京 16:07 主槽
    - cron: "37 8 * * *"   # 北京 16:37 补位槽: 主槽被调度器丢弃时同日补一次
    - cron: "17 9 * * *"   # 北京 17:17 重试1
    - cron: "47 10 * * *"  # 北京 18:47 重试2
    - cron: "7 12 * * *"   # 北京 20:07 重试3
    - cron: "7 22 * * *"   # 北京次日 06:07 补漏槽: 前一交易日全部延迟/失败时的最后兜底
  push:
    branches: [main]          # main 一有更新(策略优化/数据提交)即重新部署网页, 保证站点与 main 始终一致
    paths-ignore:             # auction.json 已停更(竞价确认 workflow 已删除), 保留忽略以防历史文件变动触发全量
      - "output/auction.json"
      # 第一百三十一轮: 研究类变更不该触发全量回测。
      # 起因: research.yml 的产物提交带 [skip ci] 无碍, 但**人工上传**文档/脚本的 commit 会触发一次
      # 完整 daily(回测 3~5 分钟 + Pages 部署), 数次连传就叠出多条并发, 互相取消或撞 git push,
      # 进而用"每日更新失败"污染告警通道(实测 2026-11-03 一次连传就产生 2 条假告警)。
      # 以下路径只影响研究/文档, 不影响策略数值与页面数据:
      - "output/exp_*.json"    # 只读诊断产物(exp_dow/exp_cost/exp_capacity/exp_rerank...)
      - "tools/**"             # 诊断脚本, 仅 research 通道调用
      - "evolution/**"         # 候选池与自进化策略, 不参与回测数值
      - "**/*.md"              # CHANGELOG/README 等文档
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 幂等检查(该数据日已处理则本槽跳过, 密集重试槽靠它收敛)
        id: guard
        run: |
          # 判定口径由"执行日"改为"数据日": latest.json 的 signal_date 即最近一次已处理的交易日。
          # 它等于今天(北京) => 今日收盘数据已落库, 后续重试槽全部跳过。
          # 它小于今天 => 上一交易日未处理(含 schedule 延迟跨日), 不跳过, 交给 daily_run 补算。
          today=$(TZ=Asia/Shanghai date +%F)
          prev_sig=$(python3 -c "import json;print(json.load(open('output/latest.json',encoding='utf-8')).get('signal_date',''))" 2>/dev/null || echo "")
          echo "今日=$today 已处理数据日=$prev_sig"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$prev_sig" = "$today" ]; then
            echo "信号日 $prev_sig 已处理, 本槽跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行每日选股
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}   # 可选, 提升访问频率
        run: python -m src.daily_run

      - name: 每日回测刷新网页绩效(复用当日增量数据)
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python -m src.backtest

      - name: 更新向前台账(冻结当日信号 + 回填真实成交)
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python tools/paper_tape.py

      # 独立副策略(第一百三十九轮): 单吊, 每日最多买1只、100%仓位、持40个交易日。
      # 数据与主策略共用(同一 ZZClient + 同一份 data/cache 面板), 不重复抓数;
      # 策略独立 —— src/satellite.py、账本 output/satellite.json、虚拟本金 10 万,
      # 不读写 config/latest/paper, 也不参与主策略资金调度。
      # 第一百四十七轮: 副策略改回低波单吊(v3) —— 用户拍板"形态与主策略同构"优先于
      # 绩效(第 145 轮的 20 只等权轮动卡玛 0.25 优于单吊 0.14, 但一次买 20 只与主策略
      # 单吊形态不一致)。轮动版 rotation_*.py 保留归档, 不再每日推进。
      # continue-on-error: 副策略是独立的一条腿, 它失败不该阻断主策略的产物流转与
      # Pages 部署 —— 否则"加了一条腿"反而降低了主策略的可用性。
      - name: 更新副策略账本(低波单吊)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python tools/satellite_run.py

      # 副策略回测(第一百四十轮): 页面要与主策略同构, 就必须有同一套「回测绩效」模块。
      # 与主策略回测同一窗口(config backtest.trading_days=1500)、同一份缓存面板,
      # 复用 prepare_context 不再抓数; 只做单吊逐日模拟, 产物 output/satellite_bt.json。
      - name: 副策略回测(低波单吊, 与主策略同窗口 1500 日)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python tools/satellite_backtest.py

      # 第一百四十一轮: 主策略回放原先只在手工跑 tools/replay.py 时更新(区间还是写死的
      # 20251101~20261031), 与每天刷新的副策略回放并排看就是"一条腿走、一条腿钉住"。
      # 现在每日刷新, 区间取"最新交易日前推 12 个月"。
      # continue-on-error: 回放只是展示层, 失败不该阻断 Pages 部署与告警。
      - name: 刷新历史回放(近12个月逐日重放)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python tools/replay.py

      - name: 刷新策略体检数据(探针/季度剖面随每日回测日更, 第48轮)
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
        run: python tools/make_health.py

      - name: 提交更新记录(中文留痕, 日期取数据日而非执行日)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 提交日期取 signal_date: 延迟跨日时执行日 != 数据日, 写执行日会让提交历史与账本对不上
          # (2026-10-31 00:22 曾出现"数据更新: 2026-10-31"但实际一行数据都没采的误导性提交)
          sig=$(python3 -c "import json;print(json.load(open('output/latest.json',encoding='utf-8')).get('signal_date',''))" 2>/dev/null || echo "")
          [ -z "$sig" ] && sig=$(TZ=Asia/Shanghai date +%F)
          git add -A output CHANGELOG.md data
          if git diff --cached --quiet; then
            echo "无数据变更, 跳过提交"
          else
            git commit -m "数据更新: $sig 收盘选股与次日候选池 [skip ci]"
            # 推送竞争(第125轮起) + JSON 产物冲突(第141轮修):
            # 并发 run 各自重写 output/*.json(含 run_time 时间戳), rebase 必然内容冲突,
            # 而这类文件是"整份重新生成的产物", 没有逐行合并的语义。
            # 原实现 rebase 冲突即失败 -> 连带跳过 Pages 部署, 站点停在旧数据, 还发假告警。
            # 现在: 冲突时 output/data/CHANGELOG 一律取本次运行的版本(--ours), 再推。
            if ! git push; then
              git fetch origin main
              git merge --no-edit origin/main || true
              if git ls-files -u | grep -q .; then
                echo "检测到产物冲突, 取本次运行的版本:"
                git ls-files -u | awk '{print $4}' | sort -u
                git checkout --ours -- output data CHANGELOG.md
                git add -A output data CHANGELOG.md
                git commit --no-edit || true
              fi
              git push
            fi
          fi

      - name: 组装 Pages 站点
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p deploy/data
          cp site/*.html deploy/          # 站点页面(回放已并入 index.html, 数据走 data/replay.json)
          # 只发布前端真正读取的 5 个文件(第一百二十五轮): 原先 cp output/*.json 会把 60+ 个
          # 回测/审计中间产物一起推到 Pages —— mkt_gap_events.json 35MB、overnight_offset.json
          # 5.4MB、stock_state_pool.json 4.6MB, 部署体积 48.7MB, 而站点只需约 0.5MB。
          # 新增前端数据源时必须同步改这里, 否则页面会显示"数据未部署"。
          for f in latest history backtest health replay paper satellite satellite_bt; do
            cp "output/$f.json" deploy/data/ 2>/dev/null || true
          done

      - name: 上传 Pages 产物
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: 部署 GitHub Pages
        if: steps.guard.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: 失败告警(自动建Issue, 防静默漏更)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠ 每日更新失败: $(TZ=Asia/Shanghai date +%F)" \
            --body "每日选股工作流运行失败, 请查看日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Issue创建失败(可能已有同名), 跳过"
