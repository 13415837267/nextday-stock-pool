name: 竞价确认
on:
  schedule:
    # 09:26 是业务硬下限, 不能"调早": 9:25 集合竞价撮合完成, 早于此刻 readings 为空。
    # 既然提前无效, 就用密集槽位对抗 GitHub 排队延迟(2026-10-29/10-30 连续两天 09:26 槽
    # 实际 15:2x 才跑, 延迟 6h, 确认结果已过交易时点, 功能实质失效)。
    # 脚本幂等(buy_date 校验 + 内容不变不提交), 多槽重复触发无副作用。
    # 注: 槽位加密只能提高"当天跑成"的概率, 无法消除排队延迟本身;
    #     若要准点, 需改用 workflow_dispatch + 外部定时器触发(参见 daily.yml schedule 段说明)。
    - cron: "26 1 * * 1-5"   # 北京 09:26 主槽(集合竞价撮合完成后自动判定今日买入)
    - cron: "31 1 * * 1-5"   # 北京 09:31 重试1
    - cron: "36 1 * * 1-5"   # 北京 09:36 重试2
    - cron: "41 1 * * 1-5"   # 北京 09:41 重试3
    - cron: "46 1 * * 1-5"   # 北京 09:46 重试4
    - cron: "51 1 * * 1-5"   # 北京 09:51 重试5
    - cron: "56 1 * * 1-5"   # 北京 09:56 重试6(末班, 仍在连续竞价早段)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write    # 失败告警自动建Issue需要(2026-10-26 14:39竞价重试槽失败但告警因缺权限静默)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 行情重试+双源备援最多数分钟, 10分钟足够; 超时按失败自动建Issue
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖(竞价判定需 pyyaml; 仅用stdlib+src.config, 不装全量requirements)
        run: pip install -q pyyaml

      - name: 竞价确认(9:25竞价数据自动判定)
        run: python tools/auction_confirm.py

      - name: 提交确认结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/auction.json
          git commit -m "竞价确认: $(TZ=Asia/Shanghai date '+%F %H:%M')" || echo "无变化"
          git pull --rebase origin main || true
          git push

      - name: 组装 Pages 站点
        run: |
          mkdir -p site/data
          cp output/latest.json output/history.json output/backtest.json output/auction.json output/health.json site/data/ 2>/dev/null || true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署 GitHub Pages
        uses: actions/deploy-pages@v4

      - name: 失败告警(自动建Issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠ 竞价确认失败: $(TZ=Asia/Shanghai date +%F)" \
            --body "竞价确认工作流失败, 请查看日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Issue创建失败(可能已有同名), 跳过"
