  #   2025+2.3 / 2026+4.6 / 2013+1.8 / 2018+0.3; 变差 2015-15.9 / 2016-1.7 / 2017-1.0 /
  #   2019-0.9 / 2024-5.6。**2015 股灾年 -15.9pp 是本轮最大代价**(股灾中低池深日加仓放大亏损),
  #   但当年仍是正收益, 且全窗 +14.6%, 属"高风险年份换全周期效率"的取舍。
  # 取 5 而非 3/4: 3/4 的全史收益更高(117812)但那是依赖"池深 3~4"的极少数交易日, 5 已在饱和
  #   平台内且更保守, 不赌个别交易日。
  gap_floor_tiers:
    - {below: -1.0, min_pool: 5, floor: 1.00}
  # ---- 市场语境(第一百零三轮): 把"深低开/回调"拆成市场成分与个股成分 ----
  # 论点: "错杀"的前提是这一跌不是它自己的事。同样是 T 日跌 5%:
  #   大盘跌 3% 时它只是跟随(beta) —— 次日深低开是全市场恐慌, 修复时有共振;
  #   大盘涨 0.5% 时它独自跌 5% —— 更可能是利空/资金出逃, 次日低开是"真有事"。
  # 逐笔证据(1500日 575 笔主池成交, 按信号日全市场涨跌中位数 mkt_ret 分组, 盘后即知, 无未来函数):
  #   mkt_ret <= -1.5%    57 笔 均值 +1.37% 胜率 60% 中位 +0.64%
  #   -1.5% ~ -0.5%      162 笔 均值 +0.85% 胜率 54%
  #   > -0.5%(平稳/上涨)  356 笔 均值 +0.27% 胜率 48%
  #   —— 市场跌得越狠, 深低开承接的期望越高(与第一百零二轮"风控日恐慌深坑"同源)。
  # 平稳日 356 笔再拆: 个股超额下跌(个股 pct - 市场中位数) <= -4pp 的 221 笔
  #   均值 -0.01%/胜率 46%/中位 -0.32%; 同日超额 > -4pp 的 135 笔 +0.72%/胜率 50%。
  #   分年: 刀口组 7 年里 5 年为负(仅 2022 +0.67%、2026 +0.97%), 不是单年现象。
  # 两条修正互补(阈值故意留出 -1.5~-0.5 的"温和下跌"缓冲区, 不硬切):
  #   ① 刀口保护: 市场平稳/上涨而个股独跌 → **不参与**(第一百一十四轮由"缩到三成仓"改为剔除);
  #   ② 恐慌日回满仓: 全市场跌 ≥1.5% → 撤销评分/池深折价回满仓(仍受风控仓位上限约束)。
  # 第一百零三轮首次落地(当时是"缩到三成仓, 照常成交"):
  #   1500日 1978.91%→2584.41%, 全史 9110.28%→15303.38%(+6193pp, 回撤 -3.35pp)。
  # 第一百一十四轮把 mult 从 0.30 一路扫到 0(严格单调, 两窗口一致):
  #   1500日 0.30/0.20/0.15/0.10/0.05/0.00 = 7469/7772/7920/8066/8208/8346(%);
  #   全史   0.30/0.20/0.15/0.10/0.00      = 111450/116910/119599/122252/127423(%);
  #   0.00 全史回撤 -24.72% 与基线逐位相同, 卡玛 2.78→2.85, 笔数 1332→1075(-257),
  #   胜率 51.50%→53.49%, 单笔 0.655%→0.863%; 1500日 单笔 0.770%→1.204%、回撤仅 +0.19pp。
  #   分年 15 段: 11 改善 / 3 变差 / 1 持平; 变差年份幅度都很小(2013 -1.1、2016 -1.2、2026 -0.5),
  #   改善集中在 2021 +13.9 / 2015 +7.8 / 2023 +4.7 / 2024 +3.9。
  # 为何现在敢用 0 档(第一百零三轮不敢): 当时的反对理由是"该组均值 -0.01% 属零期望, 且 2022/2026 为正,
  #   删单会切掉右尾"。但那是 sf=0.50、market_ma=30 口径下的统计; 收盘腿加到 90% 后, 单吊全仓的
  #   **一天只有一个仓位名额**, 零期望票占住名额的机会成本被放大 —— 剔除后资金留在现金,
  #   下一笔满仓落在真正的强信号上。分年 2022 已由正转负(+1.7pp 改善), 说明旧结论随口径失效。
  knife_tiers:
    - {mkt_above: -0.50, res_below: -4.0, mult: 0.00}
  mkt_floor_tiers:
    - {mkt_below: -1.50, floor: 1.00}
  # ---- 池深分档下注(第九十九轮): 当日候选池深度 = 同风格票的"共振强度" ----
  # 口径: 按 T 日收盘后"满足 dip 全部条件的票数"(scored, 盘后即知, 无未来函数)分档缩仓,
  #   只降仓不拒单 —— 每日计划票照常在 T+1 开盘价成交, 交易次数不变。
  #   池 >=21 满仓 / 11~20 半仓 / 1~10 三成 / 0(备用池补位) 满仓(不匹配任何档, 走默认)。
  # 依据(547 笔逐笔, 按 signal_date 的 scored 分桶, 1500 日):
  #   池41+  115笔 几何+1.28% 胜率59.1% 复利+330%
  #   池21-40 137笔 几何+0.62% 胜率49.6% 复利+135%
  #   池11-20 165笔 几何+0.04% 胜率44.2% 复利 +8%   ← 41% 的笔数, 几乎零贡献
  #   池 7-10  62笔 几何+0.08% 胜率51.6% 复利 +5%
  #   池 4-6   43笔 几何+0.29% 胜率51.2% 复利 +13%
  #   —— 池越窄 = 越少强势股同步回调 = 孤立回调、无板块共振, 次日反抽缺乏承接;
  #      池宽则是一批同风格票一起被错杀, 修复时同向共振。这是"机会集宽窄"的代理, 不是过拟合。
  # 结果: 1500日 959.66%/-21.83%/547笔/卡玛2.23 → 956.52%/-15.14%/548笔/卡玛3.21
  #       (收益 -3pp 在噪声内, 回撤 -6.7pp, 卡玛 +44%; 前后半窗 263/192 → 232/218)
  #       全史   2566.55%/-26.04%/1122笔/卡玛1.07 → 3647.88%/-25.54%/1124笔/卡玛1.22
  #       (收益 +1081pp, 四段 210/-16/230/212 → 287/-12/249/215)
  # 平台: 中间档 0.4/0.5/0.6/0.7 = 951.3/956.5/961.9/967.4%(卡玛 3.35/3.21/3.08/2.97, 单调权衡);
  #       小池档 0.2/0.3/0.4/0.5 = 956.5/956.5/955.5/953.4%(卡玛 3.32/3.21/3.10/3.00);
  #       阈值 17/19/21/23/25 = 990/996/957/939/904%, 31 才断崖(658%) —— 宽平台, 取 21/11。
  # 代价如实说明: 分年 4 改善 3 变差 —— 2021 +24 / 2024 +14 / 2025 +5 / 2020 -4 /
  #   2026 -8 / 2023 -10 / 2022 -21pp。2022 是"急跌后反弹"年, 池浅日恰是反弹起点, 降仓少赚;
  #   与"结构性翻转"不同, 这是"个别年份少赚", 全史与四段仍是净增益。
  pool_n_tiers:
    - {min: 21, mult: 1.00}
    - {min: 11, mult: 0.50}
    - {min: 1,  mult: 0.30}
  # 绩效门控仓位(第九十七轮验证, 证伪·不启用): 近 window 笔"已结算"均值 < cut_below 时仓位×cut_mult,
  # 试图在"策略自身走弱"(如 2025 全年胜率45%/单笔+0.15%)时主动降仓等风来。
  # 1500日实测全部劣化: 基线 596.3% → W10 444.9% / W20 451.9% / W40 448.1%(回撤确降到-17.8%,
  # 但收益腰斩); 叠加高开降仓同样从 776% 掉到 501~521%。复利策略里"自我降仓"就是主动减少
  # 在场次数, 卡玛升、绝对收益崩。引擎保留 perf_gate 开关(缺省空)供后续研究, 不写入默认口径。
  # perf_gate: {window: 20, cut_below: 0.0, cut_mult: 0.5}
  # 卖出端深跌延卖(第八十九轮): T+2开盘跌幅 >= 2%(且未跌停)时, 改为当日收盘卖出。
  # 仅用T+2开盘瞬时信息做决策, 无未来函数。500日主板单只口径(g08口径):
  #   未延卖 147.71%/68笔/73.5%/回撤-11.86% → 延卖 195.27%/66笔/75.76%/回撤-9.36%
  #   (延卖把"恐慌开盘割肉"换成收盘修复, 是胜率与复利的主要增量来源之一)
  sell_close_if_open_drop: 2.0
                             # ★第一百二十七轮(消融): 在现行 sell_open_frac=0.0 下**完全空转** ——
                             #   关掉它(设 0)、连同 sell_limit_down_fallback 设 false, 回测逐位相同
                             #   (8495.12%/379 笔/卡玛 6.32/-17.61%)。
                             #   历史(第一百一十五轮, 当时 sf=0.10)测过 1.5/2.0/2.5/3.0/关 =
                             #   6392/6392/6357/6349/6311(几乎不敏感); 第一百一十五轮把 sf 降到 0.00 后,
                             #   这条"把开盘卖改成收盘卖"的规则连"几乎"也消失了 —— 因为没有开盘腿可改。
                             #   保留 2.0 只是"将来恢复分批出场"的锚点, 不代表现在有保护作用。
  # ---- 分批出场(第九十八轮, 历史留档·现行值见文末第一百一十一轮): 一半开盘落袋, 一半留到收盘 ----
  # 口径: T+2 开盘卖 50%(所得资金当日开盘即可再投), 收盘卖 50%(次日开盘方可投入)。
  #   开盘跌停、或 sell_close_if_open_drop 触发时, 仍全部按收盘卖(极端日保护不变)。
  # 动机 —— "日内收益(收盘/开盘-1)的方向"在翻转, 分年实测(0.5 减 1.0, 1500日):
  #   2020 +4 / 2021 +24 / 2022 +18 / 2023 +1 / 2024 +12 / 2025 -1 / 2026 -36pp
  #   2021~2024 收盘卖更好(日内修复), 2025~2026 开盘卖更好(开盘即当日最高, 日内单边下滑)。
  #   押单一时点 = 押"结构不变"; 两条腿各一半, 任何结构下都只错一半。
  # 依据(同引擎, 只改出场价; 选股/买入/笔数全不变):
  #   1500日: 776.02%/-24.45%/545笔/卡玛1.80 → 959.66%/-21.83%/547笔/卡玛2.23
  #           前后半窗 172/223 → 263/192 (前半 +91, 后半 -31, 整体 +184)
  #   全史:   1155.48%/-41.80%/1119笔/卡玛0.50 → 2566.55%/-26.04%/1122笔/卡玛1.07
  #           四段 122/-31/138/245 → 210/-16/230/212 (三段改善, 末段 -33pp)
  #           单笔均值 +0.281%→+0.432%, 胜率 50.4%→49.9%(略降, 收益来自盈亏比)
  # 平台: 1500日 0.8/0.7/0.6/0.5/0.4 = 839.7/875.2/914.7/959.7/1012.4%(单调平滑),
  #   全史 0.7=1900.6 / 0.5=2566.6 —— 是平台不是尖峰; 取 0.5 是 minimax(两腿等权),
  #   不猜"日内往哪边走" —— 全押收盘(0.0)在 1500 日更高(1395.6%), 但 2026 年要掉 55pp。
  # 代价如实说明: ①近两年少赚(2026 年 102.6%→66.4%, 仍为正; 2025 年基本持平);
  #   ②实盘要下两次单: 9:25 卖一半、14:55 卖一半, 比"一次开盘卖"多一步。
  #
  # ---- 第一百零四轮: 0.50 → 0.40(收盘腿 50%→60%) [历史留档·已被第一百一十一轮取代] ----
  # 起因: 逐笔拆"复利从哪来"发现 —— 575 笔里 49 笔(r_open>=5%)贡献等权复利 +3154%,
  #   其余 526 笔合计 -53%; 这 49 笔的 T+2 开盘就是最高点(日内 -0.83%/胜率35%, 再拿一天 -1.00%)。
  #   顺着这条线试过"高浮盈开盘一次性清仓"(sell_full_if_open_gain=5), 1500日 +28pp 但
  #   全史 18661→17512、回撤 -22.21→-22.98、卡玛 2.15→2.05 => **证伪, 不启用**。
  #   反过来看全样本: 575 笔 T+2 日内均值 +0.269%、阳线率 51% —— 收盘腿整体是赚的,
  #   49 笔是例外不是常态; 把 8.5% 的例外当成规则去改 100% 的仓位, 就是被右尾牵着走。
  # 依据(同引擎只改这一个数):
  #   1500日 2584.41%/-15.40%/卡玛4.79 → **2775.02%/-15.73%/卡玛4.82**(+190.6pp, 回撤仅 +0.33pp)
  #   全史  15303.4%/-22.17%/卡玛2.06 → **18661.6%/-22.21%/卡玛2.15**(+3358pp, 回撤 +0.04pp)
  #   全史分年 15 段里 12 段改善, 且 **2012-2019 这 8 个推导窗口之外的年份全部改善**(+0.1~+6.8pp);
  #   仅 2020 -1.2 / 2023 -0.3 / 2026 -1.2pp。
  # 平台(1500日): 0.5=2584/4.79 → 0.4=2775/**4.82** → 0.3=2987/4.56 → 0.2=3217/4.29 → 0.0=3710/3.79
  #   收益单调上升、卡玛在 0.4 见顶(0.3 起回撤 -17.1/-18.7/-22.2 快速抬升)。
  #   取 0.4 而不是收益更高的 0.3/0.2/0.0: 这是**卡玛峰值**, 且是唯一"收益↑、卡玛↑、回撤几乎不动"的点。
  # 代价如实说明: ①开盘只卖 40%, 当日回笼资金变少 -> 同日买入的仓位更容易被现金卡住(笔数仍 640 不变,
  #   但满仓票在"昨天卖了收盘腿"的日子会打折); ②近三年(2020/2023/2026)各少赚 0.3~1.2pp。
  #
  # 同轮证伪留档(全部同引擎实测, 均不启用):
  #   ① 高浮盈开盘全卖 sfg 3/4/5/6/8% -> 1500日 2590.7/2590.7/2612.4/2544.3/(8%未测完);
  #      全史 sfg5 17512.3%/-22.98%/2.05 < of04 18661.6%/-22.21%/2.15 —— 样本内小赚、样本外亏。
  #   ② 买入也分批 buy_open_frac 0.8/0.6/0.4 -> **1308.1/600.0/253.2%**(基线 2775%) 全线崩。
  #      机理: 买入日日内均值是**正**的(开盘即最低), 等收盘买 = 追高 0.6~0.9%/笔。
  #      这条同时反证了"9:25 集合竞价按开盘价买满"是这个策略最重要的执行细节。
  #   ③ 深跌延卖阈值 scd 1.5/2.0/2.5/3.0 -> 2770.5/**2775.0**/2733.6/2719.6, 现行 2.0 就是峰值, 不动。
  #
  # ---- 第一百一十一轮: 0.40 → 0.10(收盘腿 60%→90%) ----
  # 起因: 第 104~110 轮把 regime 层与执行层的降仓规则全部在新口径(ma20 / vol2.2 / 无 score_tiers)
  #   重扫过, 唯独卖出端还停在第一百零四轮。按同一逻辑复扫 —— 0.40 是在「market_ma=30 + score_tiers
  #   仍在」时调的, 那个口径下 0.3 起回撤从 -15.7% 急剧恶化到 -17.1/-18.7/-22.2, 所以只敢从 0.5 挪到 0.4。
  # 新口径下形态完全变了(1500 日, 同引擎只改这一个数):
  #   0.40(旧)=4349.61%/-14.45%/卡玛6.17 -> 0.30=4921.55/-14.09/6.61 -> 0.25=5246.16/-13.91/6.84
  #   -> 0.20=5598.62/-13.72/7.09 -> 0.15=5980.24/-13.53/7.35 -> **0.10=6391.98/-13.80/7.36**
  #   -> 0.00=7306.56/-14.78/7.18(笔数 633→573: 全额收盘卖致部分买入日无资金, 样本结构已变)
  #   —— 卡玛峰值从 0.4 移到 0.10, 且 0.3~0.1 回撤不但没恶化反而一路改善(与旧口径完全相反)。
  # 全史: 0.40=43003.14/-22.21/2.58 -> 0.25=64354/-23.29/2.66 -> 0.20=73693/-23.72/2.68
  #   -> 0.15=84452/-24.20/2.70 -> **0.10=96866.68/-24.72/2.71** -> 0.05=111205/-25.30/2.72
  #   -> 0.00=127770/-25.94/2.72(笔数 1173)。收益全程单调升、回撤单调恶化 2.5pp,
  #   但卡玛单调改善(2.58→2.71~2.72), 0.05~0.10 是平台而非尖峰。
  # 分年(全史 15 段, 0.10): **12 改善 3 变差**; 改善 2012+0.4/2013+10.4/2014+3.1/2015+24.2/
  #   2016+18.0/2017+2.6/2018+10.0/2019+2.7/2021+55.0/2022+53.1/2023+2.9/2024+11.0;
  #   变差 2020-2.4/2025-4.7/2026-3.8。样本外(2012~2019 这 8 年)**全部改善**。
  #   2015(杠杆牛+股灾)是全史最极端年份, 却是 +24.2pp —— 说明吃的是"深低开次日日内修复",
  #   不是牛市 beta, 这也推翻了"熊市 T+2 该早卖"的直觉。
  # 机制: 买入侧"9:25 开盘价买满"已证是日内最低(第一百零四轮); 卖出侧对称地, 深低开承接后的
  #   T+2 日内整体仍向上(全样本 T+2 日内均值 +0.269%/阳线率 51%), 越晚卖越接近当日高点。
  #   ma20 让策略在反弹初期即参与 -> 这类"刚启动的修复票"日内斜率更陡 -> 收盘腿价值进一步上升,
  #   这才是最优值从 0.4 漂到 0.10 的根因。
  # 代价如实说明: ①全史最大回撤 -22.21% → -24.72%(+2.51pp), 1500 日反而改善 0.65pp;
  #   ②近端 2025 -4.7 / 2026 -3.8pp 变差(近两年"开盘即当日最高、日内单边下滑"的月份变多);
  #   ③实盘仍是两笔单: 9:25 卖 10%、14:55 卖 90%(滑点已按双边千1计入)。
  # 同轮确认: scd(sell_close_if_open_drop) 在 sf=0.10 下几乎不敏感(1.5/2.0/2.5/3.0/关 =
  #   6392/6392/6357/6349/6311, 卡玛 7.36~7.40), 保持 2.0 不动。
  # 同轮证伪: ①sell_full_on_rebuy(有买入日开盘清仓) = sf1.0 的 2435.15% —— 1500 日内卖出日
  #   恒有买入计划, 该开关等价于"全开盘卖", 负向; ②选股层四参数全部当前值即峰值
  #   (cpos 0.38/0.40 虽 +121/+206pp, 但 0.42 起回撤崩到 -20.55%, 紧贴断崖不取;
  #   dip_pct_min -7.0/-6.5/-5.0 = 2929/2925/1550, vr 3.0/4.0/4.5 = 4127/4204/4187,
  #   dlow 4.0/5.0/8.0/10.0 = 3323/3001/2919/1967, 均劣于基线 4350)。
  #
  # ---- 第一百一十五轮: 0.10 → 0.00(取消开盘腿, 全部尾盘卖) ----
  # 起因: 第 113/114 轮把 min_pool 与 knife 两处"旧口径遗留值"复扫出改善后, 卖出端第三次成为嫌疑 ——
  #   0.10 是第一百一十一轮在 (knife=0.30, min_pool=11, ma20) 口径下定下的, 之后两个口径参数都动了。
  # 结果(同引擎只改这一个数):
  #   1500 日 0.10=8345.80/-14.23/7.78/455 笔 → 0.08=8656.99/-14.21/7.88 → 0.05=9150.42/-14.38/7.92
  #     → 0.03=9497.81/-14.51/7.95 → **0.00=10047.62/-14.69/7.99/379 笔** —— 收益/卡玛全程单调, 无拐点;
  #   全史 0.10=127423/-24.72/2.85/1075 笔 → 0.05=151033/-25.30/2.87 → 0.02=167400/-25.68/2.88
  #     → **0.00=179346/-25.94/2.89/906 笔**(1.41 倍, +51923pp) —— 两窗口同向、同样单调。
  # 效应分解(关键, 决定这条改善是否可持续):
  #   ① 0.10 → 0.02: **笔数不变(1075)**, 单笔 0.863%→0.903%, 全史 +40000pp —— 纯价格效应:
  #     T+2 开盘价系统性低于当日收盘价(深低开承接后的修复day, 开盘是修复起点、收盘是修复终点);
  #   ② 0.02 → 0.00: 笔数 1075→906, 单笔 0.903%→1.059% —— 资金效应: 开盘不再有 10% 回笼现金,
  #     "仓位已被池深/高开档降到三成"的票无法通过 30% 最小成交门槛而被跳过, 跳过的恰是最差一档。
  #   所以 0.00 的下行保护是"至少拿到 ①的 +40000pp"; ②这部分与第一百一十四轮"零期望票占名额"同源。
  # 分年(全史 15 段): **12 改善 3 变差**; 变差仅 2020 -1.8 / 2025 -2.3 / 2026 -2.4pp;
  #   改善 2021 +33.5 / 2022 +26.8 / 2015 +10.9 / 2024 +6.9 / 2016 +6.5 / 2018 +3.7 / 2013 +3.2 /
  #   2019 +2.6 / 2023 +2.2 / 2014 +0.9 / 2017 +0.6 / 2012 +0.2; 样本外 2012~2019 八年**全部改善**。
  # 代价如实说明: ①全史最大回撤 -24.72% → -25.94%(+1.22pp), 1500 日 -14.23% → -14.69%(+0.46pp) ——
  #   卡玛仍升(7.78→7.99 / 2.85→2.89), 是"多赚 41%、多担 1.2pp 回撤"; ②实盘从两笔单简化为**一笔**:
  #   14:55 一次性清仓, 不再有 9:25 的开盘腿 —— 对人工执行更简单, 但尾盘单笔冲击成本略高(滑点仍按千1计)。
  # 同轮证伪(全部同引擎实测, 均不启用, 能力保留在代码中):
  #   ① 风控解除后渐进建仓(新增 regime.reentry_ramp_days/start): 3日@0.5=4302.24、5日@0.5=(腰斩)、
  #     8日@0.5=4302、5日@0.3=3970 —— **不是"不确定期", 反弹初期恰是 edge 最强的一段**, 降仓等于削掉最肥的肉;
  #   ② 跨日分批出场(新增 execution.defer_frac/defer_days, 尾腿延到 T+3): 0.3×1日=4821.49、
  #     0.5×1日=3336.37、0.3×2日=3507.71 —— **日内有斜率、隔夜无溢价**, T+2 收盘是终点站;
  #   ③ 个股超额涨跌因子(新增 selection.dip_weights.res_pct, 把刀口保护连续化): 0.05=6245.79、0.10=3493.90;
  #   ④ 刀口阈值复扫: res_below -3.0=7806.13 / -5.0=6638.86(vs -4.0 的 10047.62) —— -4.0 仍是峰值;
  #   ⑤ 池深中间档复扫: 0.4=9730.79(-317pp 但在噪声带内, 卡玛 8.24 更高) / 0.6=10354.81(-卡玛);
  #     取 0.4 属"收益换回撤", 差异均在噪声带内, 按纪律不动; ⑥ gap_floor.min_pool 3 与 5 **逐位相同**(饱和)。
  sell_open_frac: 0.00
  # ---- 第一百一十九轮: 极端浮盈开盘兑现(唯一新增参数) ----
  # T+2 开盘相对买入价浮盈 >= 本值时, 该笔改为**开盘价全额卖出**(仅这一笔, 其余仍 14:55 收盘卖)。
  # 为什么需要它: sf=0 之后所有开盘时点的条件规则(scd 深跌延卖 / spb 浮亏延卖 / hold_if_open_gain)
  #   全部失效 —— 因为默认路径就是"收盘卖", 它们想做的事已经是默认。只有 sfg 是反向的
  #   ("提前到开盘卖"), 在 sf=0 口径下仍然活着, 也是唯一能改出场时点的开关。
  # 为什么是 15%: 两个交易日内浮盈 15% ≈ 两个涨停, 右尾已经在开盘这一刻全部兑现。
  #   全史 4 笔触发(4/4 改善 +1.54/+2.29/+5.65/+7.72pp); 1500 日 1 笔。
  #   阈值曲线是"越高越好"直到基线(2/3/4/5/6 = 2505/4880/5938/6151/6279 vs 基线 7348),
  #   15% 是极端档, 不是被挑出来的最优点(12% 全史反而 -14208pp, 说明 12~15 之间是噪声)。
  # 不启用的理由也都留档: 5% 档覆盖 8.5% 的交易, 属"把例外当规则"(第一百零四轮证伪)。
  sell_full_if_open_gain: 15.0
  # ---- 浮亏延卖(第九十八轮验证, 证伪·不启用): 换一个刻度看"该不该等日内修复" ----
  # 假设: T+2 开盘相对**我的买入价**浮亏时, 改为当日收盘卖出(等日内修复); 浮盈则开盘落袋。
  #   与 sell_close_if_open_drop 的区别: scd 看"相对昨收的跳空", spb 看"相对我的成本"——
  #   同一个 -2% 跳空, T+1 大涨后是浮盈 +1%, T+1 崩盘后是浮亏 -7%, 日内修复概率不同。
  # 逐笔证据(545 笔): 开盘卖 +0.712%/胜率56.5% → 跳空延卖 +0.741% → 浮亏延卖 +0.920%/67.0%;
  #   浮亏落在 -3~-2% 的 49 笔日内平均修复 +1.11%(修复最猛的一段)。方向看起来成立。
  # 回测(同面板同引擎):
  #   1500日: 776.02%/-24.45%/545笔/卡玛1.80 → 764.98%/-21.21%/508笔/卡玛2.06 (持平, 回撤-3.2pp)
  #   全史:   1155.48%/-41.80%/1119笔/卡玛0.50 → 1775.96%/-27.83%/1045笔/卡玛0.88 (收益+620pp)
  #   —— 到这里看是"全面改善"。
  # **分年拆开就翻转**(1500日, spb-0.3 减基线): 2020 +11.9 / 2021 +4.3 / 2022 +39.9 /
  #   2023 -5.7 / 2024 +21.0 / 2025 -4.8 / **2026 -68.0pp**(基线+102.6% → +34.6%)。
  #   最近 12 个月回放: 75.87%/-16.52% → 22.88%/-14.99%(-53pp)。
  # 结论: 这条规则"历史上对、当下错" —— 越靠近现在, 日内反转越弱(T+2 开盘浮亏往往继续走弱),
  #   且收盘卖使资金 T+3 才能再投(笔数 545→508, -7%), 在快节奏行情里双重吃亏。
  #   与第九十七轮"高开降仓"(早期差、当下对)恰好相反; 那个敢用是因为当下有效, 这个不敢用同理。
  # 引擎与实盘端保留开关(缺省 None=不生效), 供后续结构再变时复测:
  # sell_close_if_profit_below: -0.3
  # 注: A股T+1制度, 当日买入的股票当日不可卖出。系统不存在任何
  #     "当日买入当日卖出"规则(此前版本的尾盘止损/风控尾盘离场已回滚,
  #     其回测收益数字无效), 所有持仓最早于次一交易日开盘卖出。
  alloc_frac_pct: 100.0      # 每笔买入占组合总资产比例(%): 单吊口径, 全仓买入评分第1名
                             # ★第一百三十一轮: 不要为了"提高资金利用率"把它降到 50~70%。
                             #   满仓单吊 + T+2 收盘卖 => 回笼款 T+3 才可用, 天然"隔天才能再买";
                             #   而"连续信号日"(前一日也可买)期望 -0.388% vs 间隔日 +0.527%,
                             #   按池深分层后满仓档是 **-0.155% vs +1.377%(差 1.53pp)** ——
                             #   资金约束在无意中过滤掉了"趋势连跌"的坑, 它本身是 alpha 的一部分。
                             #   分仓 / 降仓位 / 缩短持有期都会同时拆掉这个过滤器
                             #   (第一百一十四轮 2x50% 分仓 1229% vs 单吊 6392% 的真正机制)。
  max_buy_per_day: 1         # 每日最多买入只数: 1=单吊(与实盘人工执行一致; top1不可成交时顺延下一只)
  commission_rate: 0.00025   # 佣金万2.5(双边)
  stamp_tax: 0.0005          # 印花税(卖出)
  slippage: 0.001            # 滑点(双边各千1)
                             # ★第一百二十八轮(成本敏感性, tools/exp_cost.py, 1500 日同一批 379 笔):
                             #   单边 0.10/0.20/0.30/0.50/1.00% → 总收益 8495/4736/2666/805/-44.5(%),
                             #   年化 111.3/91.9/74.7/44.8/-9.4(%)、卡玛 6.32/4.82/3.49/1.63/-0.13、
                             #   单笔 1.507/1.290/1.087/0.684/-0.318(%) —— **笔数恒为 379**。
                             #   机制: 买卖决策不看盈亏, 滑点是纯乘性成本, 在 379 次复利上变成指数:
                             #   每 10bp 单边 = 单笔 -0.20pp(正好往返 0.2%) ≈ 累计 -44%。
                             #   平衡点单边 0.80~0.85%(往返 1.7%); 全史单笔 1.153% 更低, 约 0.55%/边。
                             #   → 千1 对小资金+竞价成交是合理假设; 但它同时意味着
                             #     **容量上限不是"买不到", 是"买到的价把边际吃光"**。
                             #   → 也解释了 buy_limit_fill 全系列为何证伪: 省 0.2% 价的代价是漏掉整笔 +1.5%。

risk: {}                     # 行为风控(可选; 第六十三轮清空——month_profit_cap已删除)
  # month_profit_cap 已删除(第六十三轮用户拍板, 随口径切换top30一并):
  # top30口径下熔断成本646pp(1630.28%→2275.75%)且回撤零改善(-9.05%两档同)、卡玛反而更低(35.58 vs 43.68);
  # top10口径下成本仅29.5pp(留档: 第五十三轮审计, 恢复方法 = 加回 {cap_pct: 30, cut_frac: 0.6})

monitor:                     # 滚动失效监测(2026-10-24第三十九轮, 纯告警层, 不改执行逻辑)
  enabled: true
  window: 20                 # 滚动窗口(已结算净收益笔数); 实盘月均4~6笔, 20笔约3~5个月
  watch_mean_pct: 1.0        # 滚动均值<+1% -> 黄-观察带(回测基准单笔+3.24%的一半; 整数锚点防挖掘)
  warn_mean_pct: 0.0         # 滚动均值<0% -> 红-失效警报(与正期望主张背离)
  halt_mean_pct: -1.0        # 滚动均值<-1% -> 深红-建议停机复检

backtest:
  trading_days: 1500         # 回测窗口(交易日, 第九十五轮 500→1500): 500 日只覆盖 2024-10 起的
                             # 小盘牛市, 是"收益虚高"的根源(同配置在前一个 500 日窗口 -86.7%)。
                             # 1500 日覆盖 2020-11~2026-10: 含 2022 熊市、2024-01 小盘流动性危机、
                             # 2024-09 反转、2025 震荡, 跨越完整情绪周期。
  warmup_days: 160           # 指标预热与上市天数校验窗口
  initial_capital: 1000000.0 # 初始资金(元), 复利滚动

pages:
  title: "A股次日候选池系统"
  history_keep_days: 60      # Pages 展示的历史战绩天数

# ─────────────────────────────────────────────────────────────────────────────
# 副策略 v4: 低波组合轮动(第一百四十五轮)
#
# 为什么换了形态(单吊 → 20 只等权)
#   因子扫描(1500 日 69 个调仓点): 10 个因子里低波最强(五组完全单调, 多空 2.26%/20日,
#   IC -0.131), 动量是负的; 但那个收益是**一组约 100 只等权**的均值, 单吊等于从中抽 1 只。
#   实测 1500 日 / 全史 3378 日:
#     单吊 40 日        +50.88% / -49.13% / 卡玛 0.14   |  全史年化  8.5% / -56.8%
#     低波 20 只 20 日   +55.50% / -27.78% / 卡玛 0.27   |  全史年化 12.79% / -40.13% / 0.32
#   收益不变、回撤减半、卡玛翻 2.2~2.5 倍 —— 差别全部来自"不再抽样"。
#
# 口径(与 tools/rotation_backtest.py、tools/rotation_run.py 逐条一致)
#   · 池子与主策略共用: 沪深主板 / 非ST / 非停牌 / 上市满250日 / 成交额≥1亿 / ivol>0
#   · T 日收盘按 ivol20 升序取前 n_hold 只等权 → T+1 开盘调仓(出榜卖/进榜买/留榜不动)
#   · 每 hold_days 个交易日调一次; 单边成本 0.15%; 不做大盘闸门(R6 实测更差)
rotation:
  n_hold: 20                 # 持仓只数(等权, 10 万本金每只约 5000 元)
  hold_days: 20              # 调仓间隔(交易日)
  amount_min_yi: 1.0         # 成交额下限(亿)
  max_ivol: 0                # ivol 上限(0=不限)
  min_pool: 100              # 基础票池样本下限: 截面太窄时分位无意义, 不出新清单

satellite:                   # 独立副策略: 单吊(与主策略同构), 每日最多 1 只、100% 仓位
  # ── 与主策略的关系 ────────────────────────────────────────────────────────
  # 数据一套、策略两套: 同一个 ZZClient、同一份面板与指标, 每日只取一次最新数据,
  # 两个策略在同一份数据上各算各的。执行架构一致(单吊/次日开盘买/T+N 卖/不达标不成交),
  # 选股与风控参数独立, 各自记账, 不合并资金。
  #
  # ── 为什么"上涨趋势"用在大盘而不是个股 ──────────────────────────────────
  # 第一百三十九轮四组实测(单吊满仓, 1500 日 / 全史 3378 日):
  #   阳线突破(近20日新高) H20     +6.0%/-69.7%  |  全史 -1.2%/-73.5%
  #   趋势内回调(pullback) H10     +12.4%/-76.1% |  全史 —
  #   纯均线多头 H5                +3.2%/-88.6%  |  全史 —
  #   趋势过滤+ivol最低 H20        -6.4%/-72.9%  |  全史 +5.2%/-71.0%
  #   纯 ivol 最低 H20             +7.8%/-42.7%  |  全史 +6.1%/-57.6%
  # 把"上涨趋势"当选股因子(追最强)是负期望 —— A 股短周期均值回复, 追突破是接盘;
  # 当过滤器(只在多头排列里挑最稳的)也没有增量。真正有效的是把趋势用在大盘:
  # 指数在 MA20 上方才开新仓 —— H40+止损, 1500 日回撤 -53.7%→-42.8%、全史 -64.9%→-56.8%,
  # 收益反而从 +7.8%/+7.8% 升到 +6.3%/+8.5%(近端小降、全史小升, 属噪声内换风险)。
  # ↑ 以上全部是**年化**, 且是第一百三十九轮的"实验口径"(第 N+1 日开盘卖、卖出当日即再买)。
  # 实盘/账本口径是"第 40 个交易日**收盘**卖、止损当日收盘成交、卖出后空一天再买":
  #   1500 日 总+50.88% / 年化 7.10% / 回撤 -49.13% / 32 笔 / 胜率 50%(output/satellite_bt.json)
  # 两种口径在 tools/exp_sat_exit.py 的 2x2x2 矩阵里逐位可复现(旧脚本那格 +44.21%/-42.75%
  # 与新脚本同开关下完全一致), 差异全部来自规则而非引擎 —— 别再把它当成 bug 重查一遍。
  #
  # ── 与 v2(40 只分散)的对比 ──────────────────────────────────────────────
  #   分散 40 只: 1500 日 +7.7%/-27.4% | 全史 +8.8%/-52.9%
  #   单吊 1 只 : 1500 日 +6.3%/-42.8% | 全史 +8.5%/-56.8%
  # 收益同量级, 单吊回撤大 15pp/4pp —— 这是"集中"的必然代价, 不是参数没调好。
  # 之所以仍然单吊: 与主策略共用一套执行纪律(每天只需一笔、盘前就知道买谁), 人工可执行;
  # 以及"主策略失效时还有一条腿"的定位, 不是追求收益。
  #
  # ── 红线 ────────────────────────────────────────────────────────────────
  # 不并入主策略资金; 两条腿各自记账。
  mode: lowvol               # lowvol=低波(默认) | trend_lowvol=均线多头里挑低波(全史更差)
  hold_days: 40              # 持有交易日数 = 单吊一笔的持仓周期
  max_ivol: 0                # ivol 上限(0=不限)
  amount_min_yi: 1.0         # 股票池成交额下限(亿)
  cost_pct: 0.3              # 往返成本(%): 滑点千1x2 + 佣金万2.5x2 + 印花税万5
  gap_min: -3.0              # T+1 竞价缺口下限(%): 深低开破位不接
  gap_max: 5.0               # 上限: 高开过多不追
  stop_pct: -12.0            # 止损(%): 收盘相对买入价跌破即卖; 0=关闭
  market_gate: true          # 大盘趋势闸门: 指数在 MA20 上方才开新仓
  min_pool: 20               # 基础票池样本下限, 不足则不出票(宁缺勿滥); 这是"可选面够不够宽", 不是池深
  # 候选池口径(第一百四十三轮定稿): 单吊只有一个执行标的 —— 候选池恒 1 只。
  # 硬性条件之后仍有 ~1800 只, 按 ivol 升序排, 但只有第 1 名进候选池:
  #   基础票池 base = 通过硬性条件的全部只数(只画漏斗 + 检查样本量)
  #   候选池 pool   = base 按 ivol 升序的第 1 名, pool_show 固定 1, 页面只列这 1 行
  #   备选排序 alt  = 第 2 ~ pool_alt 名, 折叠展示并标注"不参与执行" —— 不进池、不影响仓位、
  #                  不参与回测, 只为回答"第 2 名是谁、比第 1 名差多少"
  # 池深 20 只而只买第 1 只, 那 19 只既不参与执行也不影响仓位, 不是候选而是排序结果;
  # 摆在"候选池"标题下会让人以为要在这 20 只里挑, 与单吊的实际行为相反。
  pool_show: 1
  pool_alt: 20
