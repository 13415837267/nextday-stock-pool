# =====================================================================
# A股次日候选池系统 - 策略参数配置
# 交易模式: T日收盘后出池 -> T+1开盘竞价买入 -> T+2尾盘(约14:55)全额卖出
#   (唯一例外: T+2 开盘浮盈已达 +15% 时改为开盘全额卖出, 见 sell_full_if_open_gain)
# =====================================================================
#
# 【第一百二十九轮: 容量天花板 —— 千万级, 不是无限】
#   起因: 滑点只是假设值, 真正决定它的是**参与率**(投入金额/成交额), 而参与率随规模
#     线性上升、复利又把它推成指数级。本轮把"这套策略能装多少钱"算成硬边界。
#   口径: tools/exp_capacity.py, 1500 日 379 笔; p = 投入 / T+1 全天成交额;
#     单边冲击 = k·√(p%), k=15(温和)/30(凶悍); 单笔最多吃 5% 成交额(超出按部分成交,
#     因平方根模型在 p>10% 无实证支撑)。
#   A. 流动性画像: 成交额中位 2.49 亿 / P10 0.90 / P25 1.43 / P90 10.37 / 最大 103.9 亿
#      → 满仓单吊容量线 = 5% × 2.49 亿 = **1250 万**; 最差一成票只有 450 万。
#      （这是"深低开承接"的必然代价: 肯在缺口后割肉的票本来就是流动性差的中小票）
#   B. 容量曲线(固定单笔, 不复利; 增量冲击, 不含已有千1滑点):
#      单笔 100万 → 年化 94.3%(留存 58.7%) / 300万 81.7%(39.0%) / 500万 73.1%(28.9%) /
#           1000万 63.9%(20.5%) / 2000万 50.7%(12.0%) / 5000万 33.6%(5.3%) / 1亿 21.9%(2.6%)
#      → 规模每 ×10, 年化掉 15~20pp。超过 5% 上限后仓位被压缩, 是"稀释"不只是"扣费"。
#      → 即使 100 万也只剩 58.7%: 379 笔 × 16.7bp 在 85 倍复利上放大就是 41% 净值。
#   C. 两条死路: 硬买满(不限成交量) 2000 万 k30 就 -22.6%、5000 万 -95.3%;
#      受约束口径永远为正, 但 1 亿时平均实仓只剩 **19.6%**、91.6% 的笔被迫减仓
#      —— 那不是"赚得少", 是"策略退化成 80% 现金 + 小仓位试水"。
#   D. 三条扩容路全部封死(历史裁决): 多票分散(114轮 2×50%=1229% vs 6392%)、
#      降换手(64轮 hold 1/2/3 日卡玛 6.5/5.9/2.4 vs 33.1)、扩池(92轮 加科创 906%/加北交 712%)。
#   E. 所以真实画像是: **千万级容量 / 年化 60~90% / 回撤 -18%**, 而不是回测 8495% 暗示的
#      "无限流动性 + 永续复利"。数值零变更, config_fp 不变。
#
# 【第一百二十八轮: 周内日历维度证伪 + 成本敏感性 —— 参数零变更】
#   起因: 用户「继续优化策略研究」。参数/特征/开关三层已在 121/126/127 轮证伪,
#     本轮只测"从没进过模型的维度"。研究本身在 GitHub Actions 里跑
#     (.github/workflows/research.yml + tools/exp_dow.py / exp_cost.py), 因为本机拉不动
#     548MB 的 data/panel (实测 20~25KB/s, clone 3 分钟只到 1.1MB)。
#   A. 周内日历 (全史 3378 日 / 891 笔, 按 signal_date 的星期分组):
#      周一 n=149 +0.833% / 周二 194 +1.312% / 周三 174 **+0.377%** / 周四 199 **+1.620%** / 周五 175 +1.492%。
#      · **五个星期全为正**, 最差的周三也对数贡献 +0.467 —— 剔除任一天都比不剔差(近似 9430x → 480~5911x);
#      · 排序跨时代翻转: 2012-2019 最差周三/最好周四; 2020+ 最差周三/最好周五, 周二从第 4 跳到第 2;
#      · 1500 日窗口里"周一最差(-0.18%)"在全史是第三名(+0.833%) —— 又一个窗口产物。
#      → 日历维度关闭, 不登记候选(config 无对应开关, 也不加)。
#   B. 执行成本 (1500 日, 同一批 379 笔, 只改 execution.slippage, 见该行注释):
#      单边 0.1/0.2/0.3/0.5/1.0% → 8495/4736/2666/805/-44.5(%); 笔数恒 379。
#      每多 10bp 单边 = 单笔 -0.20pp ≈ 累计 -44%; 平衡点单边 0.8~0.85%。
#      → **成交价比任何参数都重要一个数量级**(bias 11.4→11.2 是 +4%, 滑点 0.1→0.3% 是 -69%)。
#   C. 纪律不变: 本轮不动任何数值, config_fp 不变。
#
# 【第一百二十一轮: 参数冻结 —— 三个检验证明"继续调参"已无信息量】
#   本轮不改任何策略参数。起因: 用户质询"这样一直调参是否过拟合", 遂把这件事测出来而不是辩解。
#   A. 参数排名跨年一致性 (tools/param_rank_stability.py):
#      · 同一参数取 5 档, 各跑全史, 按**交易级平均单笔收益**在 13 个完整年上排名, 算 Kendall W。
#      · bias20_max (10.5~12.5):        W=0.058, chi2=3.03 (df=4, 临界 9.49) —— 不显著。
#      · dip_vol_ratio_max (3.0~5.0):   W=0.008, chi2=0.43 —— 完全随机(13 年里有 4 年五档完全相同)。
#      · 最硬的证据是**排序矛盾**: 按年度平均排名 12.0 最好(2.58)、11.4 只第二(2.81);
#        但按全样本总收益 11.4=30.8万% vs 12.0=23.7万% —— 差距来自 2015 一年(1.436 vs 1.176),
#        被复利放大成 7 万 pp。"全样本最优"不是"每年都好", 是"某几年特别好"。
#   B. 调参战果 vs 年份差异:
#      · 同一参数 5 档的全史收益跨度仅 **1.68 倍**;
#      · 同一年度之间的平均单笔从 2017 的 -0.06% 到 2022 的 +2.60%, 跨度约 **40 倍**。
#      → 在 1.7 倍的空间里按 0.2 步长精调, 是在用放大镜看噪声。
#   C. 随机参数基线 (tools/param_random_baseline.py, 8 参数 x 30 组均匀采样 x 1500 日):
#      · 收益 min 677.52 / P10 1114.98 / **中位 2640.36** / P90 5700.82 / max 6905.16 (%);
#      · 卡玛 min 1.31 / 中位 3.07 / max 5.05; **30/30 全部正收益**。
#      · 当前 config 8478.08% / 卡玛 6.32(实验时口径, 2026-11-01 数据), 高于 30/30 —— 分布外的点。
#      → 结构本身的贡献约 +2640%(年化 63.6%), 调参的名义贡献是 **3.21 倍**, 按 A 大概率不可外推。
#   D. 结构层不是过拟合 (tools/deflated_sharpe.py):
#      · 即使按 2500 次**独立**试验计(实际试验高度相关, 有效数远小于此),
#        1500 日夏普 2.55 的 DSR = 99.62%、全史 2.12 = 100.00%。
#      · 但 DSR 只排除"纯噪声", 不证明"参数选对了" —— 这是两件事。
#   E. 由此确立的纪律(自本轮生效):
#      1) 不再做参数数值搜索; 迭代只允许"结构性"(新维度/新机制)与"风险控制"两类。
#      2) 参数取值一律取**平台中点**, 理由写"它不特殊", 不写"它最优"。
#      3) 任何参数变更前先跑 tools/param_rank_stability.py; W<0.3 时单点最优不得作为改参依据。
#      4) ab_test.py 已内置噪声护栏: 相对收益 ±3% 且卡玛 ±0.15 以内的变体标注"≈噪声"。
#   F. 前瞻锚下调: 年化 30~40% → **20~30%**, 回撤 -30% 量级。
#      依据: 随机参数中位对应年化 63.6%(样本内) + WF 测试段中位 +25.18%(折间),
#      再对单吊、容量、冲击成本打折。
#
# 【第一百二十轮: 首次 Walk-Forward 样本外建设 + bias20_max 11.0→11.4】
#   起因: 全仓 119 轮迭代都是"全样本内优化", 从未做过训练/验证/测试切分。本轮先补验证体系,
#     再用它裁决一个参数改动 —— 顺序是"先有尺子, 再量东西"。
#   A. 参数冻结的时段切分(tools/period_split.py, 当前 config 不重调参):
#      · 按年 14 段: 正收益 **13/14**, 中位 +60.69%, 最差 **-7.02%(2017)**, 均值 +92.19%;
#        单笔收益中位 1.05%, 唯一负单笔年也是 2017(-0.06%)。
#      · 按 250 交易日 13 段: 正收益 **11/13**, 中位 +55.49%, 最差 **-6.24%**, 均值 +95.64%。
#      · 分年收益连乘 = 244,500%, 与全史 +239,208% 同量级 —— 切分未破坏结构, 数字自洽。
#      · 结论: 盈利不是集中在 2021/2022 两年(那两年 +239%/+269% 贡献最大, 但 2013~2016 也是
#        +55.8/+52.2/+260.5/+73.5)。**但这仍不是样本外** —— 参数就是在这些年份上选出来的。
#   B. 真 Walk-Forward(tools/walk_forward.py, 5 折 × 训练 900 日滚动 → 测试次年, 不看测试段):
#      · 预注册网格: bias20_max[10/11/12] × dip_vol_ratio_max[3.5/4.0/4.5] × market_ma[18/20/22]
#        × vol_max[2.0/2.2/2.4] × turnover_min[1.7/2.0/2.3], 单轴扫描, 准则=训练段卡玛。
#      · 测试段 重选参数 vs 现行参数(2017/2019/2021/2023/2025):
#        -2.94 vs -7.02(+4.08) / 7.10 vs 14.21(-7.11) / 175.06 vs 238.97(-63.91) /
#        28.54 vs 25.18(+3.36) / 97.29 vs 56.00(+41.29); 合计 **-22.29pp**, 中位 +3.36pp,
#        正收益年数 4/5 vs 4/5 —— **重选没有系统性优于现行**, 说明现行参数不是"全样本拟合的尖峰"。
#      · 关键发现: **参数在折间不可辨识**。同一网格上 5 折选出的最优值:
#        bias 10/12/12/12/11、dvr 3.5/4.0/4.5/4.5/4.0、ma 18/18/18/20/20、turnover 2.0/2.0/2.0/1.7/1.7。
#        一个参数若真有信号, 最优值应跨折收敛; 这里全部漂移 → 训练段最优值没有外推意义,
#        "把参数精调到小数点"是伪优化。现行值应取各折最优的**中位数**而非众数。
#      · 三处局限已如实记录在 tools/walk_forward.py 的 docstring: 只动 5/100+ 参数、单轴忽略交互、
#        5 折样本太少。
#   C. 采纳: `selection.bias20_max: 11.0 → 11.4`
#      · 依据链: 上述 WF 5 折中 bias 有 3 折选 12(≥11), 提示现行 11.0 偏紧 → 在 11.0~12.5 做
#        细扫 → 1500 日 11.2~11.6 是**连续平台**(回撤全部 -17.61%, 卡玛 6.32~6.42),
#        11.8 起回撤恶化到 -19.22、12.5 到 -20.01 → 取平台几何中点 **11.4**。
#      · 1500 日: 8086.78→**8478.08%**(+391.30pp)、回撤 -18.59→**-17.61%(改善 0.98pp)**、
#        卡玛 5.90→**6.32**、夏普 2.50→2.55、笔数 378 **不变**、单笔 1.474→1.475%。
#      · 全史: 239208.88→**307843.18%**(+68634.30pp)、回撤 **-28.85% 逐位不变**、
#        卡玛 2.73→**2.85**、夏普 2.06→2.12、笔数 894→890、胜率 53.91→54.72%、单笔 1.086→1.139%。
#      · 双窗口同向、回撤不恶化(1500 日还改善)、按年 15 段 **7 改善 / 6 变差 / 2 持平**。
#      · **为什么是 11.4 而不是更好的 11.6**: 全史在 11.6 更高(364977.93%, 卡玛 2.93),
#        但 1500 日 11.6(8607.80)低于 11.2(8907.77), 且 11.6 距 -19.22 的悬崖只有 0.2。
#        两个窗口的最优点不同(1500→11.2, 全史→11.6), 这本身就是"区间内不可辨识"的证据,
#        取中点是对不确定性的定价, 不是对收益的让步。
#   同轮否掉: market_ma 18(1500 日 4706.74%, -19.89%, 卡玛 4.61 —— WF 有 3 折选 18, 但那是
#     训练段多含熊市所致, 全窗口直接崩塌, 再次印证"训练段最优 ≠ 可用"); bias 11.8/12.0/12.5
#     (1500 日回撤恶化); 时段切分表里 2017 的 -7.02% 未做任何针对性规则 —— 针对唯一负年下药
#     就是第一百零四轮否掉过的"月度亏损熔断"式拟合。
#   基线: 1500 日 +8478.08% / -17.61% / 卡玛 6.32 / 夏普 2.55 / 378 笔 / 胜率 56.35% / 单笔 1.475%;
#         全史 +307843.18% / -28.85% / 卡玛 2.85 / 夏普 2.12 / 890 笔 / 胜率 54.72% / 单笔 1.139%。
#         年化 **111.26% / 82.10%**。
#
# 【第一百一十九轮: 结构性维度补测 20+ 组, 只留一条 —— sell_full_if_open_gain 15%(极端浮盈开盘兑现)】
#   起因: 第一百一十八轮把"选股边界"在干净口径下扫完了, 但仍有几类维度从 104 轮之后就没再碰过:
#     出场时点的条件规则(sf=0 之后只剩 sfg 一条腿还活着)、仓位分散/分档、池深顺延、流动性口径、
#     备用池构成。本轮一次性补测 20+ 组, 双窗口裁决。
#   采纳(唯一): `sell_full_if_open_gain: 15.0` —— T+2 开盘相对买入价浮盈 >=15% 时, 开盘全额卖出
#     (其余照旧 14:55 收盘卖)。1500 日 7348.23→**8086.78%**(+738.55pp)、回撤 **-18.59% 逐位不变**、
#     卡玛 5.72→**5.90**、笔数 377→**378**; 全史 219896.21→**239208.88%**(+19313pp)、回撤 **-28.85% 不变**、
#     卡玛 2.69→**2.73**、笔数 893→**894**。双窗口同向、零回撤代价、其余 889 笔逐位不变。
#   **证据强度如实说明**: 全史仅触发 **4 笔**(2013-08 启明信息 +1.54pp / 2016-11 深圳华强 +2.29pp /
#     2024-10 远东传动 +5.65pp / 2025-09 同洲电子 +7.72pp, 4/4 改善, 简单加总 +17.20pp);
#     1500 日仅触发 1 笔。样本太小, 不构成统计显著的 alpha —— 它的定位是"纪律型补丁":
#     两个交易日内已浮盈 15%(≈两个涨停), 说明右尾已经全部前置到开盘这一刻, 再赌最后一小时是负期望。
#     与第一百零四轮否掉的 sfg=5 **不是同一命题**: 5% 覆盖 8.5% 的交易(49/575), 是"把例外当规则";
#     15% 只覆盖 0.45%(4/894), 是"只处理极端右尾"。sfg 2/3/4/5/6 本轮重测仍全面劣于基线
#     (2505/4880/5938/6151/6279 vs 7348), 与 104 轮结论一致 —— 被采纳的只有极端档。
#   同轮证伪(全部双窗口或结构性理由否掉, 其中两条是"1500 日窗口陷阱"的教科书案例):
#     ① 分散持仓(2 票各 50%): 1500 日 **1213.60%**(-6135pp)、回撤只从 -18.59 降到 -16.91 —— 分散没买到
#        多少回撤, 却把单笔期望从 1.436% 稀释到 0.951%(多出的 285 笔是 top2 的劣质票)。结论: 回撤来自
#        市场系统性, 不是集中度; 单吊是特性不是缺陷。3 票各 33% 与 45% 仓位同向更差。
#     ② 换手下限 3.0: 1500 日 **10120.02%**(+2772pp, 卡玛 6.33) 但全史 **146793.42%(-73103pp)**、
#        回撤 -28.85→**-49.54%**、卡玛 2.69→1.46 —— 又一个 1500 日窗口陷阱。细扫 1.2~5.0 全曲线
#        8501/6893/7348/5533/6493/7799/10120/6250/4322/2022/376 是锯齿不是平台(3.0 是孤峰),
#        维持 2.0。
#     ③ 评分权重 neg_bias20 0.65: 1500 日卡玛 6.16、回撤 -16.88 看着像"风险改善", 但全史 **129833.29%
#        (-90063pp)**、回撤 -32.07、卡玛 2.21 —— 同轮否掉。0.55/0.80/0.90 双窗口皆差, 0.7 仍是峰。
#     ④ 择时均线 18/22/24/26/30: 4273/5507/5160/5156/5990, 全部劣于 MA20 的 7348, 且 22~30 的回撤
#        一律恶化到 -23.93%(vs -18.59) —— MA20 不只是收益最优, 也是回撤最优。
#     ⑤ 评分分档下注(低分降仓三档): 6420/5849/6006 全差 —— 与 perf_gate 同因, 复利策略里"自我降仓"
#        就是减少在场次数, 绝对收益必崩。
#     ⑥ 单吊顺延(exec_top_n 2/3/5, 仍只买 1 只): 7405/7596/7466, 只多 9~12 笔、+50~250pp, 噪声内。
#     ⑦ 备用池: 全关 4181.10%(961 笔/回撤 -31.11) 最差; 单族保留 momentum 7274.55 / oversold 7232.76 /
#        pullback 5490.43 —— 三族互补, pullback 贡献最大, 维持三族全开。
#     ⑧ 其余零变更: listed_min_bars 100/250/400=6742/7575/3172(150 最优); amount_min 1.0/1.5=4948/3545;
#        turnover_max 10=3530(回撤 -24.35); price_max 100=7800(回撤 -19.32 恶化); buy_gap_below
#        -0.3/-0.5/+0.3=1034/769/4109; skip_open_loss 3/5=6413/7020; dip_pct_min -6.5/-7.0/-8.0=5836/4808/3860;
#        neg_vol_ratio 0.10/0.20=5335/3594; neg_amount 0.10=4845; top_n 300/800 与基线**逐位相同**(参数不绑定)。
#   基线: 1500 日 +8086.78% / -18.59% / 卡玛 5.90 / 夏普 2.50 / 378 笔 / 胜率 56.61% / 单笔 1.474%;
#         全史 +239208.88% / -28.85% / 卡玛 2.73 / 夏普 2.06 / 894 笔 / 胜率 53.91% / 单笔 1.086%。
#         年化 109.61% / 78.68%。
