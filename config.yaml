#     全史回撤在两项改动上都**逐位不变**(-28.85%), 说明新增票未进入历史最危险的持仓路径。
#     这一轮的教训: PIT 修复不只是"改数字", 它改变了排序, 于是所有边界都要重扫一遍。
#   第一百一十七轮: 参数零变更。但"历史最优值"的可信度要重新标注 —— 第 109~116 轮的所有扫描都在
