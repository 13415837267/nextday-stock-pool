# 【第一百一十七轮: PIT 全面自查 —— 修掉三处隐性前视, 基线腰斩(参数零变更)】
#   起因(用户问"策略没有未来函数吧"): 时序十年没变(T日收盘选股 -> T+1开盘买 -> T+2收盘卖),
