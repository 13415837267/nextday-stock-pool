# =====================================================================
# A股次日候选池系统 - 策略参数配置
# 交易模式: T日收盘后出池 -> T+1开盘竞价买入 -> T+2尾盘(约14:55)全额卖出
# =====================================================================
#
# 【第一百一十八轮: PIT 干净口径下的第一次全域复扫 —— bias20_max 8→11, dip_vol_ratio_max 3.5→4.0】
#   起因: 第一百一十七轮把口径整个换成 PIT 干净版(修掉三处前视), 但此前 109~116 轮的所有"最优值"
#     都是在含前视的旧口径下测的。**口径变了, 峰就未必还在原来的位置** —— 本轮做一次全域复扫。
#   先验证前几轮的三个"取消类"改动在新口径下是否仍成立(全部成立, 无一回退):
#     sell_open_frac 0/0.02/0.05/0.10 = 4987/4865/4692/4365(卡玛 4.35/4.35/4.35/4.47) —— 全押尾盘仍最优;
#     knife_tiers.mult 0/0.15/0.30 = 4987/4789/4609(卡玛 4.35/3.95/3.62) —— 刀口组剔除仍最优;
#     gap_floor_tiers.min_pool 5/11 = 4987/4054 —— 5 仍最优; vol_max 2.2/2.0 = 4987/4809 —— 2.2 仍最优。
#   再扫核心选股边界(15 组), 找出两处真漂移:
#     ① bias20_max 8→11: 1500 日 4987→6781, 全史 89856→197556(2.2 倍), 回撤 -28.85% 逐位不变。
#        旧结论"9~12 衰减、12 时回撤崩"是前视排序的产物 —— 新口径下 9~12 是连续 4 点平台。
#     ② dip_vol_ratio_max 3.5→4.0: 在 bias=11 之上再 +567pp(6781→7348), 全史 197556→219896,
#        回撤仍逐位不变。4.0~4.5 是平台(最大差 26pp), 5.0 才回落。
#   **两项都是"放宽质量约束"而非收紧**: 池子变深、单吊的 top1 质量上升, 不靠减少交易换收益。
#   最终: 1500 日 +4986.84% → +7348.23%(回撤 -21.51→-18.59, 卡玛 4.35→5.72, 笔数 377 不变);
#         全史 +89855.72% → +219896.21%(回撤 -28.85 不变, 卡玛 2.29→2.69, 笔数 893 不变)。
#   同轮证伪(全部因"全史反向"被否掉, 又一个 1500 日窗口陷阱的实例):
#     min_top1_score 1.06: 1500 日 8802(+1454pp, 卡玛 6.46) 但全史 173383(-46513pp, -21%) —— 窗口效应;
#     blocked_frac 0.5: 1500 日 7744 但全史回撤 -31.59%(+2.74pp 恶化)且卡玛 2.46 < 2.69 —— 拿回撤换收益没换成;
#     vol_max 2.4: 1500 日 7513 但全史 205970(-13926pp) —— 收益降、卡玛降;
#     pool_n_tiers 中间档 0.6 / dip_close_pos_max 0.40 / dist_low20_min 8/10 / mom20_max 20/30/35 /
#       dip_pct_max -2.5/-3.5/-4.0 / dip_pct_min -5.0 / turnover_max 10/13/14 / price_min 2.0 / amount_min 0.5
#       —— 全部劣于现值(其中 close_pos 0.40 是孤峰: 0.36=4895/0.40=5755/0.45=3965 且回撤崩到 -31%)。
#   关于基线数字: 第一百一十七轮记录的 4949.51%/378 笔在当前代码上复现为 4986.84%/377 笔。
#     两种"传不传 names"的写法实测逐位相同, 差异来自 117 轮末尾 name_filter 改动前的中间态残留,
#     属记账噪声(37pp << 500pp 判噪阈值), 本轮以 4986.84% 为 PIT 基线重新对齐全部文档。
#
# 【第一百一十七轮: PIT 全面自查 —— 修掉三处隐性前视, 基线腰斩(参数零变更)】
#   起因(用户问"策略没有未来函数吧"): 时序十年没变(T日收盘选股 -> T+1开盘买 -> T+2收盘卖),
#     但"时序对"不等于"信息集对"。逐字段复核"这条数值在 T 日收盘那一刻算得出来吗", 查出三处:
#   ① low_tail / amp_pct 分母用 prev_close_adj(相对"面板末日"factor 的前复权价), 分子是未复权价。
#      prev_close_adj = pre_close × factor/flast, 等于结果除以一个"未来除权系数" k:
#      越早的日期 k 越小 -> 下影线被系统性放大。回测(窗口末日基准)与实盘(当日基准)算出的值不等。
#      修复: 分母改 pre_close(交易所除权调整后的昨收, 经 21.7 万票日核验与 pct 一致率 99.8%)。
#   ② dist_low20 用未复权 low 的 20 日滚动最低: 窗口内除权时 min 取到除权前高价, 除权后现价被算成
#      负值, 被 dip_dist_low20_min=6.0 误杀。修复: 改用复权 low(同票同 k 约掉, 免疫 flast)。
#   ③ run_backtest 把 client.stock_names()(今天的名称)传给选股做 "ST"/"退" 过滤 -> 提前知道谁会 ST。
#      实测: 当前 198 只 ST 中平均 148 只在 1500 日窗口某历史日仍是正常票, 约占当时全市场 3.3%。
#      修复: 名称只作展示, 新增 name_filter=False; 当日 ST 状态唯一依据 is_st(逐日快照真实值)。
#      实盘 daily_run 仍启用名称兜底(当天名称=当天事实, 不前视), 回测与实盘的唯一差异仅此。
#   发现方法(前视探针): 截断面板到 D 日重算指标+选股, 与全量面板在 D 日比对。修复前 2/3 探针日
#     评分有 0.001~0.012 差异(low_tail 最多差 8.44pp); 修复后 3/3 逐位相同(True)。新增 lookahead_probe.py。
#   基线(同一套规则, 只改数据口径): 1500 日 9973.55 -> 4949.51% / -14.69 -> -21.51% / 卡玛 7.97 -> 4.34 / 378 笔;
#     全史 175170.01 -> 89855.72% / -25.94 -> -28.85% / 2.87 -> 2.29 / 893 笔。收益腰斩是"还回不属于它的收益"。
#   归因(1500 日): ③名称过滤 -4021pp(最大头) / ①low_tail ~-800pp / ②dist_low20 -203pp(噪声内)。
#   修复后重校: low_tail 权重 0.00/0.01/0.02/0.03/0.05/0.08 = 5823/5308/5004/4950/3613/3262(1500 日单调至 0),
#     但全史反向: 0.00=86934 vs 0.03=89856(-2922pp, 卡玛 2.28 vs 2.29) -> 两窗口反向不采信, 维持 0.03。
#     dip_dist_low20_min 5/6/8/10 = 3209/4950/3746/2497, 6.0 仍两侧都降的真峰 -> 维持。
#   数据层无生存偏差: 面板是逐交易日落盘的当日全市场快照, 股票数 2330(2012)->5577(2026)、
#     ST 数 151(2012)->68(2016)->251(2026) 随时间起伏, 退市票保留在历史快照里。
#   非前视但已知的执行偏差(不影响信号): 收盘价成交假设 / 一字板"买不到就跳过"事后判定 / 退市按末收盘。
#
# 【第一百一十六轮: 修复 equity 漏计 pending_cash 的计价 bug(参数零变更, 仅引擎纠错)】
#   bug: do_sell 卖出后持仓从 holding 整体移除, 按规则 99.5% 成交款进 pending_cash(次日可用);
#     随后 do_buy 的 equity = cash + 持仓市值 漏掉了 pending_cash, 被缩成"当天回笼的那点钱",
#     而 min_fill_frac=0.3 的判定基准(目标仓位×equity)同步缩水 —— 于是"目标满仓、实际 0.5% 仓位"
#     的注水成交可以通过。sf=0 时 cash=0 被 cash<=0 提前拦住, 基线不可见; sf 微正即显形。
#   修复: equity = cash + pending_cash + 持仓市值(与收盘估值口径一致)。sf=0 路径不变。
#   基线校正(同一套规则, 只是算术对了): 1500 日 10047.62→9973.55%/卡玛 7.99→7.97/379 笔不变;
#     全史 179346.05→175170.01%/卡玛 2.89→2.87/906→899 笔。差在"单吊全仓 500pp"噪声阈值内。
#   推翻第115轮"效应分解②"(资金约束降频提质): 修复后 sf=0.02 全史 903 笔(非 1075), 与 sf=0 的
#     899 只差 4 笔; 1500 日 379 vs 379(0 笔)。真实笔数代价 19 笔(1500)/45 笔(全史), 不是 76/169。
#     机制只剩一条: T+2 收盘价系统性高于开盘价(纯价格效应)。sf=0 的决策不变, 理由要改写。
#   笔数结构: 379 笔/1500 天 = 3.96 天 1 笔; 每笔占用 2 个交易日 -> 资金利用率 50.5%, 上限约 750 笔;
#     缺口在"有信号的日子"(275 天被评分门拦/355 天被风控拦), 不在资金。
#     加笔数只有两条路且都已定价: sf=0.10 多 19 笔/-1340pp; alloc_frac_pct 90% 多 19 笔/-3510pp。
#   同轮复扫全部维持原值: vol_max 2.4(双窗口改善但只多 1 笔, 单点不采信; 3.2 回落到 162470)、
#     blocked_frac 0.45/0.50/0.55(全史卡玛 2.74/2.62/2.52 单调降, 回撤 -27.4/-28.8/-30.2)、
#     block_gap_below -2.0/-2.2/-2.8/-3.0(8973/8967/9274/8808 全差)、pool 中间档 0.4(卡玛 8.23 但 -311pp)、
#     market_ma 15/18/22/25(6743/6969/8339/6636 全差)、breadth_min 0.20~0.30 与 gate 0.90/1.10(逐位相同, 惰性)。
#   网页 site/index.html 自第104轮起未同步(仍写 40/60 分批、+2775.02%、640 笔、MA30、刀口缩三成、
#     1.0~1.2 半仓), 本轮一并补到当前口径 —— 用户问"网页都是最新数据吗"的直接原因。
#
# 【第一百一十五轮: sell_open_frac 0.10 → 0.00(取消开盘腿, 全部尾盘卖)】
#   1500 日 8345.80%→10047.62%/卡玛 7.78→7.99/笔数 455→379/单笔 1.204%→1.544%/胜率 56.26%→57.52%;
#   全史 127423.27%→179346.05%/卡玛 2.85→2.89/笔数 1075→906/单笔 0.863%→1.059%; 回撤 1500日 +0.46pp、全史 +1.22pp。
#   分年(全史 15 段) 12 改善 3 变差, 样本外 2012~2019 八年全部改善; 改善集中 2021 +33.5 / 2022 +26.8 / 2015 +10.9。
#   机制: sf 0.10→0.02(笔数不变)已是 +40000pp, 是纯价格效应(T+2 开盘价系统性低于收盘价);
#   0.02→0.00 的额外部分来自资金约束 —— T+2 开盘不再有 10% 回笼现金, "仓位已被降到三成档"的
#   低质量票(池浅/高开)无法通过 30% 最小成交门槛而被跳过, 与第一百一十四轮"零期望票占名额"同源。
#   ※ 此段结论已被第一百一十六轮推翻(实为 equity 漏计 pending_cash 造成的注水成交), 保留原文仅为留痕。
#   同轮证伪: 风控解除后渐进建仓(reentry_ramp_days 3/5/8 × start 0.3/0.5 = 4302/3970/…, 全部腰斩 ——
#     反弹初期是 edge 最强期而非不确定期)、跨日分批出场(defer_frac 0.3/0.5 × 1/2 日 = 4821/3336/3508)、
#     个股超额涨跌因子(res_pct 0.05/0.10 = 6246/3494)、刀口阈值 -3.0/-5.0(7806/6639)、池深中间档 0.4/0.6(9731/10355)。
#
# 【第一百一十四轮: knife_tiers.mult 0.30 → 0.00(刀口组由"缩到三成仓"改为"不参与")】
#   1500 日 7469.28%→8345.80%/卡玛 7.61→7.78/笔数 633→455/单笔 0.770%→1.204%;
#   全史 111449.83%→127423.27%/卡玛 2.78→2.85, 回撤 -24.72% 逐位不变, 笔数 1332→1075。
#   起因: 用户问"成交数为何一直不变" —— 拆解后发现笔数由三道闸门(风控355天/评分门275天/承接线237天)
#   决定, 最近几轮改的都是仓位乘数, 本就不该改变笔数; 真正该动的是"零期望票占住单吊唯一名额"。
#   同轮证伪: 评分门 0.95/0.90/0.85(655/686/710 笔, 单笔 0.754/0.648/0.653%)、池深缩放门槛(808 笔/0.521%)、
#     深低开日放宽评分门(新增 gate_relax_*, 4 组 6644~6898%)、min_fill_frac 0.0~0.6(六组逐位相同, 惰性参数)。
#
# 【第一百一十三轮: gap_floor_tiers.min_pool 11 → 5(深低开加仓的池深门槛放宽)】
#   1500 日 6391.98%→7469.28%/卡玛 7.36→7.61; 全史 96866.68%→111449.83%/卡玛 2.71→2.78,
#   回撤 -24.72% 逐位不变, 笔数/胜率/单笔全不动(只改仓位不改选票)。详见 gap_floor_tiers 段注释。
#   同轮新增三个可选能力(默认关闭, 全部证伪未启用):
#     ① selection.dip_dist_low20_max —— 距20日低点涨幅上限(下限 6.0 已有); 12/15/18/20/25/30 全变差,
#        单调劣化(30 仍低 863pp), "底部涨幅"只有下限有意义, 上端无需设限;
#     ② regime.soft_trend_frac —— 分档参与(指数<MA20 但宽度尚可时降档买普通票); 0.2~0.7 全变差,
#        笔数 633→841、单笔 0.770%→0.300% —— 风控日的普通回调票是负期望, block_gap_below 是
#        "质量门槛"不是"仓位门槛", 放宽只会稀释;
#     ③ selection.dip_weights.neg_turnover_cool —— 换手降温因子(3日均换手/20日均换手); 权重 0.05~0.15
#        全变差(收益 -574~-1722pp), 无稳定信息;
#   另证伪: neg_close_pos/neg_dist_ma5/neg_dist_low20 软评分(全史呈孤立尖峰, 如 cpos 0.03/0.04/0.05/0.06
#     = 102136/94068/109288/82142)、分散持仓 2~3 只(2x50=1229% vs 单吊 6392%, 评分第2名起质量断崖)。
#
# 【参数状态: 第一百一十二轮全域复扫 + 一百一十三/十四/十五轮三处放宽 + 一百一十六轮引擎纠错
#   + 一百一十七轮 PIT 纠正 + 一百一十八轮 PIT 口径下全域复扫 —— 现已无已知可改进项】
#   第一百一十八轮: 两处变更, 均由"口径漂移"驱动 ——
#     bias20_max 8→11(旧峰是前视排序的产物, 新口径下 9~12 是连续平台);
#     dip_vol_ratio_max 3.5→4.0(bias 放宽后相邻边界随之右移, 4.0~4.5 是平台)。
#     两项都是**放宽质量约束**: 候选池变深, 单吊 top1 质量上升, 笔数几乎不变(377/893)。
#     全史回撤在两项改动上都**逐位不变**(-28.85%), 说明新增票未进入历史最危险的持仓路径。
#     这一轮的教训: PIT 修复不只是"改数字", 它改变了排序, 于是所有边界都要重扫一遍。
#   第一百一十七轮: 参数零变更。但"历史最优值"的可信度要重新标注 —— 第 109~116 轮的所有扫描都在
#     含前视的旧口径下做的(名称过滤 + low_tail 混用复权), 其中依赖 low_tail 的档位结论需按新口径重读;
#     本轮已重扫 low_tail 权重(1500 日单调至 0、全史反向 -> 维持 0.03)与 dip_dist_low20_min(6.0 仍是峰值)。
#   第一百一十六轮: 参数零变更。修复 equity 漏计 pending_cash 后, 3000+ 组历史扫描里的"笔数"结论需重读 ——
#     凡是"sf>0 能多出 N 笔"的, N 都含注水成分; 参数本身的最优值未变(sf=0 仍双窗口最优)。
#   第一百一十五轮新增结论: 卖出端"开盘腿"归零后, 执行链已无"时点选择"类可调项 ——
#     买在 9:25 开盘(日内最低)、卖在 14:55 收盘(日内最高), 两端都顶到当日边界; 再想往前只能改选股/择时。
#   同轮反证: 反弹初期(风控刚解除)不是"不确定期"而是 edge 最强期(降仓即腰斩); 隔夜无溢价(延后一天即崩)。
#   执行层消融(gap_above/pool_n/gap_floor/knife+mkt_floor/blocked/fallbacks/买入分批/多持一天)
#     -> 全部为正贡献, 无一条在 sf=0.10 新口径下翻负;
#   主力池(dip_pct_max/dip_close_pos/评分权重 5 维/skip_open_gain)
#     -> 当前值即峰值, 其中 dip_pct_max -3.0 与 neg_vol_ratio 0.02 是"尖峰"(两侧断崖/震荡);
#   universe(price_max/turnover_min/turnover_max) -> 当前值即峰值(12.0 是唯一收益与回撤同时可接受点);
#   regime(market_ma/blocked_frac/block_gap_below/sf 补测) -> 当前值即峰值;
#     其中 blocked_frac 0.50 在 1500 日 +443pp/卡玛7.43, 但全史卡玛 2.71→2.45、回撤 -24.72→-27.63(证伪)。
#   两条警戒线(详见 CHANGELOG 第一百一十二轮):
#     ① 单吊全仓是路径敏感系统, 评分权重动 0.01 就能让复利在 ±500pp 间跳动 —— 小于此量级的"改善"不采信;
#     ② 1500 日窗口不含 2015/2018 级熊市, 凡"风险敞口"类参数都会被短窗高估, 必须全史裁决。
# =====================================================================

data:
  # zzshare 数据源(免费公开)。匿名可用但限速较低；如需提速可在仓库
  # Secrets 中配置 ZZSHARE_TOKEN (官网 https://quant.zizizaizai.com 免费获取)
  token_env: ZZSHARE_TOKEN
  min_interval_sec: 0.45     # 两次请求最小间隔(秒)
  max_retries: 5             # 请求失败重试次数
  panel_dir: data/panel      # 行情持久层(每交易日一个csv.gz, 随仓库版本化, 增量更新)
  cache_dir: data/cache      # 运行时临时缓存(不入库; 旧pkl命中时自动迁移至panel_dir)

universe:
  boards:                    # 允许参与的板块(第八十九轮: 用户约束仅沪深主板, 移除创业板)
    - 主板
  exclude_bj: true           # 排除北交所
  exclude_star: true         # 排除科创板(688)
  price_min: 3.0             # 收盘价下限(元): 压尾部(低价股易连续跌停, 2→3回撤-47.9%→-16.8%)
  price_max: 150.0           # 收盘价上限(元): 第九十轮 300→150(单只主板口径)。高价股在深低开后的
                             # 反抽弹性更弱, 500日 192.02%→212.61%/67笔/胜率76.12%/回撤不变;
                             # 阈值130~170结果完全相同(平台), >170才劣化。历史多票口径下 150→300 曾改善, 留档。
  amount_min_yi: 0.8         # 当日成交额下限(亿元); 2026-10-21定稿: 2.0→0.8(全窗571→751%, 0.6~0.8为宽平台, 0.8流动性更稳)
  turnover_min: 2.0          # 换手率下限(%)
  turnover_max: 12.0         # 换手率上限(%): 20→15剔除高换手分歧票; 第八十九轮主板单只口径
                             # 由15收紧至12(500日 140.09%→195.27%、胜率72.0→75.76%、笔数50→66)
  listed_min_bars: 150       # 上市满最少交易日(过滤次新股): 第一百零七轮 120→150, 见下
                             # 机制: 排除"上市 120~150 交易日"(约 7 个月)之间的次新过渡期票。这类票刚过
                             #   次新期, 筹码仍处于解禁/换手过渡, "趋势内缩量回调"信号下的次日承接更不稳。
                             #   重叠分析(1500日同窗口): 基线 641 笔 vs lb150 640 笔, 仅 5 笔被排除 +
                             #   4 笔替代新增 + 2 笔相同成交仓位微调; 被排除的 5 笔次新股仓位加权单笔
                             #   -0.24%(整体负期望), 替代新增 4 笔 +0.22% —— 直接效应为"少亏负期望票",
                             #   长期经复利放大(早期排除负期望票 -> 基数更高 -> 后续放大), 是系统性效应。
                             # 双窗口(同面板同引擎): 1500日 3217.93→3326.81%(+108.9pp, 回撤-15.76%不变,
                             #   卡玛 5.08→5.15, 641→640笔); 全史 22057.77→24730.54%(+2672.8pp,
                             #   回撤-22.21%不变, 卡玛 2.23→2.29, 1366→1363笔) —— 两窗口同向, 回撤均零恶化。
                             # 峰宽(1500日): 120=3218/130=3167/140=3174/150=3327/160=3330/170=3250/
                             #   180=3254/200=3128/250=2999 —— 150~160 为双点平台(差仅 3pp, 噪声内),
                             #   两侧平滑下降; 130/140 相对 120 的"下凹"是阈值离散效应(恰好排除一批正贡献票)。
                             #   全史 150=24731/160=24867(差 137pp≈0.55%, 噪声内)/180=23423 —— 150/160
                             #   同为峰值, 取 150 而非 160: 改动更小(120→150)、平台左边界峰值, 160 仅多
                             #   3pp/137pp 边际收益微乎其微, 不值得为噪声级微调承担阈值过拟合风险。
                             # 样本外免疫(全史 15 段分年): 4 改善(2015 +16.9/2021 +10.2/2017 +3.0/
                             #   2018 +2.1pp) + 3 小幅变差(2020 -0.5/2023 -0.9/2024 -1.3pp) + 8 持平;
                             #   2012~2019 这 8 个推导窗口之外的年份全部改善或持平(零恶化)。
                             # 代价: 仅 2020/2023/2024 各少赚 0.5~1.3pp, 幅度可控; 其余年份持平(该日龄
                             #   次新股本就极少进入 top1)。

selection:
  mode: dip                  # 信号模式: dip(趋势内缩量回调+次日深低开承接, 主力) / momentum(隔夜动量, 备用)
  top_n: 500                 # 观察池上限(rank诊断/研究用; 扫描显示500起饱和)——非资金部署口径
  display_top_n: 1           # 每日发布池=1只(第八十九轮用户约束: 网页每日仅给一只沪深主板股票,
                             # 次日人工观察入场); 发布池=回测可执行池=竞价指引, 三端一致。
                             # 单只无顺延: 第1名缺口不达标即空仓。
  exec_top_n: 1              # 回测可执行池深度=1(与display_top_n一致); 无深度门控/无顺延。
                             # 历史固定池深与绩效门控口径(第八十七~八十八轮)留档于README/CHANGELOG。
                             # BT_TOPK环境变量仅诊断用。
  # ---- 多策略分段并行(第七十八轮实现, 默认关闭) ----
  # 机制(已落地到 src/selector.py + src/backtest.py): 主力池出票 -> 引擎按评分顺延,
  # 主力池当日全部未达承接线时, 自动落到备用池(按 pool=fb1/fb2... 依序), 即"主力没票就切另一个策略"。
  # `segment` 控制备用池启用的市场分段: all=全时段 / trend=仅指数>=MA30 / weak=仅指数<MA30。
  # 十年走前验证(备用池=momentum, 承接线-2.35):
  #   trend/n1(仅趋势段, 补位1只): 500日 +432.14%/-6.46%/49笔/卡玛20.54(基准 387.23%/-6.92%/39笔/17.7
  #     —— 全面占优); 但十年 +213.96%/-51.65%/210笔, era前 -0.232%/笔(复-41.00% vs 基准 -32.24%)、
  #     era后 +3.672%/笔(复+432.22%) —— era前劣化且回撤扩大, 未过注册判据(era前不劣化)。
  #   trend/n5: 500日回撤 -6.92%→-20.96%(卡玛17.7→6.1); 十年 +254.45%/-42.70%, era前-30.55%、era后+410.55%。
  #   全时段/n5: 500日 回撤 -56.05%、卡玛崩至低位; 仅弱势段: 十年 +164.95% 全面劣化。
  # 结论: 备用池的真实增量集中在 era后(2024-09之后), era前为负 —— 与第七十四/七十六轮同源, 故默认关闭。
  # 启用方式: 把下面的 fallbacks 列表放开(并在 daily_run 的发布池里同步展示 fb 票, 保持三端一致)。
  # ---- 多策略单槽漏斗(第九十一轮启用, 用户要求: 主力没信号的日子用其他策略补位) ----
  # 机制(src/selector.py + src/backtest.py): fallback_slot=true 时, 主力 dip 当日**有候选**
  # 就只发主力(网页仍1只、无备用票); 只有主力当日完全没有候选(典型是弱市里没有"上升趋势内
  # 缩量回调"的票), 才按下列顺序用备用策略补位。买入端仍是每日最多1只(max_buy_per_day=1)。
  # 与第七十八轮的"主力出票后仍层层顺延"不同: 那种漏斗的补位发生在"主力票竞价缺口不达标"
  # 的日子, 恰是逆向选择最强的日子, 500日补位均值≈0甚至为负、回撤翻倍(见CHANGELOG第九十一轮)。
  # 单槽漏斗的真实增量来自"主力无信号日", 十年六窗口实测每窗口收益均提高、回撤不变或更低:
  #   2015-11~2017-10 -6.2%→+19.7%; 2017-11~2019-10 -2.8%→+64.2%; 2019-11~2021-10 28.4%→53.1%;
  #   2021-11~2023-10 40.3%→42.6%; 2023-11~2025-10 107.9%→145.9%; 2024-10~2026-10 247.7%→306.0%
  #   (单槽漏斗补位笔数 34/48/13/7/21/12, 补位单笔均值 +0.77/+1.14/+1.44/+0.29/+0.84/+1.34%)
  # 组成只保留补位单笔六窗口均为正的族: momentum(隔夜动量, 样本最大)、oversold(深跌阳线反转)、
  # pullback(趋势回踩5日线)。squeeze/spike/limitup/reversal 补位均值为负或方向不稳, 不挂入。
  fallback_slot: true
  fallbacks:
    - mode: momentum        # 隔夜动量: 六窗口补位均值全为正, 样本最大(33~48笔/窗口)
      top_n: 1              # 备用池顺延上限(只买前N名)
      gap_below: 0           # 与主力同口径(第九十二轮): 无需缺口门槛, 开盘价直接成交
      segment: all          # all / trend / weak
    - mode: oversold        # 深跌阳线反转: 六窗口补位均值全为正(样本较小)
      top_n: 1
      gap_below: 0
      segment: all
    - mode: pullback        # 趋势回踩5日线: 补位均值为正但样本小, 排在最后
      top_n: 1
      gap_below: 0
      segment: all
  # 历史"层层顺延"口径(第七十八~七十九轮, 默认关闭)留档于 README/CHANGELOG:
  # fallbacks 列表放开 + fallback_slot: false 即恢复"主力出票后仍用备用池顺延"。
  # ---- 通用 ----
  bias20_max: 11.0           # 20日乖离率上限(%): 第一百一十八轮 8→11
                             # 旧结论"8最优(7过严崩/9~12衰减, 15时-41.86%)"是在含前视的排序下测的:
                             #   ① low_tail 分母混用未来复权因子, 早期日期的下影线被系统性放大;
                             #   ② 回测用"今天的 ST 名单"过滤历史。两者共同扭曲了"强势票"的排序,
                             #   于是 12 在旧口径下显示"回撤 -21.5% 崩", 新口径下回撤反而改善(-19.22%)。
                             # 新口径峰宽(1500日): 6=3488/8=4987/9=6514/10=6154/11=6781/12=7001/14=4962
                             #   —— 9~12 是连续 4 点平台(卡玛 5.11/5.40/5.58/5.45), 8 明显在平台外下方;
                             #   14 才回落到 4962。取 11: 离断崖 3 格, 且分年 9 改善/6 变差优于 12 的 8/7。
                             # 全史: 8=89856/9=122655/11=197556/12=200340/14=81932, 最大回撤 9~12 逐位不变
                             #   (-28.85%) —— 新增的强势回调票没有进入历史最危险的那段持仓路径。
                             # 分年(11, 15 段): 2020~2025 连续 6 年全部改善(样本外), 2016/2022 两个熊年也改善;
                             #   最差 2018 -13.6pp、2013 -12.9pp。机制: dip 模式原本只接纳"离均线 8% 内的
                             #   温和回调", 把 20 日涨 15~25% 的强势股整体挡在门外; 放宽后这批票今日跌 3~6%
                             #   属于"强趋势中的一次洗盘", 次日深低开承接的赔率高于弱势股。它是**放宽**而非收紧,
                             #   池子变深、单吊的 top1 质量上升, 不是靠减少交易换收益。
  # ---- dip 模式(趋势内缩量回调, 次日深低开承接) ----
  dip_pct_min: -6.0          # 回调日涨幅下限(%): 2026-10-22定稿 -5.7→-6.0(配合dlow5新条件后
                             # 更深的回调票有了距低点保护, 全窗2624→2891%/卡玛30.33→32.14; -5.4则崩至1637%)
  dip_pct_max: -3.0          # 回调日涨幅上限(%): 阴线足够深(-2.5/-3.5均衰减)
  dip_vol_ratio_max: 4.0     # 回调日量比上限: 第一百一十八轮 3.5→4.0(PIT 干净口径 + bias 11 下重扫)
                             # 历史: 第一百零六轮 3.0→3.5(温和放量回调入池)。旧注释的两条结论
                             #   "3.5 是平台中心""4.0 以上开始引入全史不稳定的票"都是在 bias20_max=8
                             #   且排序含前视时测得的, 口径已变。
                             # 新口径(bias=11)峰宽(1500日): 3.5=6781/3.6=6781(逐位同)/3.8=6864/4.0=7348/
                             #   4.2=7348(逐位同)/4.5=7322/5.0=7026 —— 4.0~4.5 三点稳定(最大差 26pp)是平台,
                             #   5.0 才回落。
                             # 全史(bias=11): 3.5=197556/4.0=219896/4.5=219065, 回撤 -28.85% 逐位不变,
                             #   卡玛 2.64→2.69。
                             # 增量来源如实说明: 1500 日 +567pp 主要来自 2022 年(分年 +24pp), 其余年份几乎不变;
                             #   全史 +22340pp 里约一半由 2022 贡献 —— 它吃的是"熊市里的放量回调承接",
                             #   样本相对薄, 这是本轮两个改动中置信度较低的一个。
                             # 机制: bias 放宽后入池的强势股, 回调日量比常落在 3.5~4.0(获利盘与新资金换手),
                             #   原上限把这一档整体排除; 5.0 以上(恐慌抛售)仍被挡住。
                             # 原注释保留(第一百零六轮留档): 3.2=2958/3.3=3189/3.4=3210/3.5=3218/3.6=3211/
                             #   3.7=3089/3.8=3089/4.0=3128/4.5=3134/6.0=3137/8.0=2954(旧口径)
  dip_mom20_min: 5.0         # 20日涨幅下限(%): 有前期趋势
  dip_mom20_max: 25.0        # 20日涨幅上限(%): 非高位加速
  dip_dist_low20_min: 6.0    # 距20日最低价涨幅下限(%): 2026-10-22新增(排除已深跌票——跌太深的票
                             # 反抽是"死猫跳"而非趋势内回调承接; 10%过严-676pp)。第九十轮 5→6:
                             # 单只口径 217.48%/66笔/胜率77.27%; 与price_max150合用 239.86%/67笔/77.61%;
                             # 5.5/6.0/6.5 = 212.6/239.9/219.7, 6.0为局部峰值, 跨6窗口收益全优于5.0。
  dip_close_pos_max: 0.32    # T日收盘位置上限: 阴线收在当日区间下沿32%以内才买(尾盘仍在高位出货的票次日反抽弱)
                             # 2026-10-22定稿: 0.34→0.32(全窗2147→2518%/胜率57.5→60.5%/夏普2.69→2.76/盈亏比4.16→4.71,
                             # 回撤-14.14→-15.13%; 0.325=2327/0.33=2035; 注意0.315=1738左侧有悬崖, 属平台边缘,
                             # 半窗口双段占优: 前半192→224%/卡玛17.7→32.0, 后半712→744%持平)
  dip_weights:               # 观察池评分权重(单只主板口径下排序即唯一计划; mom过强=深低开接飞刀)
    mom20: 0.20              # 前期趋势强度(第八十九轮 0.30→0.20, 把权重让给乖离安全垫)
    neg_bias20: 0.70         # 乖离越低越安全(第八十九轮 0.60→0.70: 单只口径胜率/复利双升)
    neg_amount: 0.05         # 体量因子(2026-10-22二次定稿: 0.07→0.05, 匀0.02给量比因子)
    neg_vol_ratio: 0.02      # 量比因子(2026-10-22新增): 缩量越极致=抛压越枯竭, 次日承接越轻;
                             # 全窗2624→2891%/卡玛30.33→32.14/胜率持平60.5%; 0.03时2549%过重
    low_tail: 0.03           # 下影线因子(2026-10-22新增): T日下影线越长=盘中恐慌承接越充分,
                             # 次日深低开后反抽确定性更高; 全窗收益1798→1903%/回撤-15.13→-14.14%/
                             # 卡玛22.53→24.96/夏普2.81→2.86/盈亏比4.71→4.96;
                             # 半窗口: 前半段买入决策零扰动, 后半段511.8→545.8%全面占优
                             # ※第一百一十七轮: 上述结论是在"分母误用未来复权因子"的旧口径下测的, 作废。
                             #   修复后重扫 0.00/0.01/0.02/0.03/0.05/0.08 = 5823/5308/5004/4950/3613/3262
                             #   (1500 日单调递减, 0.00 最好), 但全史 0.00=86934 vs 0.03=89856 ->
                             #   两窗口方向相反, 按判据不采信, 暂维持 0.03。它是弱因子, 别当核心 alpha。
  # ---- momentum 模式参数(备用) ----
  pct_min: 1.0               # T日涨幅下限(%)
  pct_max: 7.0               # T日涨幅上限(%)
  vol_ratio_min: 1.2         # 量比下限
  vol_ratio_max: 5.0         # 量比上限
  ma5_slope_up: true         # MA5向上
  weights:                   # momentum 评分权重
    vol_ratio: 0.35
    mom3: 0.25
    mom20: 0.20
    amount: 0.10
    neg_bias20: 0.10
  # ---- 第七十九轮新增信号族(仅作备用池候选, 参数默认值在 src/selector.py, 此处不配置即用默认) ----
  # 六个 mode 均为独立信号族, 只能在 selection.fallbacks 里以 mode 名挂载, 不影响主力 dip。
  # 十年走前验证结论: 八族全部未过注册判据(era 前每笔为负并放大回撤), 故 fallbacks 保持 []。
  # 键名前缀: rev_=reversal / sq_=squeeze / pb_=pullback / lu_=limitup / sp_=spike / os_=oversold。
  # 下方列出的是"代码内默认值", 需要调参时再放开同名键即可覆盖。
  # reversal 超跌反转(-9.5~-4.0% 放量收高 + 20日未过热):
  #   rev_pct_min: -9.5 / rev_pct_max: -4.0 / rev_vol_ratio_min: 1.2
  #   rev_close_pos_min: 0.60 / rev_low_tail_min: 0.8
  #   rev_mom20_max: 5.0 / rev_dist_low20_max: 15.0
  # squeeze 低波缩量横盘(小阳 + 振幅≤4 + 均线多头 + 低波分位):
  #   sq_pct_min: 0.5 / sq_pct_max: 5.0 / sq_vol_ratio_min: 1.0
  #   sq_vol_ratio_max: 2.5 / sq_amp_max: 4.0 / sq_bias_max: 5.0
  #   sq_mom20_min: 0.0 / sq_mom20_max: 15.0 / sq_ivol_q: 0.35
  # pullback 趋势回踩5日线(趋势中缩量回踩, 不破MA20):
  #   pb_pct_min: -3.0 / pb_pct_max: 1.0 / pb_mom20_min: 12.0
  #   pb_mom20_max: 45.0 / pb_dist_ma5_min: -3.0 / pb_dist_ma5_max: 2.0
  #   pb_vol_ratio_max: 1.3 (乖离上限复用通用 bias20_max)
  # limitup 涨停深低开承接(涨停非一字 + 次日深低开):
  #   lu_pct_min: 4.5 / lu_mom20_max: 40.0 / lu_bias20_max: 12.0
  # spike 放量突破承接(放量中阳 + 收在高位):
  #   sp_pct_min: 3.0 / sp_pct_max: 7.0 / sp_vol_ratio_min: 1.5
  #   sp_vol_ratio_max: 3.5 / sp_close_pos_min: 0.65
  #   sp_mom20_min: 0.0 / sp_mom20_max: 30.0 (乖离上限复用通用 bias20_max)
  # oversold 深跌阳线反转(20日深跌后 T 日阳线):
  #   os_pct_min: 1.0 / os_pct_max: 6.0 / os_mom20_max: -10.0
  #   os_dist_low20_max: 10.0 / os_close_pos_min: 0.60 / os_vol_ratio_min: 1.2

regime:                      # 大盘风控: 触发则次日空仓(压回撤核心)
  enabled: true
  breadth_min: 0.25          # 全市场站上MA20个股占比 < 25% -> 空仓(ma30下0.25最优)
  market_ma: 20              # 市场等权指数 < 其MA20 -> 空仓(第一百零八轮 30→20, 见下)
                             # 起因(gap-承接线联动): 第九十二轮把 buy_gap_below 从 -2.4 改成 0(开盘价直接
                             #   成交、不挑单), 承接线不再承担"只接深低开"的过滤职能; 但市场风控的 market_ma
                             #   仍是 gap-2.40 时代调出的 30(当时注释已留伏笔"gap放宽时MA宜短")。gap=0 后,
                             #   若市场风控仍用 MA30, 会在"指数刚站上MA20但未站上MA30"的反弹初期继续空仓,
                             #   系统性错过反弹初期的参与窗口; 缩短到 MA20 让风控更灵敏, 反弹初期即恢复参与。
                             # 双窗口(同面板同引擎): 1500日 3326.81→3942.71%(+615.9pp, 回撤 -15.76→-14.31%,
                             #   卡玛 5.15→6.02, 640→629笔); 全史 24730.54→37503.67%(+12773pp, 回撤 -22.21%不变,
                             #   卡玛 2.29→2.51, 1363→1323笔) —— 两窗口同向大幅改善, 回撤零恶化(1500日还改善1.45pp)。
                             # 峰宽(全史 3378 日): 15=33826/18=28161/19=34163/20=37504/21=34667/22=34039/
                             #   24=33956/30=24731 —— 15~24 整个区间全史收益都在 3.3~3.75 万(vs 30 的 2.47 万),
                             #   方向稳健不是单点; 但 15/18 在 1500 日很差(2591/2677), 21/22 全史回撤恶化到
                             #   -23.0%, 故取 20 —— 两窗口一致最高(1500日 3943、全史 37504), 回撤两窗口零恶化,
                             #   卡玛两窗口最高(6.02/2.51)。
                             # 分年(全史 15 段): 10 改善 5 变差, 净 +58.4pp; 改善分散在 2013/2014/2016/2019/
                             #   2020/2021/2022/2025(2013~2026 多个年份), 不是单年现象。样本外(2012~2019 这 8 个
                             #   推导窗口之外的年份)5 改善 3 变差。
                             # 代价: 2015 -15.6 / 2017 -2.8 / 2018 -5.3 / 2023 -9.4 / 2024 -9.5pp 变差 ——
                             #   2015(杠杆牛+股灾)是主要代价: MA20 在剧烈波动中过早恢复参与, 接了假反弹;
                             #   其余变差年份幅度可控(2.8~9.5pp)。整体是"更快抓住反弹初期"与"假反弹里过早
                             #   参与"的权衡, 全史与双窗口均净改善, 取 20。
  warmup_days: 30            # 计算风控指标所需历史天数
  vol_max: 2.2               # 恐慌型波动熔断(2026-10-23定稿 2.0, 第一百一十轮 2.0→2.2, 见下): 高波动(20日std>2.2%)且市场20日
                             # 动量为负(下跌中)时空仓; 暴涨型高波动(924行情初期)不误杀。
                             # 十年3372日信号扫描+走前验证(2.0口径): 被剔除29笔全部位于2015股灾/2016
                             # 熔断/2018/2020-03/2022/2026-03恐慌期, 均值-1.72%/胜率41.4%;
                             # h1基准-0.488%→+0.104%(转正), h2 +0.702%→+1.092%/胜率56.5%, 双段一致
                             #
                             # ---- 第一百一十轮: vol_max 2.0 → 2.2(放松恐慌熔断) ----
                             # 起因(规则消融+联动): 第一百零八轮 market_ma 30→20 后风控更灵敏,
                             #   恐慌熔断(vol_max)在 ma20 下冗余 —— market_ma=20 已在"指数跌破MA20"时
                             #   拦截大部分下跌, vol_max 只在少数"指数仍在MA20上方但20日std很高且动量负"
                             #   的日子触发。vol_max=2.0 仍按 ma30 时代调出, 过于敏感, 把"中等高波动
                             #   (std 2.0~2.2)下跌"日也熔断, 但这些日的"深低开承接"实有正期望(恐慌错杀)。
                             # 本轮先重跑规则消融(新口径 score_tiers 已取消)确认: 其余执行规则均正贡献,
                             #   唯 gap_above_tiers 1500 日 +187pp 但全史 -1136pp 且回撤恶化到 -29.10%(证伪);
                             #   blocked_frac/block_gap_below 提高为"收益换回撤"(卡玛降), 不可动;
                             #   vol_mkt_ret_min 放松 1500 日 +352pp 但全史 -523pp(两窗口相反, 证伪)。
                             # 双窗口(同面板同引擎): 1500 日 4183.95→4349.61%(+165.7pp, 回撤 -14.45%不变,
                             #   卡玛 6.09→6.17, 629→633笔); 全史 39832.87→43003.14%(+3170.3pp, 回撤
                             #   -22.21%不变, 卡玛 2.54→2.58, 1323→1332笔) —— 两窗口同向, 回撤零恶化。
                             # 峰宽(两窗口): 全史 2.0=39833/2.1=41816/2.2=43003/2.3=41091/2.4=42991/
                             #   2.5=42438/3.0=40539; 1500 日 2.0=4184/2.1=4197/2.2=4350/2.3=4350/
                             #   2.4=4386/2.5=4386/3.0=4385 —— 2.1~2.5 宽平台不是尖峰; 2.2 全史最高,
                             #   2.4 两窗口均高(全史仅比 2.2 低 12pp)。取 2.2(放松幅度小、变差年份少、全史最高)。
                             # 分年(全史 15 段): 改善 4 变差 2 持平 9, 回撤零恶化; 改善集中在
                             #   2015(+11.3)/2024(+6.4) 两个高波动年份(其余年份持平, 符合 vol_max 仅在
                             #   恐慌期触发的机制), 另有 2016(+1.4)/2026(+0.5); 变差仅 2018(-0.8)/
                             #   2020(-0.3) 小幅。机制清晰不是单点运气: 放松的是"中等高波动下跌"日的
                             #   错杀承接 edge, market_ma=20 仍兜底下跌, 故回撤零恶化。
  vol_mkt_ret_min: 0.0       # 恐慌判定中的20日动量阈值(=): 指数20日收益低于此值视为"下跌中"
  max_block_days: 0          # 0=不设上限(第九十五轮): 风控期间一直空仓, 直到宽度/指数重新达标才恢复。
                             # 原 5 日强制复参与是"近两年牛市"里调出来的: 上一窗口(2022-01~2024-10)
                             #   强制回到下跌市 → 每笔期望 -0.38%, 456 笔复利 -86.7%;
                             # 14 年全史(2012-11~2026-10, 3378 日) 强制复参与 -95.8%/回撤 -99.6%,
                             #   改为不设上限后 -51.5%/回撤 -92.0%, 两段与全史同向 —— 不再"跌着也要参与"。
                             # 代价: 空仓天数 736→1461(占 43%), 牛市里会错过部分反弹(近500日 +441%→+285%);
                             #   但配评分门槛后近500日 +232%/回撤 -23.6%, 全史 +890% —— 空仓期不亏就是收益。
  rf_ramp: true              # 渐近恢复(2026-10-22定稿): 超限后每多1日风控, 参与系数+0.05直至100%
                             # 走前验证通过: h1选参(卡玛33.14 vs 32.73)→h2样本外844.12% vs 803.85%(+40pp)
                             # 全窗2891→3052%/卡玛32.14→33.19/回撤持平-14.14%; 缺口分级下注证伪(卡玛降)
  block_reenter_frac: 0.95   # 超限后的参与仓位系数(2026-10-22三次定稿: 0.75→0.95,
                             # 配合dlow5新条件: 全窗1903→2624%/卡玛24.96→30.33/回撤持平-14.14%;
                             # 0.90=2487%/29.37, 1.00=2767%但回撤-14.34%开始恶化, 取0.95;
                             # 半窗口双段占优: 前半227→250%/卡玛32.4→34.9, 后半546→722%/卡玛39.3→52.0)
                             # (2026-10-25第五十二/五十五轮语义澄清: rf_ramp=true时本参数实际不生效
                             #  —— 渐进公式在首个超限日即min(1,0.95+0.05)=1.0封顶, 超限参与日
                             #  实为"全额参与+严承接线-2.75"; 仅rf_ramp=false时本参数才有意义)

execution:                   # 实盘执行口径(回测与实盘一致)
  buy_gap_below: 0           # 0=不设缺口门槛(第九十二轮): 每日计划票在 T+1 开盘价直接成交。
                             # 依据用户实际执行: 收盘后收到计划, 次日开盘即买, 不按缺口挑单;
                             # 回测/回放/实盘三端同口径, 回放才等于真实账户路径。
                             # 500日实测代价: 笔数 99→390, 区间收益 470.79%→454.84%(-15.95pp),
                             #   最大回撤 -15.56%→-31.34%, 卡玛 30.25→14.51
                             #   —— 选股正期望仍在(单笔均值 +1.87%→+0.48%), 但风险敞口翻倍。
                             # 历史"深低开挑单"口径(-0.8最优, 收益-胜率-笔数综合最优)留档于
                             # CHANGELOG 第八十九~九十一轮; 恢复方法 = 把本值改回 -0.8 并同步 fallbacks。
  block_gap_below: -2.50     # 第一百零二轮: 风控日的"专属承接线"终于有了实际作用 —— 风控期只接
                             # 竞价缺口 <= -2.5% 的恐慌深跌票, 其余日照常空仓(配合 blocked_frac)。
                             # 第九十二~一百零一轮之间本值为 0(风控日全空仓, 该线没有生效场景)。
  blocked_frac: 0.40         # 风控日参与系数(第一百零二轮启用): 0=严格空仓(旧口径), 0.4=四成仓接恐慌深跌。
                             # 口径: 信号日处于大盘风控(trade_ok=False) 且 T+1 竞价缺口 <= block_gap_below
                             #   → 按 40% 仓位买入首选票; 缺口不够深 → 当日空仓。与"取消风控"无关:
                             #   风控日照样不追平开/高开, 只接"被恐慌砸出来的深坑"。
                             # 依据(同一面板同一引擎):
                             #   风控日全部候选(89 笔虚拟成交) 单笔 +0.79%/胜率 56.2%,
                             #     其中恐慌熔断日 16 笔 +2.83%/胜率 68.8%、宽度<0.15 的 11 笔 +3.33%/胜率 90.9%;
                             #     —— 越极端的恐慌, 深低开承接的期望越高(与第一百零一轮"缺口=错杀直接证据"同源)。
                             #   1500 日: 1645.94%/-15.01%/卡玛4.11/547笔
                             #          → 1978.91%/-17.59%/卡玛3.78/640笔 (+333pp, 笔数 +93)
                             #   全史(3378 日): 7422.15%/-27.77%/卡玛1.37/1123笔
                             #          → 9110.28%/-25.52%/卡玛1.57/1369笔 (+1688pp, 回撤反而 -2.25pp)
                             #   —— 全史(含 2015/2018 长熊)是收益与回撤同时改善, 近六年则是"多赚 333pp、
                             #      回撤 +2.6pp"的纯敞口交换: 风控日的深跌票是"越跌越买"的仓位, 在长熊里
                             #      反而摊低了整体回撤(它买在恐慌尾声), 在近六年的慢牛里只是加了杠杆。
                             # 平台: bf 0.25/0.40/0.60/0.80/1.00 → 1500日 1891/1979/2096/2213/2329%,
                             #   卡玛 3.60/3.78/3.98/3.77/3.54; 但全史在 0.6 处断崖(8812%/-30.49%/1.30),
                             #   故取 0.40 —— 全史口径下 0.4 是平台内最优点, 0.6 以上是尖峰外侧。
                             # 同时修复(重要): max_block_days=0 时账本把每个风控日算成"全额参与日",
                             #   风控期凭空记出成交(与回测/页面矛盾), 见 CHANGELOG 第一百零二轮。
  min_top1_score: 1.0        # 首选质量门槛(第九十六轮 1.5→1.0): 首选票评分(当日候选池内横截面 z 分)
                             # 低于 1.0 才完全不参与; 1.0 以上按 score_tiers 分档给仓位。
                             # 依据(14 年全史 3378 日 + 三个窗口同向):
                             #   无门槛 -51.5%/回撤 -92.0%/1729 笔/单笔 +0.01%
                             #   1.5(第九十五轮) +890.1%/-46.8%/532 笔 —— 单笔好但 6 日才 1 笔
                             #   1.0+分档(本轮) +1085.8%/-43.8%/1119 笔/单笔 +0.28%  ← 采用
                             # 平台验证(gate 0.95~1.1 与三套档位乘数, 共 8 组): 全史 843~1101%、
                             #   笔数 1005~1182、1500 日 465~621% —— 是平台不是单点。
                             # 第一百一十四轮在新口径(sf=0.10/min_pool=5)复测: 0.95/0.90/0.85 =
                             #   7232/6132/6830%(655/686/710 笔, 单笔 0.754/0.648/0.653%) —— 放宽必稀释, 门槛保持 1.0。
                             #   同轮新增可选 gate_relax_gap_below/gate_relax_score(深低开日放宽评分门,
                             #   默认关闭): 4 组 6644~6898% 全部劣于基线, 证伪留档。
  score_tiers:               # 评分分档下注(第九十六轮引入, 第一百轮砍掉中间档, 第一百零五轮半仓→八成仓,
                             # 第一百零九轮取消降仓 0.80→1.00, 见下):
                             # 降序匹配, 低于最低档(min_top1_score)才空仓。乘数作用在 alloc_frac_pct 上。
    - {min: 1.2, mult: 1.00} #   评分 ≥ 1.2: 满仓
    - {min: 1.0, mult: 1.00} #   1.0~1.2: 满仓(第一百零九轮 0.80→1.00, 见下)
                             # 第一百轮砍掉"1.2~1.6 → 70%"这一档, 依据:
                             #   该档 157 笔(占 29%)单笔 -0.13%/胜率 42.5%, 是全表最差的一档;
                             #   但"七成仓"既没保护住亏损(只少亏 30%), 又切掉了右尾(少赚 30%)。
                             #   单吊+复利下右尾比左尾值钱(几何收益对上行更敏感), 半吊子降仓是净损失。
                             # 实测(1500 日): 956.52%→1096.77%、回撤 -15.14→-14.65%、卡玛 3.21→3.53、
                             #   笔数 548 不变; 分年 7 段全部改善(2021 +5.4pp / 2022 +9.9pp / 2026 +3.4pp)。
                             # 全史(3378 日): 3647.9%→4938.4%、1124→1124 笔, 代价是回撤 -25.5→-29.4%
                             #   (2016-06~2019-03 长熊, 评分分档在那段承担了"自动减仓"作用), 卡玛 1.22→1.16。
                             # 平台: 分界 1.1/1.15/1.2/1.25/1.3 → 1088~1148%; 1.0 档乘数 0.4/0.5/0.6
                             #   → 1069~1125% —— 平滑平台, 不是单点最优。
                             # 反例留档: 取消全部分档(1.0 以上全满仓)1500 日 1242.69%/卡玛 3.60 更高,
                             #   但 2026 分年 -1.7pp、全史回撤 -29.62%、卡玛 1.15, 且丢掉熊市减仓保险, 不取。
                             #
                             # ---- 第一百零五轮: 1.0~1.2 档 0.50 → 0.80(半仓→八成仓) ----
                             # 起因(规则消融): 逐项关掉各执行规则后, 只有 score_tiers 是负贡献 ——
                             #   关掉它 1500 日 2775→3251%(+476pp)、卡玛 4.82→5.10、回撤仅 +0.05pp。
                             # 机制: 评分 1.0~1.2 的 155 笔整体是正期望(单笔 +0.69%/胜率 53.5%),
                             #   其中被 gap_floor 补回满仓的深低开票(13 笔) +1.78%、低仓的 121 笔 +0.56% ——
                             #   第一百轮的"半仓减仓保险"在 101~104 轮加入 gap_floor_tiers / mkt_floor_tiers /
                             #   blocked_frac 之后已经冗余: 这些规则承担了"风险分层", score_tiers 的半仓
                             #   只剩"过度减仓", 压制了正期望票的收益。
                             # 平台(1500 日, 1.0 档乘数 0.5/0.6/0.7/0.8/0.9/1.0):
                             #   2775/2865/2958/3053/3151/3251%(收益单调升, 回撤 -15.73→-15.78 几乎不动,
                             #   卡玛 4.82→5.10 单调升) —— 1500 日口径下满仓(1.0)最好。
                             # 平台(全史 3378 日, 同组乘数):
                             #   0.5=18662/2.15 → 0.6=19202/2.17 → 0.7=19741/2.18 → 0.8=20278/2.19 →
                             #   0.9=20812/**-22.79**/2.15 → 1.0=21343/**-23.87**/2.06
                             #   —— 全史回撤在 0.8 之前完全锁在 -22.21%, 0.9 起开始恶化(1.0 恶化 +1.66pp)。
                             #   0.8 是"收益改善最大、回撤零恶化"的拐点: 全史 +1616pp(18662→20278)、
                             #   回撤 -22.21% 不变、卡玛 2.15→2.19。
                             # 取 0.80 而非满仓(1.0)或 0.9: 第一百轮拒绝"取消分档"的核心理由是
                             #   全史回撤 -29.62%、卡玛 1.15 —— 满仓口径全史回撤确实扩大, 0.9 起回撤
                             #   也松动; 0.8 既释放了正期望票的收益, 又保留"熊市轻减仓"的保险。
                             # 代价如实说明: 1500 日仓位加权分年 7 段里 4 改善 3 小幅变差 ——
                             #   2021 +9.0 / 2022 +8.0 / 2023 +4.1 / 2025 +1.0pp;
                             #   2020 -0.5 / 2024 -0.9 / 2026 -2.7pp(连续两年小变差, 幅度可控)。
                             #
                             # ---- 第一百零九轮: 1.0~1.2 档 0.80 → 1.00(取消降仓) ----
                             # 起因(规则消融): market_ma=20(第一百零八轮)后风控更灵敏, 重新逐项关掉各执行
                             #   规则, 发现 score_tiers 从正贡献翻转为负贡献 —— 关掉它 1500 日 3942.71→
                             #   4183.95%(+241pp)、全史 37503.67→39832.87%(+2329pp), 且**全史回撤 -22.21%
                             #   完全不变**(卡玛 2.51→2.54)。同轮消融其余规则均为正贡献(关掉皆大幅变差,
                             #   必须保留): knife/mkt_floor -819pp、blocked_frac -2197pp、pool_n_tiers -547pp、
                             #   gap_floor -1662pp、sell_open_frac 分批 -1671pp; gap_above_tiers 关掉 1500 日
                             #   +184pp 但全史 -667pp 且回撤恶化到 -25.01%, 两窗口方向相反, 证伪。
                             # 机制: market_ma=20 后, 策略在"反弹初期"更快恢复参与, 这些反弹初期票的
                             #   横截面 z 分尚未拉开、多落在 1.0~1.2 档; 第一百零五轮(ma30 时代)把这档当
                             #   "低分票"降到八成仓, 但在 ma20 新口径下这档恰是"反弹初期的深低开好票",
                             #   降仓反而压制收益。第一百轮"取消分档→全史回撤 -29.62%"的担心在 ma20 下
                             #   不成立: market_ma=20 的风控已承担熊市避险, score_tiers 的减仓在 ma20 下冗余。
                             # 峰宽(1500 日, 1.0 档乘数 0.8/0.85/0.9/0.95/1.0):
                             #   3943/4002/4062/4123/4184 —— 收益单调升、回撤 -14.31→-14.04→-14.45、
                             #   卡玛 6.02→6.20→6.09, 平滑平台不是尖峰。
                             # 全史口径: 0.9=38669(+1166pp) / 1.0=39833(+2329pp), 1.0 收益多一倍且回撤
                             #   都零恶化, 取 1.0(满仓)。
                             # 分年(全史 15 段): 8 改善 5 变差 2 持平, 净 +22.8pp(分年口径), 回撤零恶化;
                             #   改善分散 2015(+17.6)/2022(+8.1)/2021(+3.4)/2018(+2.2)/2023(+2.0)/
                             #   2020(+0.8)/2024(+0.5)/2025(+0.4); 变差 2013(-3.7)/2014(-2.2)/
                             #   2016(-1.5)/2019(-4.1)/2026(-0.7), 幅度可控、近端 2026 仅 -0.7pp。
                             # 门槛 min_top1_score=1.0 保持不动(取消分档后复扫): 0.8/0.9 放宽→回撤
                             #   -18.42%/-16.53% 恶化、收益反降; 1.1/1.2 收紧→收益 3707/2125 下降。
                             #   门槛拦"评分真低"的票仍是正贡献, 与"取消分档降仓"是两件事。
  # 评分门按池深缩放(第一百轮证伪, 保持关闭): 评分是"池内 z 分", 理论上限 (n-1)/sqrt(n)
  # (n<10 时受此约束, 之后被 clip±3 截断), 同一个 1.0 门槛在 5 只的池里要 56% 的理论最大、
  # 在 40 只的池里只要 33% —— 池浅日被系统性卡死(池深与评分相关 0.53)。
  # 实测放宽后: 1500 日 956.52%→717.31%/回撤 -18.60%/卡玛 2.27/笔数 689; 取消门槛 672.56%/-25.53%。
  # 结论: 多出来的 141 笔是"池浅且质量真差"的票(虚拟均值 -0.29%/笔), 门槛拦得对 —— 池深与评分
  # 高相关不是冗余, 而是两个视角同时指向"今天机会差", 双重收紧是正确代价。
  # score_gate_pool_scale: false
  # score_gate_ref_pool: 40
  skip_open_loss: 0          # 低开保护已关闭(0=不过滤): 回测证实放开深低开后收益更高且回撤更低
  skip_open_gain: 10.0       # T+1开盘涨幅>=10%放弃买入(%): 仅拦开盘一字涨停(物理买不到),
                             # 第九十二轮 9.0→10.0 —— 原 9% 会漏掉"高开但可成交"的票, 与"每日开盘价成交"冲突。
  sell_limit_down_fallback: true   # T+2开盘跌停 -> 保守按当日收盘卖出
  # ---- 第八十~八十七轮执行侧实验开关 ----
  # 限价承接(证伪, 保持关闭): 500日实测笔数39→133~295, 收益387%→63~124%
  # (成交集中在"开盘不跌、盘中继续跳水"的票, 等于接回主力主动规避的下杀)。
  # buy_limit_fill: 1
  # buy_limit_open_max: 0.0
  # 名次梯度承接线(第八十七轮): 扩池时深名次要求更深折价。第八十九轮单只无顺延, 置空。
  gap_rank_tiers: []
  # 绩效门控池深(第八十七~八十八轮, 历史多票口径留档): 近window笔已结算均值>min_avg时
  # 扩到 hot_top_n, 否则收缩到 cold_top_n(仅用已实现成交, 无未来函数)。
  # 500日 387.23%/-6.92%/39笔 → 1634.81%/-9.34%/63笔/卡玛34.54; 十年 1676.81%/165笔。
  # 第八十九轮主板单只口径下池深恒为1, 门控关闭, 不再影响发布/回测。
  depth_gate: {}
  # ---- 高开降仓(第九十七轮): 缺口越大, "深低开承接"的 edge 越弱 ----
  # 口径: T+1 竞价缺口 >= 0.5% 且首选评分 < 1.6(未达满仓档) → 仓位 ×0.3。
  #   **照常成交、不弃单**, 所以交易次数不变(545→545), 只是高开不下重注。
  # 依据(同一面板同一引擎, 1500日 + 全史3378日):
  #   缺口分桶(1500日): ≤-2% 19笔 +2.67%/胜率89%; -2~0% 262笔 +0.65%/57%;
  #                    0~2% 243笔 +0.03%/44%(复利-2%); ≥2% 15笔 +0.06%/33%
  #   —— 缺口>=0 的成交(占48%)合计几何期望≈0, 却长期占用满仓; 低开才是 edge 来源。
  #   交叉表: 缺口0~2% × 评分1.0~1.4 = -0.18%/91笔; × 1.4~1.8 = -0.40%/85笔;
  #           × ≥1.8 = +0.87%/67笔 —— 高开只有在"评分足够高(强势股抢筹)"时才是正期望。
  #   1500日: 596.26%/-26.23%/545笔/卡玛1.47 → 776.02%/-24.45%/545笔/卡玛1.80
  #           (前后半窗 142.4/187.3 → 171.5/222.7, 双段同向)
  #   全史:   1085.79%/-43.77%/1119笔/卡玛0.46 → 1155.48%/-41.80%/1119笔/卡玛0.50
  # 平台: mult 0.2/0.3/0.4/0.5 = 804.6/776.0/748.2/721.1%(单调平滑);
  #       score_below 1.4/1.6 = 702/776。取 1.6 —— 与 score_tiers 满仓线同一语义,
  #       不取 1.8: 虽然单窗口更高(1500日 810.7%、全史 1385.8%), 但 2.0 立刻掉到 1051.7%,
  #       非单调 => 阈值附近的样本效应, 属尖峰不属平台。
  # 与 buy_gap_below 的区别: 那是"缺口不达标就不买"(挑单, 减次数); 这里是"照买但少买"。
  gap_above_tiers:
    - {above: 0.5, score_below: 1.6, mult: 0.30}
  # ---- 深低开加仓下限(第一百零一轮): 深低开是"错杀"的直接证据, 池深是"共振"的间接代理 ----
  # 口径: T+1 竞价缺口 <= -1% 且当日达标票数 >= 11 时, 仓位**不低于满仓**(撤销池深折价),
  #   与池深分档取 max —— 只把"因为池窄被砍掉的那部分"补回来, 不会超过 100%(无杠杆)。
  #   池深 <=10 的极端窄池仍按 0.3 执行: 那一格实测均值 +0.04%(14笔), 深低开救不回来。
  # 依据(548 笔逐笔, 按 T+1 竞价缺口分桶):
  #   缺口 <=-1%  92笔 均值 +1.85% 胜率 75.0%   分年 +0.70/+2.90/+5.78/+1.24/+2.26/+2.21(2020 n=3)
  #   缺口 -1~0% 242笔 均值 +0.50% 胜率 48.4%
  #   缺口 0~0.5% 94笔 均值 +0.37% 胜率 51.1%
  #   缺口 >=0.5% 120笔 均值 -0.15% 胜率 39.5%  ← 第九十七轮已按 0.3 缩仓, 本轮不动
  #   —— 缺口是全部调节变量里唯一"6/7 年同向"的一个; 深低开组内部:
  #      池>=21 +1.76%(38笔, 本来就是满仓) / 池11~20 **+2.73%(28笔, 此前只有半仓)** / 池<=10 +0.04%(14笔)
  # 结果(1500日): 1096.77%/-14.65%/卡玛3.53/548笔 → 1645.94%/-15.01%/卡玛4.11/547笔
  #   分年 7 段全部改善: 2020 -3.2→-1.4 / 2021 82.8→97.5 / 2022 95.9→120.3 / 2023 3.2→5.9 /
  #                      2024 57.5→57.7 / 2025 31.2→43.3 / 2026 62.0→70.0
  #   全史(3378日): 4938.35%/-29.37%/卡玛1.16/夏普1.43/1124笔
  #                → 7422.15%/-27.77%/卡玛1.37/夏普1.52/1123笔 (收益+2484pp 且回撤反而 -1.6pp)
  # 平台: 阈值 -0.8/-1.0/-1.2/-1.5 = 1625/1646/1442/1245%(取 -1.0, 深了才有统计量);
  #       floor 0.5~1.0 = 1148/1235/1329/1428/1534/1646%(单调, 1.0 是天然边界而非调出来的);
  #       min_pool 1/6/11/21 = 1714/1785/1646/1104%(1和6 收益更高但回撤 -16.0%,
  #       且池<=10 那一格实测 +0.04% —— 按机制取 11, 卡玛 4.11 最高)
  # 代价: 单笔风险敞口上升(受影响 28 笔从半仓到满仓), 1500日回撤 -14.65→-15.01(仍在平台内)。
  # 同轮证伪留档: 同期试过"取消高开>0.5%的评分豁免"→ 1466%(比 1646 低 180pp), 不取;
  #   单独执行该条(不加深低开)只有 975%, 说明高开豁免(强势股抢筹)本身是对的。
  #
  # ---- 第一百一十三轮: min_pool 11 → 5(深低开加仓的池深门槛放宽) ----
  # 起因(口径漂移): 第一百零一轮定 11 时, 卖出口径是"开盘卖 50%+收盘卖 50%"、市场风控 ma30;
  #   第一百零八/一十一轮把风控改 ma20、收盘腿加到 90% 之后, 深低开票的日内修复被更充分吃到,
  #   深低开加仓的价值上升, 而 11 这个门槛当年是"防低池深日乱加仓"设的保守值, 已过度保守。
  # 结果(1500日): 6391.98%/-13.80%/卡玛7.36/633笔 → 7469.28%/-14.04%/卡玛7.61/633笔(+1077pp)
  #   全史(3378日): 96866.68%/-24.72%/卡玛2.71 → 111449.83%/-24.72%/卡玛2.78(+14583pp)
  #   —— 两窗口回撤"零恶化"(全史 -24.72% 逐位不变), 卡玛双双上升; 笔数/胜率/单笔全部不变
  #   (只改仓位大小, 不改选票), 属纯资金效率改善。
  # 平台(全史 3378日, min_pool 1/2/3/4/7/9/11): 117812/117812/117812/117812/99895/101810/96867
  #   平台(1500日, min_pool 3/5/7/9/11/14/21): 7469/7469/7178/7021/6392/4744/3651
  #   —— 1~4 饱和(池深<5 的交易日基本没有候选), 5 起平滑单调劣化, 不是尖峰。
  # 分年(全史 15 段): 8 改善 5 变差 2 持平; 改善 2014+6.7 / 2021+3.3 / 2022+2.3 / 2023+14.0 /
  #   2025+2.3 / 2026+4.6 / 2013+1.8 / 2018+0.3; 变差 2015-15.9 / 2016-1.7 / 2017-1.0 /
  #   2019-0.9 / 2024-5.6。**2015 股灾年 -15.9pp 是本轮最大代价**(股灾中低池深日加仓放大亏损),
  #   但当年仍是正收益, 且全窗 +14.6%, 属"高风险年份换全周期效率"的取舍。
  # 取 5 而非 3/4: 3/4 的全史收益更高(117812)但那是依赖"池深 3~4"的极少数交易日, 5 已在饱和
  #   平台内且更保守, 不赌个别交易日。
  gap_floor_tiers:
    - {below: -1.0, min_pool: 5, floor: 1.00}
  # ---- 市场语境(第一百零三轮): 把"深低开/回调"拆成市场成分与个股成分 ----
  # 论点: "错杀"的前提是这一跌不是它自己的事。同样是 T 日跌 5%:
  #   大盘跌 3% 时它只是跟随(beta) —— 次日深低开是全市场恐慌, 修复时有共振;
  #   大盘涨 0.5% 时它独自跌 5% —— 更可能是利空/资金出逃, 次日低开是"真有事"。
  # 逐笔证据(1500日 575 笔主池成交, 按信号日全市场涨跌中位数 mkt_ret 分组, 盘后即知, 无未来函数):
  #   mkt_ret <= -1.5%    57 笔 均值 +1.37% 胜率 60% 中位 +0.64%
  #   -1.5% ~ -0.5%      162 笔 均值 +0.85% 胜率 54%
  #   > -0.5%(平稳/上涨)  356 笔 均值 +0.27% 胜率 48%
  #   —— 市场跌得越狠, 深低开承接的期望越高(与第一百零二轮"风控日恐慌深坑"同源)。
  # 平稳日 356 笔再拆: 个股超额下跌(个股 pct - 市场中位数) <= -4pp 的 221 笔
  #   均值 -0.01%/胜率 46%/中位 -0.32%; 同日超额 > -4pp 的 135 笔 +0.72%/胜率 50%。
  #   分年: 刀口组 7 年里 5 年为负(仅 2022 +0.67%、2026 +0.97%), 不是单年现象。
  # 两条修正互补(阈值故意留出 -1.5~-0.5 的"温和下跌"缓冲区, 不硬切):
  #   ① 刀口保护: 市场平稳/上涨而个股独跌 → **不参与**(第一百一十四轮由"缩到三成仓"改为剔除);
  #   ② 恐慌日回满仓: 全市场跌 ≥1.5% → 撤销评分/池深折价回满仓(仍受风控仓位上限约束)。
  # 第一百零三轮首次落地(当时是"缩到三成仓, 照常成交"):
  #   1500日 1978.91%→2584.41%, 全史 9110.28%→15303.38%(+6193pp, 回撤 -3.35pp)。
  # 第一百一十四轮把 mult 从 0.30 一路扫到 0(严格单调, 两窗口一致):
  #   1500日 0.30/0.20/0.15/0.10/0.05/0.00 = 7469/7772/7920/8066/8208/8346(%);
  #   全史   0.30/0.20/0.15/0.10/0.00      = 111450/116910/119599/122252/127423(%);
  #   0.00 全史回撤 -24.72% 与基线逐位相同, 卡玛 2.78→2.85, 笔数 1332→1075(-257),
  #   胜率 51.50%→53.49%, 单笔 0.655%→0.863%; 1500日 单笔 0.770%→1.204%、回撤仅 +0.19pp。
  #   分年 15 段: 11 改善 / 3 变差 / 1 持平; 变差年份幅度都很小(2013 -1.1、2016 -1.2、2026 -0.5),
  #   改善集中在 2021 +13.9 / 2015 +7.8 / 2023 +4.7 / 2024 +3.9。
  # 为何现在敢用 0 档(第一百零三轮不敢): 当时的反对理由是"该组均值 -0.01% 属零期望, 且 2022/2026 为正,
  #   删单会切掉右尾"。但那是 sf=0.50、market_ma=30 口径下的统计; 收盘腿加到 90% 后, 单吊全仓的
  #   **一天只有一个仓位名额**, 零期望票占住名额的机会成本被放大 —— 剔除后资金留在现金,
  #   下一笔满仓落在真正的强信号上。分年 2022 已由正转负(+1.7pp 改善), 说明旧结论随口径失效。
  knife_tiers:
    - {mkt_above: -0.50, res_below: -4.0, mult: 0.00}
  mkt_floor_tiers:
    - {mkt_below: -1.50, floor: 1.00}
  # ---- 池深分档下注(第九十九轮): 当日候选池深度 = 同风格票的"共振强度" ----
  # 口径: 按 T 日收盘后"满足 dip 全部条件的票数"(scored, 盘后即知, 无未来函数)分档缩仓,
  #   只降仓不拒单 —— 每日计划票照常在 T+1 开盘价成交, 交易次数不变。
  #   池 >=21 满仓 / 11~20 半仓 / 1~10 三成 / 0(备用池补位) 满仓(不匹配任何档, 走默认)。
  # 依据(547 笔逐笔, 按 signal_date 的 scored 分桶, 1500 日):
  #   池41+  115笔 几何+1.28% 胜率59.1% 复利+330%
  #   池21-40 137笔 几何+0.62% 胜率49.6% 复利+135%
  #   池11-20 165笔 几何+0.04% 胜率44.2% 复利 +8%   ← 41% 的笔数, 几乎零贡献
  #   池 7-10  62笔 几何+0.08% 胜率51.6% 复利 +5%
  #   池 4-6   43笔 几何+0.29% 胜率51.2% 复利 +13%
  #   —— 池越窄 = 越少强势股同步回调 = 孤立回调、无板块共振, 次日反抽缺乏承接;
  #      池宽则是一批同风格票一起被错杀, 修复时同向共振。这是"机会集宽窄"的代理, 不是过拟合。
  # 结果: 1500日 959.66%/-21.83%/547笔/卡玛2.23 → 956.52%/-15.14%/548笔/卡玛3.21
  #       (收益 -3pp 在噪声内, 回撤 -6.7pp, 卡玛 +44%; 前后半窗 263/192 → 232/218)
  #       全史   2566.55%/-26.04%/1122笔/卡玛1.07 → 3647.88%/-25.54%/1124笔/卡玛1.22
  #       (收益 +1081pp, 四段 210/-16/230/212 → 287/-12/249/215)
  # 平台: 中间档 0.4/0.5/0.6/0.7 = 951.3/956.5/961.9/967.4%(卡玛 3.35/3.21/3.08/2.97, 单调权衡);
  #       小池档 0.2/0.3/0.4/0.5 = 956.5/956.5/955.5/953.4%(卡玛 3.32/3.21/3.10/3.00);
  #       阈值 17/19/21/23/25 = 990/996/957/939/904%, 31 才断崖(658%) —— 宽平台, 取 21/11。
  # 代价如实说明: 分年 4 改善 3 变差 —— 2021 +24 / 2024 +14 / 2025 +5 / 2020 -4 /
  #   2026 -8 / 2023 -10 / 2022 -21pp。2022 是"急跌后反弹"年, 池浅日恰是反弹起点, 降仓少赚;
  #   与"结构性翻转"不同, 这是"个别年份少赚", 全史与四段仍是净增益。
  pool_n_tiers:
    - {min: 21, mult: 1.00}
    - {min: 11, mult: 0.50}
    - {min: 1,  mult: 0.30}
  # 绩效门控仓位(第九十七轮验证, 证伪·不启用): 近 window 笔"已结算"均值 < cut_below 时仓位×cut_mult,
  # 试图在"策略自身走弱"(如 2025 全年胜率45%/单笔+0.15%)时主动降仓等风来。
  # 1500日实测全部劣化: 基线 596.3% → W10 444.9% / W20 451.9% / W40 448.1%(回撤确降到-17.8%,
  # 但收益腰斩); 叠加高开降仓同样从 776% 掉到 501~521%。复利策略里"自我降仓"就是主动减少
  # 在场次数, 卡玛升、绝对收益崩。引擎保留 perf_gate 开关(缺省空)供后续研究, 不写入默认口径。
  # perf_gate: {window: 20, cut_below: 0.0, cut_mult: 0.5}
  # 卖出端深跌延卖(第八十九轮): T+2开盘跌幅 >= 2%(且未跌停)时, 改为当日收盘卖出。
  # 仅用T+2开盘瞬时信息做决策, 无未来函数。500日主板单只口径(g08口径):
  #   未延卖 147.71%/68笔/73.5%/回撤-11.86% → 延卖 195.27%/66笔/75.76%/回撤-9.36%
  #   (延卖把"恐慌开盘割肉"换成收盘修复, 是胜率与复利的主要增量来源之一)
  sell_close_if_open_drop: 2.0
  # ---- 分批出场(第九十八轮, 历史留档·现行值见文末第一百一十一轮): 一半开盘落袋, 一半留到收盘 ----
  # 口径: T+2 开盘卖 50%(所得资金当日开盘即可再投), 收盘卖 50%(次日开盘方可投入)。
  #   开盘跌停、或 sell_close_if_open_drop 触发时, 仍全部按收盘卖(极端日保护不变)。
  # 动机 —— "日内收益(收盘/开盘-1)的方向"在翻转, 分年实测(0.5 减 1.0, 1500日):
  #   2020 +4 / 2021 +24 / 2022 +18 / 2023 +1 / 2024 +12 / 2025 -1 / 2026 -36pp
  #   2021~2024 收盘卖更好(日内修复), 2025~2026 开盘卖更好(开盘即当日最高, 日内单边下滑)。
  #   押单一时点 = 押"结构不变"; 两条腿各一半, 任何结构下都只错一半。
  # 依据(同引擎, 只改出场价; 选股/买入/笔数全不变):
  #   1500日: 776.02%/-24.45%/545笔/卡玛1.80 → 959.66%/-21.83%/547笔/卡玛2.23
  #           前后半窗 172/223 → 263/192 (前半 +91, 后半 -31, 整体 +184)
  #   全史:   1155.48%/-41.80%/1119笔/卡玛0.50 → 2566.55%/-26.04%/1122笔/卡玛1.07
  #           四段 122/-31/138/245 → 210/-16/230/212 (三段改善, 末段 -33pp)
  #           单笔均值 +0.281%→+0.432%, 胜率 50.4%→49.9%(略降, 收益来自盈亏比)
  # 平台: 1500日 0.8/0.7/0.6/0.5/0.4 = 839.7/875.2/914.7/959.7/1012.4%(单调平滑),
  #   全史 0.7=1900.6 / 0.5=2566.6 —— 是平台不是尖峰; 取 0.5 是 minimax(两腿等权),
  #   不猜"日内往哪边走" —— 全押收盘(0.0)在 1500 日更高(1395.6%), 但 2026 年要掉 55pp。
  # 代价如实说明: ①近两年少赚(2026 年 102.6%→66.4%, 仍为正; 2025 年基本持平);
  #   ②实盘要下两次单: 9:25 卖一半、14:55 卖一半, 比"一次开盘卖"多一步。
  #
  # ---- 第一百零四轮: 0.50 → 0.40(收盘腿 50%→60%) [历史留档·已被第一百一十一轮取代] ----
  # 起因: 逐笔拆"复利从哪来"发现 —— 575 笔里 49 笔(r_open>=5%)贡献等权复利 +3154%,
  #   其余 526 笔合计 -53%; 这 49 笔的 T+2 开盘就是最高点(日内 -0.83%/胜率35%, 再拿一天 -1.00%)。
  #   顺着这条线试过"高浮盈开盘一次性清仓"(sell_full_if_open_gain=5), 1500日 +28pp 但
  #   全史 18661→17512、回撤 -22.21→-22.98、卡玛 2.15→2.05 => **证伪, 不启用**。
  #   反过来看全样本: 575 笔 T+2 日内均值 +0.269%、阳线率 51% —— 收盘腿整体是赚的,
  #   49 笔是例外不是常态; 把 8.5% 的例外当成规则去改 100% 的仓位, 就是被右尾牵着走。
  # 依据(同引擎只改这一个数):
  #   1500日 2584.41%/-15.40%/卡玛4.79 → **2775.02%/-15.73%/卡玛4.82**(+190.6pp, 回撤仅 +0.33pp)
  #   全史  15303.4%/-22.17%/卡玛2.06 → **18661.6%/-22.21%/卡玛2.15**(+3358pp, 回撤 +0.04pp)
  #   全史分年 15 段里 12 段改善, 且 **2012-2019 这 8 个推导窗口之外的年份全部改善**(+0.1~+6.8pp);
  #   仅 2020 -1.2 / 2023 -0.3 / 2026 -1.2pp。
  # 平台(1500日): 0.5=2584/4.79 → 0.4=2775/**4.82** → 0.3=2987/4.56 → 0.2=3217/4.29 → 0.0=3710/3.79
  #   收益单调上升、卡玛在 0.4 见顶(0.3 起回撤 -17.1/-18.7/-22.2 快速抬升)。
  #   取 0.4 而不是收益更高的 0.3/0.2/0.0: 这是**卡玛峰值**, 且是唯一"收益↑、卡玛↑、回撤几乎不动"的点。
  # 代价如实说明: ①开盘只卖 40%, 当日回笼资金变少 -> 同日买入的仓位更容易被现金卡住(笔数仍 640 不变,
  #   但满仓票在"昨天卖了收盘腿"的日子会打折); ②近三年(2020/2023/2026)各少赚 0.3~1.2pp。
  #
  # 同轮证伪留档(全部同引擎实测, 均不启用):
  #   ① 高浮盈开盘全卖 sfg 3/4/5/6/8% -> 1500日 2590.7/2590.7/2612.4/2544.3/(8%未测完);
  #      全史 sfg5 17512.3%/-22.98%/2.05 < of04 18661.6%/-22.21%/2.15 —— 样本内小赚、样本外亏。
  #   ② 买入也分批 buy_open_frac 0.8/0.6/0.4 -> **1308.1/600.0/253.2%**(基线 2775%) 全线崩。
  #      机理: 买入日日内均值是**正**的(开盘即最低), 等收盘买 = 追高 0.6~0.9%/笔。
  #      这条同时反证了"9:25 集合竞价按开盘价买满"是这个策略最重要的执行细节。
  #   ③ 深跌延卖阈值 scd 1.5/2.0/2.5/3.0 -> 2770.5/**2775.0**/2733.6/2719.6, 现行 2.0 就是峰值, 不动。
  #
  # ---- 第一百一十一轮: 0.40 → 0.10(收盘腿 60%→90%) ----
  # 起因: 第 104~110 轮把 regime 层与执行层的降仓规则全部在新口径(ma20 / vol2.2 / 无 score_tiers)
  #   重扫过, 唯独卖出端还停在第一百零四轮。按同一逻辑复扫 —— 0.40 是在「market_ma=30 + score_tiers
  #   仍在」时调的, 那个口径下 0.3 起回撤从 -15.7% 急剧恶化到 -17.1/-18.7/-22.2, 所以只敢从 0.5 挪到 0.4。
  # 新口径下形态完全变了(1500 日, 同引擎只改这一个数):
  #   0.40(旧)=4349.61%/-14.45%/卡玛6.17 -> 0.30=4921.55/-14.09/6.61 -> 0.25=5246.16/-13.91/6.84
  #   -> 0.20=5598.62/-13.72/7.09 -> 0.15=5980.24/-13.53/7.35 -> **0.10=6391.98/-13.80/7.36**
  #   -> 0.00=7306.56/-14.78/7.18(笔数 633→573: 全额收盘卖致部分买入日无资金, 样本结构已变)
  #   —— 卡玛峰值从 0.4 移到 0.10, 且 0.3~0.1 回撤不但没恶化反而一路改善(与旧口径完全相反)。
  # 全史: 0.40=43003.14/-22.21/2.58 -> 0.25=64354/-23.29/2.66 -> 0.20=73693/-23.72/2.68
  #   -> 0.15=84452/-24.20/2.70 -> **0.10=96866.68/-24.72/2.71** -> 0.05=111205/-25.30/2.72
  #   -> 0.00=127770/-25.94/2.72(笔数 1173)。收益全程单调升、回撤单调恶化 2.5pp,
  #   但卡玛单调改善(2.58→2.71~2.72), 0.05~0.10 是平台而非尖峰。
  # 分年(全史 15 段, 0.10): **12 改善 3 变差**; 改善 2012+0.4/2013+10.4/2014+3.1/2015+24.2/
  #   2016+18.0/2017+2.6/2018+10.0/2019+2.7/2021+55.0/2022+53.1/2023+2.9/2024+11.0;
  #   变差 2020-2.4/2025-4.7/2026-3.8。样本外(2012~2019 这 8 年)**全部改善**。
  #   2015(杠杆牛+股灾)是全史最极端年份, 却是 +24.2pp —— 说明吃的是"深低开次日日内修复",
  #   不是牛市 beta, 这也推翻了"熊市 T+2 该早卖"的直觉。
  # 机制: 买入侧"9:25 开盘价买满"已证是日内最低(第一百零四轮); 卖出侧对称地, 深低开承接后的
  #   T+2 日内整体仍向上(全样本 T+2 日内均值 +0.269%/阳线率 51%), 越晚卖越接近当日高点。
  #   ma20 让策略在反弹初期即参与 -> 这类"刚启动的修复票"日内斜率更陡 -> 收盘腿价值进一步上升,
  #   这才是最优值从 0.4 漂到 0.10 的根因。
  # 代价如实说明: ①全史最大回撤 -22.21% → -24.72%(+2.51pp), 1500 日反而改善 0.65pp;
  #   ②近端 2025 -4.7 / 2026 -3.8pp 变差(近两年"开盘即当日最高、日内单边下滑"的月份变多);
  #   ③实盘仍是两笔单: 9:25 卖 10%、14:55 卖 90%(滑点已按双边千1计入)。
  # 同轮确认: scd(sell_close_if_open_drop) 在 sf=0.10 下几乎不敏感(1.5/2.0/2.5/3.0/关 =
  #   6392/6392/6357/6349/6311, 卡玛 7.36~7.40), 保持 2.0 不动。
  # 同轮证伪: ①sell_full_on_rebuy(有买入日开盘清仓) = sf1.0 的 2435.15% —— 1500 日内卖出日
  #   恒有买入计划, 该开关等价于"全开盘卖", 负向; ②选股层四参数全部当前值即峰值
  #   (cpos 0.38/0.40 虽 +121/+206pp, 但 0.42 起回撤崩到 -20.55%, 紧贴断崖不取;
  #   dip_pct_min -7.0/-6.5/-5.0 = 2929/2925/1550, vr 3.0/4.0/4.5 = 4127/4204/4187,
  #   dlow 4.0/5.0/8.0/10.0 = 3323/3001/2919/1967, 均劣于基线 4350)。
  #
  # ---- 第一百一十五轮: 0.10 → 0.00(取消开盘腿, 全部尾盘卖) ----
  # 起因: 第 113/114 轮把 min_pool 与 knife 两处"旧口径遗留值"复扫出改善后, 卖出端第三次成为嫌疑 ——
  #   0.10 是第一百一十一轮在 (knife=0.30, min_pool=11, ma20) 口径下定下的, 之后两个口径参数都动了。
  # 结果(同引擎只改这一个数):
  #   1500 日 0.10=8345.80/-14.23/7.78/455 笔 → 0.08=8656.99/-14.21/7.88 → 0.05=9150.42/-14.38/7.92
  #     → 0.03=9497.81/-14.51/7.95 → **0.00=10047.62/-14.69/7.99/379 笔** —— 收益/卡玛全程单调, 无拐点;
  #   全史 0.10=127423/-24.72/2.85/1075 笔 → 0.05=151033/-25.30/2.87 → 0.02=167400/-25.68/2.88
  #     → **0.00=179346/-25.94/2.89/906 笔**(1.41 倍, +51923pp) —— 两窗口同向、同样单调。
  # 效应分解(关键, 决定这条改善是否可持续):
  #   ① 0.10 → 0.02: **笔数不变(1075)**, 单笔 0.863%→0.903%, 全史 +40000pp —— 纯价格效应:
  #     T+2 开盘价系统性低于当日收盘价(深低开承接后的修复day, 开盘是修复起点、收盘是修复终点);
  #   ② 0.02 → 0.00: 笔数 1075→906, 单笔 0.903%→1.059% —— 资金效应: 开盘不再有 10% 回笼现金,
  #     "仓位已被池深/高开档降到三成"的票无法通过 30% 最小成交门槛而被跳过, 跳过的恰是最差一档。
  #   所以 0.00 的下行保护是"至少拿到 ①的 +40000pp"; ②这部分与第一百一十四轮"零期望票占名额"同源。
  # 分年(全史 15 段): **12 改善 3 变差**; 变差仅 2020 -1.8 / 2025 -2.3 / 2026 -2.4pp;
  #   改善 2021 +33.5 / 2022 +26.8 / 2015 +10.9 / 2024 +6.9 / 2016 +6.5 / 2018 +3.7 / 2013 +3.2 /
  #   2019 +2.6 / 2023 +2.2 / 2014 +0.9 / 2017 +0.6 / 2012 +0.2; 样本外 2012~2019 八年**全部改善**。
  # 代价如实说明: ①全史最大回撤 -24.72% → -25.94%(+1.22pp), 1500 日 -14.23% → -14.69%(+0.46pp) ——
  #   卡玛仍升(7.78→7.99 / 2.85→2.89), 是"多赚 41%、多担 1.2pp 回撤"; ②实盘从两笔单简化为**一笔**:
  #   14:55 一次性清仓, 不再有 9:25 的开盘腿 —— 对人工执行更简单, 但尾盘单笔冲击成本略高(滑点仍按千1计)。
  # 同轮证伪(全部同引擎实测, 均不启用, 能力保留在代码中):
  #   ① 风控解除后渐进建仓(新增 regime.reentry_ramp_days/start): 3日@0.5=4302.24、5日@0.5=(腰斩)、
  #     8日@0.5=4302、5日@0.3=3970 —— **不是"不确定期", 反弹初期恰是 edge 最强的一段**, 降仓等于削掉最肥的肉;
  #   ② 跨日分批出场(新增 execution.defer_frac/defer_days, 尾腿延到 T+3): 0.3×1日=4821.49、
  #     0.5×1日=3336.37、0.3×2日=3507.71 —— **日内有斜率、隔夜无溢价**, T+2 收盘是终点站;
  #   ③ 个股超额涨跌因子(新增 selection.dip_weights.res_pct, 把刀口保护连续化): 0.05=6245.79、0.10=3493.90;
  #   ④ 刀口阈值复扫: res_below -3.0=7806.13 / -5.0=6638.86(vs -4.0 的 10047.62) —— -4.0 仍是峰值;
  #   ⑤ 池深中间档复扫: 0.4=9730.79(-317pp 但在噪声带内, 卡玛 8.24 更高) / 0.6=10354.81(-卡玛);
  #     取 0.4 属"收益换回撤", 差异均在噪声带内, 按纪律不动; ⑥ gap_floor.min_pool 3 与 5 **逐位相同**(饱和)。
  sell_open_frac: 0.00
  # ---- 浮亏延卖(第九十八轮验证, 证伪·不启用): 换一个刻度看"该不该等日内修复" ----
  # 假设: T+2 开盘相对**我的买入价**浮亏时, 改为当日收盘卖出(等日内修复); 浮盈则开盘落袋。
  #   与 sell_close_if_open_drop 的区别: scd 看"相对昨收的跳空", spb 看"相对我的成本"——
  #   同一个 -2% 跳空, T+1 大涨后是浮盈 +1%, T+1 崩盘后是浮亏 -7%, 日内修复概率不同。
  # 逐笔证据(545 笔): 开盘卖 +0.712%/胜率56.5% → 跳空延卖 +0.741% → 浮亏延卖 +0.920%/67.0%;
  #   浮亏落在 -3~-2% 的 49 笔日内平均修复 +1.11%(修复最猛的一段)。方向看起来成立。
  # 回测(同面板同引擎):
  #   1500日: 776.02%/-24.45%/545笔/卡玛1.80 → 764.98%/-21.21%/508笔/卡玛2.06 (持平, 回撤-3.2pp)
  #   全史:   1155.48%/-41.80%/1119笔/卡玛0.50 → 1775.96%/-27.83%/1045笔/卡玛0.88 (收益+620pp)
  #   —— 到这里看是"全面改善"。
  # **分年拆开就翻转**(1500日, spb-0.3 减基线): 2020 +11.9 / 2021 +4.3 / 2022 +39.9 /
  #   2023 -5.7 / 2024 +21.0 / 2025 -4.8 / **2026 -68.0pp**(基线+102.6% → +34.6%)。
  #   最近 12 个月回放: 75.87%/-16.52% → 22.88%/-14.99%(-53pp)。
  # 结论: 这条规则"历史上对、当下错" —— 越靠近现在, 日内反转越弱(T+2 开盘浮亏往往继续走弱),
  #   且收盘卖使资金 T+3 才能再投(笔数 545→508, -7%), 在快节奏行情里双重吃亏。
  #   与第九十七轮"高开降仓"(早期差、当下对)恰好相反; 那个敢用是因为当下有效, 这个不敢用同理。
  # 引擎与实盘端保留开关(缺省 None=不生效), 供后续结构再变时复测:
  # sell_close_if_profit_below: -0.3
  # 注: A股T+1制度, 当日买入的股票当日不可卖出。系统不存在任何
  #     "当日买入当日卖出"规则(此前版本的尾盘止损/风控尾盘离场已回滚,
  #     其回测收益数字无效), 所有持仓最早于次一交易日开盘卖出。
  alloc_frac_pct: 100.0      # 每笔买入占组合总资产比例(%): 单吊口径, 全仓买入评分第1名
  max_buy_per_day: 1         # 每日最多买入只数: 1=单吊(与实盘人工执行一致; top1不可成交时顺延下一只)
  commission_rate: 0.00025   # 佣金万2.5(双边)
  stamp_tax: 0.0005          # 印花税(卖出)
  slippage: 0.001            # 滑点(双边各千1)

risk: {}                     # 行为风控(可选; 第六十三轮清空——month_profit_cap已删除)
  # month_profit_cap 已删除(第六十三轮用户拍板, 随口径切换top30一并):
  # top30口径下熔断成本646pp(1630.28%→2275.75%)且回撤零改善(-9.05%两档同)、卡玛反而更低(35.58 vs 43.68);
  # top10口径下成本仅29.5pp(留档: 第五十三轮审计, 恢复方法 = 加回 {cap_pct: 30, cut_frac: 0.6})

monitor:                     # 滚动失效监测(2026-10-24第三十九轮, 纯告警层, 不改执行逻辑)
  enabled: true
  window: 20                 # 滚动窗口(已结算净收益笔数); 实盘月均4~6笔, 20笔约3~5个月
  watch_mean_pct: 1.0        # 滚动均值<+1% -> 黄-观察带(回测基准单笔+3.24%的一半; 整数锚点防挖掘)
  warn_mean_pct: 0.0         # 滚动均值<0% -> 红-失效警报(与正期望主张背离)
  halt_mean_pct: -1.0        # 滚动均值<-1% -> 深红-建议停机复检

backtest:
  trading_days: 1500         # 回测窗口(交易日, 第九十五轮 500→1500): 500 日只覆盖 2024-10 起的
                             # 小盘牛市, 是"收益虚高"的根源(同配置在前一个 500 日窗口 -86.7%)。
                             # 1500 日覆盖 2020-11~2026-10: 含 2022 熊市、2024-01 小盘流动性危机、
                             # 2024-09 反转、2025 震荡, 跨越完整情绪周期。
  warmup_days: 160           # 指标预热与上市天数校验窗口
  initial_capital: 1000000.0 # 初始资金(元), 复利滚动

pages:
  title: "A股次日候选池系统"
  history_keep_days: 60      # Pages 展示的历史战绩天数
