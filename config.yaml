# =====================================================================
# A股次日候选池系统 - 策略参数配置
# 交易模式: T日收盘后出池 -> T+1开盘竞价买入 -> T+2开盘竞价卖出
# =====================================================================

data:
  # zzshare 数据源(免费公开)。匿名可用但限速较低；如需提速可在仓库
  # Secrets 中配置 ZZSHARE_TOKEN (官网 https://quant.zizizaizai.com 免费获取)
  token_env: ZZSHARE_TOKEN
  min_interval_sec: 0.45     # 两次请求最小间隔(秒)
  max_retries: 5             # 请求失败重试次数
  panel_dir: data/panel      # 行情持久层(每交易日一个csv.gz, 随仓库版本化, 增量更新)
  cache_dir: data/cache      # 运行时临时缓存(不入库; 旧pkl命中时自动迁移至panel_dir)

universe:
  boards:                    # 允许参与的板块(第八十九轮: 用户约束仅沪深主板, 移除创业板)
    - 主板
  exclude_bj: true           # 排除北交所
  exclude_star: true         # 排除科创板(688)
  price_min: 3.0             # 收盘价下限(元): 压尾部(低价股易连续跌停, 2→3回撤-47.9%→-16.8%)
  price_max: 150.0           # 收盘价上限(元): 第九十轮 300→150(单只主板口径)。高价股在深低开后的
                             # 反抽弹性更弱, 500日 192.02%→212.61%/67笔/胜率76.12%/回撤不变;
                             # 阈值130~170结果完全相同(平台), >170才劣化。历史多票口径下 150→300 曾改善, 留档。
  amount_min_yi: 0.8         # 当日成交额下限(亿元); 2026-10-21定稿: 2.0→0.8(全窗571→751%, 0.6~0.8为宽平台, 0.8流动性更稳)
  turnover_min: 2.0          # 换手率下限(%)
  turnover_max: 12.0         # 换手率上限(%): 20→15剔除高换手分歧票; 第八十九轮主板单只口径
                             # 由15收紧至12(500日 140.09%→195.27%、胜率72.0→75.76%、笔数50→66)
  listed_min_bars: 120       # 上市满最少交易日(过滤次新股)

selection:
  mode: dip                  # 信号模式: dip(趋势内缩量回调+次日深低开承接, 主力) / momentum(隔夜动量, 备用)
  top_n: 500                 # 观察池上限(rank诊断/研究用; 扫描显示500起饱和)——非资金部署口径
  display_top_n: 1           # 每日发布池=1只(第八十九轮用户约束: 网页每日仅给一只沪深主板股票,
                             # 次日人工观察入场); 发布池=回测可执行池=竞价指引, 三端一致。
                             # 单只无顺延: 第1名缺口不达标即空仓。
  exec_top_n: 1              # 回测可执行池深度=1(与display_top_n一致); 无深度门控/无顺延。
                             # 历史固定池深与绩效门控口径(第八十七~八十八轮)留档于README/CHANGELOG。
                             # BT_TOPK环境变量仅诊断用。
  # ---- 多策略分段并行(第七十八轮实现, 默认关闭) ----
  # 机制(已落地到 src/selector.py + src/backtest.py): 主力池出票 -> 引擎按评分顺延,
  # 主力池当日全部未达承接线时, 自动落到备用池(按 pool=fb1/fb2... 依序), 即"主力没票就切另一个策略"。
  # `segment` 控制备用池启用的市场分段: all=全时段 / trend=仅指数>=MA30 / weak=仅指数<MA30。
  # 十年走前验证(备用池=momentum, 承接线-2.35):
  #   trend/n1(仅趋势段, 补位1只): 500日 +432.14%/-6.46%/49笔/卡玛20.54(基准 387.23%/-6.92%/39笔/17.7
  #     —— 全面占优); 但十年 +213.96%/-51.65%/210笔, era前 -0.232%/笔(复-41.00% vs 基准 -32.24%)、
  #     era后 +3.672%/笔(复+432.22%) —— era前劣化且回撤扩大, 未过注册判据(era前不劣化)。
  #   trend/n5: 500日回撤 -6.92%→-20.96%(卡玛17.7→6.1); 十年 +254.45%/-42.70%, era前-30.55%、era后+410.55%。
  #   全时段/n5: 500日 回撤 -56.05%、卡玛崩至低位; 仅弱势段: 十年 +164.95% 全面劣化。
  # 结论: 备用池的真实增量集中在 era后(2024-09之后), era前为负 —— 与第七十四/七十六轮同源, 故默认关闭。
  # 启用方式: 把下面的 fallbacks 列表放开(并在 daily_run 的发布池里同步展示 fb 票, 保持三端一致)。
  # ---- 多策略单槽漏斗(第九十一轮启用, 用户要求: 主力没信号的日子用其他策略补位) ----
  # 机制(src/selector.py + src/backtest.py): fallback_slot=true 时, 主力 dip 当日**有候选**
  # 就只发主力(网页仍1只、无备用票); 只有主力当日完全没有候选(典型是弱市里没有"上升趋势内
  # 缩量回调"的票), 才按下列顺序用备用策略补位。买入端仍是每日最多1只(max_buy_per_day=1)。
  # 与第七十八轮的"主力出票后仍层层顺延"不同: 那种漏斗的补位发生在"主力票竞价缺口不达标"
  # 的日子, 恰是逆向选择最强的日子, 500日补位均值≈0甚至为负、回撤翻倍(见CHANGELOG第九十一轮)。
  # 单槽漏斗的真实增量来自"主力无信号日", 十年六窗口实测每窗口收益均提高、回撤不变或更低:
  #   2015-11~2017-10 -6.2%→+19.7%; 2017-11~2019-10 -2.8%→+64.2%; 2019-11~2021-10 28.4%→53.1%;
  #   2021-11~2023-10 40.3%→42.6%; 2023-11~2025-10 107.9%→145.9%; 2024-10~2026-10 247.7%→306.0%
  #   (单槽漏斗补位笔数 34/48/13/7/21/12, 补位单笔均值 +0.77/+1.14/+1.44/+0.29/+0.84/+1.34%)
  # 组成只保留补位单笔六窗口均为正的族: momentum(隔夜动量, 样本最大)、oversold(深跌阳线反转)、
  # pullback(趋势回踩5日线)。squeeze/spike/limitup/reversal 补位均值为负或方向不稳, 不挂入。
  fallback_slot: true
  fallbacks:
    - mode: momentum        # 隔夜动量: 六窗口补位均值全为正, 样本最大(33~48笔/窗口)
      top_n: 1              # 备用池顺延上限(只买前N名)
      gap_below: 0           # 与主力同口径(第九十二轮): 无需缺口门槛, 开盘价直接成交
      segment: all          # all / trend / weak
    - mode: oversold        # 深跌阳线反转: 六窗口补位均值全为正(样本较小)
      top_n: 1
      gap_below: 0
      segment: all
    - mode: pullback        # 趋势回踩5日线: 补位均值为正但样本小, 排在最后
      top_n: 1
      gap_below: 0
      segment: all
  # 历史"层层顺延"口径(第七十八~七十九轮, 默认关闭)留档于 README/CHANGELOG:
  # fallbacks 列表放开 + fallback_slot: false 即恢复"主力出票后仍用备用池顺延"。
  # ---- 通用 ----
  bias20_max: 8.0            # 20日乖离率上限(%): 单吊口径8最优(7过严崩/9~12衰减, 15时-41.86%)
  # ---- dip 模式(趋势内缩量回调, 次日深低开承接) ----
  dip_pct_min: -6.0          # 回调日涨幅下限(%): 2026-10-22定稿 -5.7→-6.0(配合dlow5新条件后
                             # 更深的回调票有了距低点保护, 全窗2624→2891%/卡玛30.33→32.14; -5.4则崩至1637%)
  dip_pct_max: -3.0          # 回调日涨幅上限(%): 阴线足够深(-2.5/-3.5均衰减)
  dip_vol_ratio_max: 3.0     # 回调日量比上限: 3.0~3.2平台
  dip_mom20_min: 5.0         # 20日涨幅下限(%): 有前期趋势
  dip_mom20_max: 25.0        # 20日涨幅上限(%): 非高位加速
  dip_dist_low20_min: 6.0    # 距20日最低价涨幅下限(%): 2026-10-22新增(排除已深跌票——跌太深的票
                             # 反抽是"死猫跳"而非趋势内回调承接; 10%过严-676pp)。第九十轮 5→6:
                             # 单只口径 217.48%/66笔/胜率77.27%; 与price_max150合用 239.86%/67笔/77.61%;
                             # 5.5/6.0/6.5 = 212.6/239.9/219.7, 6.0为局部峰值, 跨6窗口收益全优于5.0。
  dip_close_pos_max: 0.32    # T日收盘位置上限: 阴线收在当日区间下沿32%以内才买(尾盘仍在高位出货的票次日反抽弱)
                             # 2026-10-22定稿: 0.34→0.32(全窗2147→2518%/胜率57.5→60.5%/夏普2.69→2.76/盈亏比4.16→4.71,
                             # 回撤-14.14→-15.13%; 0.325=2327/0.33=2035; 注意0.315=1738左侧有悬崖, 属平台边缘,
                             # 半窗口双段占优: 前半192→224%/卡玛17.7→32.0, 后半712→744%持平)
  dip_weights:               # 观察池评分权重(单只主板口径下排序即唯一计划; mom过强=深低开接飞刀)
    mom20: 0.20              # 前期趋势强度(第八十九轮 0.30→0.20, 把权重让给乖离安全垫)
    neg_bias20: 0.70         # 乖离越低越安全(第八十九轮 0.60→0.70: 单只口径胜率/复利双升)
    neg_amount: 0.05         # 体量因子(2026-10-22二次定稿: 0.07→0.05, 匀0.02给量比因子)
    neg_vol_ratio: 0.02      # 量比因子(2026-10-22新增): 缩量越极致=抛压越枯竭, 次日承接越轻;
                             # 全窗2624→2891%/卡玛30.33→32.14/胜率持平60.5%; 0.03时2549%过重
    low_tail: 0.03           # 下影线因子(2026-10-22新增): T日下影线越长=盘中恐慌承接越充分,
                             # 次日深低开后反抽确定性更高; 全窗收益1798→1903%/回撤-15.13→-14.14%/
                             # 卡玛22.53→24.96/夏普2.81→2.86/盈亏比4.71→4.96;
                             # 半窗口: 前半段买入决策零扰动, 后半段511.8→545.8%全面占优
  # ---- momentum 模式参数(备用) ----
  pct_min: 1.0               # T日涨幅下限(%)
  pct_max: 7.0               # T日涨幅上限(%)
  vol_ratio_min: 1.2         # 量比下限
  vol_ratio_max: 5.0         # 量比上限
  ma5_slope_up: true         # MA5向上
  weights:                   # momentum 评分权重
    vol_ratio: 0.35
    mom3: 0.25
    mom20: 0.20
    amount: 0.10
    neg_bias20: 0.10
  # ---- 第七十九轮新增信号族(仅作备用池候选, 参数默认值在 src/selector.py, 此处不配置即用默认) ----
  # 六个 mode 均为独立信号族, 只能在 selection.fallbacks 里以 mode 名挂载, 不影响主力 dip。
  # 十年走前验证结论: 八族全部未过注册判据(era 前每笔为负并放大回撤), 故 fallbacks 保持 []。
  # 键名前缀: rev_=reversal / sq_=squeeze / pb_=pullback / lu_=limitup / sp_=spike / os_=oversold。
  # 下方列出的是"代码内默认值", 需要调参时再放开同名键即可覆盖。
  # reversal 超跌反转(-9.5~-4.0% 放量收高 + 20日未过热):
  #   rev_pct_min: -9.5 / rev_pct_max: -4.0 / rev_vol_ratio_min: 1.2
  #   rev_close_pos_min: 0.60 / rev_low_tail_min: 0.8
  #   rev_mom20_max: 5.0 / rev_dist_low20_max: 15.0
  # squeeze 低波缩量横盘(小阳 + 振幅≤4 + 均线多头 + 低波分位):
  #   sq_pct_min: 0.5 / sq_pct_max: 5.0 / sq_vol_ratio_min: 1.0
  #   sq_vol_ratio_max: 2.5 / sq_amp_max: 4.0 / sq_bias_max: 5.0
  #   sq_mom20_min: 0.0 / sq_mom20_max: 15.0 / sq_ivol_q: 0.35
  # pullback 趋势回踩5日线(趋势中缩量回踩, 不破MA20):
  #   pb_pct_min: -3.0 / pb_pct_max: 1.0 / pb_mom20_min: 12.0
  #   pb_mom20_max: 45.0 / pb_dist_ma5_min: -3.0 / pb_dist_ma5_max: 2.0
  #   pb_vol_ratio_max: 1.3 (乖离上限复用通用 bias20_max)
  # limitup 涨停深低开承接(涨停非一字 + 次日深低开):
  #   lu_pct_min: 4.5 / lu_mom20_max: 40.0 / lu_bias20_max: 12.0
  # spike 放量突破承接(放量中阳 + 收在高位):
  #   sp_pct_min: 3.0 / sp_pct_max: 7.0 / sp_vol_ratio_min: 1.5
  #   sp_vol_ratio_max: 3.5 / sp_close_pos_min: 0.65
  #   sp_mom20_min: 0.0 / sp_mom20_max: 30.0 (乖离上限复用通用 bias20_max)
  # oversold 深跌阳线反转(20日深跌后 T 日阳线):
  #   os_pct_min: 1.0 / os_pct_max: 6.0 / os_mom20_max: -10.0
  #   os_dist_low20_max: 10.0 / os_close_pos_min: 0.60 / os_vol_ratio_min: 1.2

regime:                      # 大盘风控: 触发则次日空仓(压回撤核心)
  enabled: true
  breadth_min: 0.25          # 全市场站上MA20个股占比 < 25% -> 空仓(ma30下0.25最优)
  market_ma: 30              # 市场等权指数 < 其MA30 -> 空仓(gap-2.40环境下28~30为565~577%平台,
                             # 32以上递减至523~548%; 取保守端30; 注: MA参数与承接线联动, gap放宽时MA宜短)
  warmup_days: 30            # 计算风控指标所需历史天数
  vol_max: 2.0               # 恐慌型波动熔断(2026-10-23定稿): 高波动(20日std>2.0%)且市场20日
                             # 动量为负(下跌中)时空仓; 暴涨型高波动(924行情初期)不误杀。
                             # 十年3372日信号扫描+走前验证: 被剔除29笔全部位于2015股灾/2016
                             # 熔断/2018/2020-03/2022/2026-03恐慌期, 均值-1.72%/胜率41.4%;
                             # h1基准-0.488%→+0.104%(转正), h2 +0.702%→+1.092%/胜率56.5%, 双段一致
  vol_mkt_ret_min: 0.0       # 恐慌判定中的20日动量阈值(=): 指数20日收益低于此值视为"下跌中"
  max_block_days: 0          # 0=不设上限(第九十五轮): 风控期间一直空仓, 直到宽度/指数重新达标才恢复。
                             # 原 5 日强制复参与是"近两年牛市"里调出来的: 上一窗口(2022-01~2024-10)
                             #   强制回到下跌市 → 每笔期望 -0.38%, 456 笔复利 -86.7%;
                             # 14 年全史(2012-11~2026-10, 3378 日) 强制复参与 -95.8%/回撤 -99.6%,
                             #   改为不设上限后 -51.5%/回撤 -92.0%, 两段与全史同向 —— 不再"跌着也要参与"。
                             # 代价: 空仓天数 736→1461(占 43%), 牛市里会错过部分反弹(近500日 +441%→+285%);
                             #   但配评分门槛后近500日 +232%/回撤 -23.6%, 全史 +890% —— 空仓期不亏就是收益。
  rf_ramp: true              # 渐近恢复(2026-10-22定稿): 超限后每多1日风控, 参与系数+0.05直至100%
                             # 走前验证通过: h1选参(卡玛33.14 vs 32.73)→h2样本外844.12% vs 803.85%(+40pp)
                             # 全窗2891→3052%/卡玛32.14→33.19/回撤持平-14.14%; 缺口分级下注证伪(卡玛降)
  block_reenter_frac: 0.95   # 超限后的参与仓位系数(2026-10-22三次定稿: 0.75→0.95,
                             # 配合dlow5新条件: 全窗1903→2624%/卡玛24.96→30.33/回撤持平-14.14%;
                             # 0.90=2487%/29.37, 1.00=2767%但回撤-14.34%开始恶化, 取0.95;
                             # 半窗口双段占优: 前半227→250%/卡玛32.4→34.9, 后半546→722%/卡玛39.3→52.0)
                             # (2026-10-25第五十二/五十五轮语义澄清: rf_ramp=true时本参数实际不生效
                             #  —— 渐进公式在首个超限日即min(1,0.95+0.05)=1.0封顶, 超限参与日
                             #  实为"全额参与+严承接线-2.75"; 仅rf_ramp=false时本参数才有意义)

execution:                   # 实盘执行口径(回测与实盘一致)
  buy_gap_below: 0           # 0=不设缺口门槛(第九十二轮): 每日计划票在 T+1 开盘价直接成交。
                             # 依据用户实际执行: 收盘后收到计划, 次日开盘即买, 不按缺口挑单;
                             # 回测/回放/实盘三端同口径, 回放才等于真实账户路径。
                             # 500日实测代价: 笔数 99→390, 区间收益 470.79%→454.84%(-15.95pp),
                             #   最大回撤 -15.56%→-31.34%, 卡玛 30.25→14.51
                             #   —— 选股正期望仍在(单笔均值 +1.87%→+0.48%), 但风险敞口翻倍。
                             # 历史"深低开挑单"口径(-0.8最优, 收益-胜率-笔数综合最优)留档于
                             # CHANGELOG 第八十九~九十一轮; 恢复方法 = 把本值改回 -0.8 并同步 fallbacks。
  block_gap_below: 0         # 第九十二轮随 buy_gap_below 归零: 风控超限小仓参与日同样按开盘价直接成交。
                             # 原 -2.75 是"弱市要求更深承接"的加成线, 在无缺口门槛口径下不再有意义。
                             # 恢复方法 = 与 buy_gap_below 一并改回负值。
  min_top1_score: 1.5        # 首选质量门槛(第九十五轮): 当日首选票的综合评分(横截面 z 分)低于 1.5 则
                             # 不参与, 当日空仓。评分对全池标准化, 与市场涨跌无关, 可跨日/跨市况比较。
                             # 依据(14 年全史 3378 日 + 两个不重叠子窗口同向):
                             #   无门槛 -51.5%/回撤 -92.0%/1729 笔/单笔 +0.01%
                             #   1.3    +1269.7%/-47.8%/741 笔/单笔 +0.41%
                             #   1.5    +890.1%/-46.8%/532 笔/单笔 +0.49%   ← 采用
                             #   1.8    +658.0%/-25.8%/277 笔/单笔 +0.80%
                             #   2.2    +36.6%/-14.2%/64 笔/单笔 +0.56%(样本过少, 平台外)
                             # 单笔期望随门槛单调上升(0.01→0.41→0.49→0.80%)= 评分确有排序力;
                             # 1.3~1.8 为宽平台, 取中段 1.5: 回撤最小、近 500 日最优(+232%/-23.6%)。
                             # 代价: 成交笔数从 1729 降到 532(约 6 个交易日 1 笔), 多数日子页面是"今日不参与"。
  skip_open_loss: 0          # 低开保护已关闭(0=不过滤): 回测证实放开深低开后收益更高且回撤更低
  skip_open_gain: 10.0       # T+1开盘涨幅>=10%放弃买入(%): 仅拦开盘一字涨停(物理买不到),
                             # 第九十二轮 9.0→10.0 —— 原 9% 会漏掉"高开但可成交"的票, 与"每日开盘价成交"冲突。
  sell_limit_down_fallback: true   # T+2开盘跌停 -> 保守按当日收盘卖出
  # ---- 第八十~八十七轮执行侧实验开关 ----
  # 限价承接(证伪, 保持关闭): 500日实测笔数39→133~295, 收益387%→63~124%
  # (成交集中在"开盘不跌、盘中继续跳水"的票, 等于接回主力主动规避的下杀)。
  # buy_limit_fill: 1
  # buy_limit_open_max: 0.0
  # 名次梯度承接线(第八十七轮): 扩池时深名次要求更深折价。第八十九轮单只无顺延, 置空。
  gap_rank_tiers: []
  # 绩效门控池深(第八十七~八十八轮, 历史多票口径留档): 近window笔已结算均值>min_avg时
  # 扩到 hot_top_n, 否则收缩到 cold_top_n(仅用已实现成交, 无未来函数)。
  # 500日 387.23%/-6.92%/39笔 → 1634.81%/-9.34%/63笔/卡玛34.54; 十年 1676.81%/165笔。
  # 第八十九轮主板单只口径下池深恒为1, 门控关闭, 不再影响发布/回测。
  depth_gate: {}
  # 卖出端深跌延卖(第八十九轮): T+2开盘跌幅 >= 2%(且未跌停)时, 改为当日收盘卖出。
  # 仅用T+2开盘瞬时信息做决策, 无未来函数。500日主板单只口径(g08口径):
  #   未延卖 147.71%/68笔/73.5%/回撤-11.86% → 延卖 195.27%/66笔/75.76%/回撤-9.36%
  #   (延卖把"恐慌开盘割肉"换成收盘修复, 是胜率与复利的主要增量来源之一)
  sell_close_if_open_drop: 2.0
  # 注: A股T+1制度, 当日买入的股票当日不可卖出。系统不存在任何
  #     "当日买入当日卖出"规则(此前版本的尾盘止损/风控尾盘离场已回滚,
  #     其回测收益数字无效), 所有持仓最早于次一交易日开盘卖出。
  alloc_frac_pct: 100.0      # 每笔买入占组合总资产比例(%): 单吊口径, 全仓买入评分第1名
  max_buy_per_day: 1         # 每日最多买入只数: 1=单吊(与实盘人工执行一致; top1不可成交时顺延下一只)
  commission_rate: 0.00025   # 佣金万2.5(双边)
  stamp_tax: 0.0005          # 印花税(卖出)
  slippage: 0.001            # 滑点(双边各千1)

risk: {}                     # 行为风控(可选; 第六十三轮清空——month_profit_cap已删除)
  # month_profit_cap 已删除(第六十三轮用户拍板, 随口径切换top30一并):
  # top30口径下熔断成本646pp(1630.28%→2275.75%)且回撤零改善(-9.05%两档同)、卡玛反而更低(35.58 vs 43.68);
  # top10口径下成本仅29.5pp(留档: 第五十三轮审计, 恢复方法 = 加回 {cap_pct: 30, cut_frac: 0.6})

monitor:                     # 滚动失效监测(2026-10-24第三十九轮, 纯告警层, 不改执行逻辑)
  enabled: true
  window: 20                 # 滚动窗口(已结算净收益笔数); 实盘月均4~6笔, 20笔约3~5个月
  watch_mean_pct: 1.0        # 滚动均值<+1% -> 黄-观察带(回测基准单笔+3.24%的一半; 整数锚点防挖掘)
  warn_mean_pct: 0.0         # 滚动均值<0% -> 红-失效警报(与正期望主张背离)
  halt_mean_pct: -1.0        # 滚动均值<-1% -> 深红-建议停机复检

backtest:
  trading_days: 1500         # 回测窗口(交易日, 第九十五轮 500→1500): 500 日只覆盖 2024-10 起的
                             # 小盘牛市, 是"收益虚高"的根源(同配置在前一个 500 日窗口 -86.7%)。
                             # 1500 日覆盖 2020-11~2026-10: 含 2022 熊市、2024-01 小盘流动性危机、
                             # 2024-09 反转、2025 震荡, 跨越完整情绪周期。
  warmup_days: 160           # 指标预热与上市天数校验窗口
  initial_capital: 1000000.0 # 初始资金(元), 复利滚动

pages:
  title: "A股次日候选池系统"
  history_keep_days: 60      # Pages 展示的历史战绩天数
