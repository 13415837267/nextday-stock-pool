#   另证伪: neg_close_pos/neg_dist_ma5/neg_dist_low20 软评分(全史呈孤立尖峰, 如 cpos 0.03/0.04/0.05/0.06
#     = 102136/94068/109288/82142)、分散持仓 2~3 只(2x50=1229% vs 单吊 6392%, 评分第2名起质量断崖)。
#
# 【参数状态: 第一百一十二轮全域复扫 + 一百一十三/十四/十五轮三处放宽 + 一百一十六轮引擎纠错
#   + 一百一十七轮 PIT 纠正 + 一百一十八轮 PIT 口径下全域复扫 —— 现已无已知可改进项】
