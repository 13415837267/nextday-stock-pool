# 【第一百一十八轮: PIT 干净口径下的第一次全域复扫 —— bias20_max 8→11, dip_vol_ratio_max 3.5→4.0】
#   起因: 第一百一十七轮把口径整个换成 PIT 干净版(修掉三处前视), 但此前 109~116 轮的所有"最优值"
#     都是在含前视的旧口径下测的。**口径变了, 峰就未必还在原来的位置** —— 本轮做一次全域复扫。
#   先验证前几轮的三个"取消类"改动在新口径下是否仍成立(全部成立, 无一回退):
