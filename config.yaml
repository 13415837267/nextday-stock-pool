#   ※ 此段结论已被第一百一十六轮推翻(实为 equity 漏计 pending_cash 造成的注水成交), 保留原文仅为留痕。
#   同轮证伪: 风控解除后渐进建仓(reentry_ramp_days 3/5/8 × start 0.3/0.5 = 4302/3970/…, 全部腰斩 ——
