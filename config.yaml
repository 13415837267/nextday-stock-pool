#       —— 全部劣于现值(其中 close_pos 0.40 是孤峰: 0.36=4895/0.40=5755/0.45=3965 且回撤崩到 -31%)。
#   关于基线数字: 第一百一十七轮记录的 4949.51%/378 笔在当前代码上复现为 4986.84%/377 笔。
#     两种"传不传 names"的写法实测逐位相同, 差异来自 117 轮末尾 name_filter 改动前的中间态残留,
