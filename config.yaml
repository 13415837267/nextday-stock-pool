#
# 【第一百一十四轮: knife_tiers.mult 0.30 → 0.00(刀口组由"缩到三成仓"改为"不参与")】
#   1500 日 7469.28%→8345.80%/卡玛 7.61→7.78/笔数 633→455/单笔 0.770%→1.204%;
#   全史 111449.83%→127423.27%/卡玛 2.78→2.85, 回撤 -24.72% 逐位不变, 笔数 1332→1075。
#   起因: 用户问"成交数为何一直不变" —— 拆解后发现笔数由三道闸门(风控355天/评分门275天/承接线237天)
#   决定, 最近几轮改的都是仓位乘数, 本就不该改变笔数; 真正该动的是"零期望票占住单吊唯一名额"。
#   同轮证伪: 评分门 0.95/0.90/0.85(655/686/710 笔, 单笔 0.754/0.648/0.653%)、池深缩放门槛(808 笔/0.521%)、
