<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股次日操作计划</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #12161f; --panel2: #171c26; --border: #232a36;
    --text: #e6edf3; --muted: #8b949e; --gold: #d4a017; --red: #f85149;
    --green: #3fb950; --blue: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: "PingFang SC","Microsoft YaHei",-apple-system,sans-serif; line-height: 1.65; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 56px; }
  header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
  h1 { font-size: 24px; color: var(--gold); letter-spacing: 1px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .meta b { color: var(--text); font-weight: 600; }

  /* 主计划卡片 */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 20px 20px 18px; margin-bottom: 16px; }
  .stock { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .stock .name { font-size: 26px; font-weight: 700; }
  .stock .code { color: var(--muted); font-size: 14px; }
  .stock .pct { font-size: 16px; font-weight: 600; }
  .up { color: var(--red); } .down { color: var(--green); }
  .tagline { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .tagline b { color: var(--text); }

  /* 时间线 */
  .timeline { display: flex; gap: 0; margin: 18px 0; }
  .tnode { flex: 1; text-align: center; position: relative; }
  .tnode:not(:last-child)::after { content: ""; position: absolute; top: 13px; right: -50%;
      width: 100%; height: 2px; background: var(--border); z-index: 0; }
  .tnum { position: relative; z-index: 1; display: inline-block; width: 28px; height: 28px;
          line-height: 28px; border-radius: 50%; background: var(--panel2);
          border: 1px solid var(--border); color: var(--gold); font-weight: 700; font-size: 13px; }
  .tlabel { font-size: 13px; color: var(--text); margin-top: 6px; font-weight: 600; }
  .tdate { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* 操作指令 */
  .order { border: 1px solid var(--gold); border-radius: 10px; padding: 14px 16px;
           background: linear-gradient(180deg, rgba(212,160,23,.08), transparent); }
  .order .k { color: var(--gold); font-size: 12px; font-weight: 600; letter-spacing: 2px; margin-bottom: 6px; }
  .order .rule { font-size: 15px; }
  .order .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  .kv { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
  .kv .k { color: var(--muted); font-size: 12px; }
  .kv .v { font-size: 16px; font-weight: 600; margin-top: 2px; }

  ul.rules { padding-left: 20px; font-size: 13px; color: var(--muted); }
  ul.rules li { margin: 5px 0; }
  ul.rules li b { color: var(--text); }
  .abort li { color: var(--red); }
  .abort li b { color: var(--red); }

  .block-title { font-size: 13px; color: var(--gold); font-weight: 600; margin: 16px 0 8px; letter-spacing: 1px; }

  footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);
           color: var(--muted); font-size: 12px; }
  .loading, .empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>明日操作计划</h1>
    <div class="meta" id="meta"></div>
  </header>

  <main id="main"><div class="loading">加载中…</div></main>

  <footer id="footer"></footer>
</div>

<script>
const esc = s => { const d = document.createElement("div"); d.textContent = (s == null ? "" : String(s)); return d.innerHTML; };
const pctStr = v => (v == null || isNaN(v)) ? "-" : (Number(v) > 0 ? "+" : "") + Number(v).toFixed(2) + "%";
const pctCls = v => Number(v) > 0 ? "up" : (Number(v) < 0 ? "down" : "");

function fmtDate(s) {
  if (!s) return "-";
  const p = String(s).split("-");
  return p.length === 3 ? `${p[1]}-${p[2]}` : s;
}

async function load() {
  const el = document.getElementById("main");
  const meta = document.getElementById("meta");
  const foot = document.getElementById("footer");
  try {
    const r = await fetch("./data/latest.json?t=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();

    // ── 数据获取时间 ──
    const t = d.update_time || "-";
    const sd = d.signal_date || "-";
    meta.innerHTML = `数据获取时间 <b>${esc(t)}</b> · 信号日 <b>${esc(sd)}</b>`;

    const m = d.plans && d.plans.main;
    if (!m) { el.innerHTML = '<div class="empty">今日无操作计划</div>'; }
    else {
      const step = (d.t1_decision && d.t1_decision.steps && d.t1_decision.steps[0]) || {};
      const dt = m.dates || {};
      const obs = Array.isArray(m.observe) ? m.observe : [];
      const abt = Array.isArray(m.abort) ? m.abort : [];

      el.innerHTML = `
      <div class="card">
        <div class="stock">
          <span class="name">${esc(m.name || "-")}</span>
          <span class="code">${esc(m.code || "")}</span>
          <span class="pct ${pctCls(m.pct)}">${pctStr(m.pct)}</span>
        </div>
        <div class="tagline">${m.signal ? esc(m.signal) : ""}</div>

        <div class="timeline">
          <div class="tnode"><span class="tnum">T</span><div class="tlabel">信号日</div><div class="tdate">${fmtDate(dt.signal)}</div></div>
          <div class="tnode"><span class="tnum">T+1</span><div class="tlabel">买入日</div><div class="tdate">${fmtDate(dt.buy)}</div></div>
          <div class="tnode"><span class="tnum">T+2</span><div class="tlabel">卖出日</div><div class="tdate">${fmtDate(dt.exit)}</div></div>
        </div>

        <div class="order">
          <div class="k">明日操作</div>
          <div class="rule">${esc(step.rule || m.exit || "-")}</div>
        </div>

        <div class="grid" style="margin-top:14px">
          <div class="kv"><div class="k">买入方式</div><div class="v">${esc((d.plan && d.plan.buy_point) || dt.buy || "-")}</div></div>
          <div class="kv"><div class="k">卖出方式</div><div class="v">${esc((d.plan && d.plan.sell_point) || m.exit || "-")}</div></div>
          <div class="kv"><div class="k">参考仓位</div><div class="v">${m.position_pct == null ? "-" : esc(m.position_pct) + "%"}</div></div>
          <div class="kv"><div class="k">评分</div><div class="v">${m.score == null ? "-" : esc(Number(m.score).toFixed(2))}</div></div>
        </div>

        ${obs.length ? `<div class="block-title">观察</div><ul class="rules">${obs.map(x => "<li>" + esc(x) + "</li>").join("")}</ul>` : ""}
        ${abt.length ? `<div class="block-title" style="color:var(--red)">放弃条件</div><ul class="rules abort">${abt.map(x => "<li>" + esc(x) + "</li>").join("")}</ul>` : ""}
      </div>`;
    }

    foot.innerHTML = esc(d.disclaimer || "本候选池为量化模型自动生成，仅供研究参考，不构成任何投资建议。股市有风险，入市需谨慎。");
  } catch (e) {
    meta.innerHTML = "";
    el.innerHTML = `<div class="empty">数据加载失败（${esc(e.message)}）</div>`;
  }
}
load();
</script>
</body>
</html>
